<script>
const ITEMS = [{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":1,"sceneSize":8,"globalIndex":1,"id":"5260","sceneScore":16,"question":"A 42-year-old woman presents with a 1-week history of painful swelling in her right knee and left ankle, bilateral red eyes, and painful mouth ulcers. She reports a recent episode of bloody diarrhea 4 weeks ago after consuming undercooked seafood during a trip abroad. Physical examination reveals conjunctivitis, oral aphthous ulcers, and tender enthesitis at the Achilles tendon insertion. Synovial fluid analysis from the knee shows elevated white blood cells (15,000/mm³) with no crystals or organisms on Gram stain and culture. Which of the following is the most appropriate initial therapy?","answers":[{"label":"A","text":"Prednisone\n(32%)"},{"label":"B","text":"Nonsteroidal anti-inflammatory drugs\n(40%)"},{"label":"C","text":"Colchicine\n(1%)"},{"label":"D","text":"Ceftriaxone\n(24%)"},{"label":"E","text":"Methotrexate\n(3%)"}],"explanation":"Explanation\nThis patient's presentation of oligoarthritis, conjunctivitis, mucocutaneous lesions, and enthesitis following a likely enteric infection is consistent with reactive arthritis. Synovial fluid is inflammatory but sterile. Nonsteroidal anti-inflammatory drugs (NSAIDs) are the first-line treatment.\n(Choice A)\nPrednisone\nWhile corticosteroids can be effective for inflammatory arthritis, they are not first-line for reactive arthritis due to concerns about prolonging the underlying immune response and potential infection risk. NSAIDs are preferred initially, with corticosteroids reserved for severe cases unresponsive to NSAIDs.\n(Choice B)\nNonsteroidal anti-inflammatory drugs\nNSAIDs are the first-line therapy for reactive arthritis to manage pain and inflammation in the joints and entheses.\n(Choice C)\nColchicine\nColchicine is used for gout or pseudogout, but the absence of crystals in synovial fluid and the systemic features point to reactive arthritis, not crystal arthropathy.\n(Choice D)\nCeftriaxone\nCeftriaxone is appropriate for septic arthritis caused by bacterial pathogens, but this patient's sterile synovial fluid, post-enteric trigger, and extra-articular manifestations (conjunctivitis, oral ulcers, enthesitis) are classic for reactive arthritis, which is an aseptic inflammatory condition that does not require antibiotic therapy.\n(Choice E)\nMethotrexate\nMethotrexate is a disease-modifying antirheumatic drug (DMARD) used for chronic inflammatory arthritides like rheumatoid arthritis. Reactive arthritis typically has a self-limited course lasting weeks to months, making DMARDs inappropriate as initial therapy. NSAIDs address the acute inflammatory symptoms effectively.","likely":"B.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":2,"sceneSize":8,"globalIndex":2,"id":"5255","sceneScore":15,"question":"A 55-year-old man with a history of type 2 diabetes mellitus and chronic kidney disease presents to the emergency department with sudden onset of severe pain, swelling, and redness in his left ankle. He reports difficulty bearing weight on the affected leg and has a fever of 100.8°F (38.2°C). Physical examination reveals warmth, erythema, and markedly restricted range of motion in the ankle joint. He denies recent trauma but mentions a recent urinary tract infection treated with oral antibiotics. Laboratory studies shown below.  What is the most appropriate initial management for this patient's condition?\n\n\n\nTest\tValue\tUnits\nWhite Blood Cells (WBC)\t14,000\t/µL\nRed Blood Cells (RBC)\t4.9\t×10⁶/µL\nHemoglobin\t14.5\tg/dL\nHematocrit\t43\t%\nMean Corpuscular Volume (MCV)\t89\tfL\nPlatelet Count\t280\t×10³/µL\nMean Platelet Volume (MPV)\t9.2\tfL","answers":[{"label":"A","text":"Intravenous antibiotics and joint aspiration\n(73.53%)"},{"label":"B","text":"Biologic disease-modifying antirheumatic drug\n(0%)"},{"label":"C","text":"Allopurinol\n(0%)"},{"label":"D","text":"Nonsteroidal anti-inflammatory drugs\n(14.71%)"},{"label":"E","text":"Colchicine\n(11.76%)"}],"explanation":"Explanation\nThis patient presents with acute monoarthritis, fever, and systemic symptoms highly suggestive of septic arthritis. Risk factors include diabetes mellitus (immunocompromised state), chronic kidney disease, and recent urinary tract infection as a potential source of bacteremia. The combination of intravenous antibiotics and urgent joint aspiration is essential - synovial fluid analysis confirms the diagnosis while immediate antibiotic therapy prevents irreversible joint destruction that can occur within 24-48 hours. Alternative treatments like gout medications (allopurinol, colchicine), immunosuppressive agents (steroids, biologics), or symptomatic therapy (NSAIDs) are inappropriate and potentially dangerous in this infectious emergency.\n(Choice A)\nIntravenous antibiotics and joint aspiration\nThis is the correct initial management, as prompt synovial fluid analysis confirms the diagnosis of septic arthritis, and intravenous antibiotics with joint drainage prevent joint destruction.\n(Choice B)\nBiologic disease-modifying antirheumatic drug\nBiologic DMARDs (such as TNF inhibitors) are immunosuppressive agents used for chronic inflammatory arthritides like rheumatoid arthritis. In suspected septic arthritis, these agents would be contraindicated as they significantly increase infection risk and could lead to life-threatening complications.\n(Choice C)\nAllopurinol\nAllopurinol is a xanthine oxidase inhibitor used for chronic gout prophylaxis by reducing uric acid production. It has no role in treating acute joint infections and would not address the underlying bacterial pathogen in septic arthritis.\n(Choice D)\nNonsteroidal anti-inflammatory drugs\nWhile NSAIDs may provide symptomatic pain relief, they do not treat the underlying bacterial infection and can mask fever and other systemic signs of sepsis. Delaying appropriate antibiotic therapy in septic arthritis can result in irreversible joint destruction within hours to days.\n(Choice E)\nColchicine\nColchicine is used for acute gout flares by inhibiting neutrophil migration and reducing uric acid crystal-induced inflammation. However, this patient's presentation with fever and systemic symptoms suggests bacterial infection rather than crystal arthropathy, making colchicine inappropriate.","likely":"A.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":3,"sceneSize":8,"globalIndex":3,"id":"1784","sceneScore":15,"question":"A 50-year-old man presents to the emergency department with severe pain and swelling in his right shoulder for the past 48 hours. He reports feeling generally unwell with shaking chills and has noticed a swollen, tender shoulder with no recent trauma history. He has a history of chronic kidney disease and osteoarthritis managed with NSAIDs, which he has been taking regularly. Recent laboratory results show a white blood cell count of 15,000/mm³ and elevated erythrocyte sedimentation rate (ESR). His temperature is 39°C (102.2°F), pulse is 92/min, and his blood pressure is 130/85 mmHg. Examination shows marked tenderness and limitation of motion in the right shoulder joint. What is the most appropriate initial treatment for this patient given his presentation?","answers":[{"label":"A","text":"Non-steroidal anti-inflammatory drugs\n(7.33%)"},{"label":"B","text":"Intravenous Antibiotics and Drainage\n(84%)"},{"label":"C","text":"Oral Corticosteroids\n(4.67%)"},{"label":"D","text":"Biologic DMARDs\n(1.33%)"},{"label":"E","text":"Colchicine\n(2.67%)"}],"explanation":"Explanation\nSeptic arthritis presents as an acute monoarthritis with fever, joint pain, and systemic symptoms. The combination of fever (39°C), elevated WBC (15,000/mm³), elevated ESR, and acute onset strongly suggests bacterial joint infection. Patients with chronic kidney disease have increased infection risk due to impaired immune function. Emergency joint aspiration for synovial fluid analysis and culture, combined with immediate empiric IV antibiotics, is essential to prevent irreversible cartilage destruction and osteomyelitis. Delay in treatment can result in permanent joint damage within 24-48 hours.\n(Choice A)\nNon-steroidal anti-inflammatory drugs\nWhile NSAIDs can reduce inflammation and pain, they are contraindicated in suspected septic arthritis because they can mask fever and other signs of infection, potentially delaying appropriate treatment. Additionally, this patient has chronic kidney disease, making NSAIDs potentially nephrotoxic.\n(Choice B)\nIntravenous Antibiotics and Drainage\nSeptic arthritis requires immediate administration of IV antibiotics and joint drainage to prevent joint destruction and systemic spread of infection.\n(Choice C)\nOral Corticosteroids\nOral corticosteroids are contraindicated in suspected septic arthritis because they suppress the immune response and can worsen bacterial infections. Additionally, corticosteroids can mask fever and other inflammatory signs, potentially delaying recognition of treatment failure or complications.\n(Choice D)\nBiologic DMARDs\nBiologic DMARDs (such as TNF inhibitors) are used for autoimmune inflammatory arthritis but are absolutely contraindicated in active infections. These agents significantly increase infection risk by suppressing key immune pathways, which would be dangerous in suspected septic arthritis.\n(Choice E)\nColchicine\nColchicine is used specifically for acute gout attacks by inhibiting neutrophil migration and reducing uric acid crystal-induced inflammation. This patient's presentation with fever, elevated WBC, and systemic symptoms is consistent with septic arthritis, not crystalline arthropathy.","likely":"B.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":4,"sceneSize":8,"globalIndex":4,"id":"1092","sceneScore":15,"question":"A 60-year-old woman presents with sudden-onset swelling and pain in her left ankle over the last 48 hours. She has been experiencing fatigue, mild abdominal pain, and mental fogginess for the past few months, but has not seen a doctor until now. She denies recent travel, trauma, or signs of infection like fever. She has a history of hypertension but does not consume tobacco, alcohol, or recreational drugs. Her temperature is 36.8°C (98.2°F) and blood pressure reads 135/85 mmHg. Examination reveals swelling, tenderness, and erythema over the left ankle. Laboratory findings show:\n\n- Serum sodium: 140 mEq/L\n- Serum potassium: 4.4 mEq/L\n- Serum creatinine: 1.0 mg/dL\n- Serum calcium: 12.1 mg/dL\n- Serum phosphorous: 2.0 mg/dL\n- Blood glucose: 96 mg/dL\n\nWhat would joint fluid analysis from the ankle most likely show?","answers":[{"label":"A","text":"Polymorphonuclear leukocytes with gram-negative bacilli\n(5.6%)"},{"label":"B","text":"Lipid droplets and cholesterol crystals\n(0.8%)"},{"label":"C","text":"Rhomboid-shaped calcium pyrophosphate crystals\n(89.6%)"},{"label":"D","text":"Budding yeast and lymphocytes\n(0%)"},{"label":"E","text":"Presence of monosodium urate crystals\n(4%)"}],"explanation":"Explanation\nThe patient's presentation of acute monoarthritis with hypercalcemia (12.1 mg/dL; normal 8.5-10.5), fatigue, abdominal pain, and mental fogginess suggests hyperparathyroidism complicated by pseudogout. Synovial fluid analysis would show calcium pyrophosphate dihydrate crystals that are rhomboid-shaped and weakly positively birefringent. Hyperparathyroidism predisposes to pseudogout through calcium deposition in fibrocartilage.\n(Choice A)\nPolymorphonuclear leukocytes with gram-negative bacilli\nPolymorphonuclear leukocytes with gram-negative bacilli would indicate bacterial septic arthritis. However, this patient lacks fever, has normal vital signs, and the hypercalcemia with systemic symptoms points toward a metabolic cause of crystal arthropathy rather than infection.\n(Choice B)\nLipid droplets and cholesterol crystals\nLipid droplets and cholesterol crystals are extremely rare findings in synovial fluid and are not associated with any common arthropathy. They do not correlate with this patient's hypercalcemia or acute monoarthritis presentation.\n(Choice C)\nRhomboid-shaped calcium pyrophosphate crystals\nCalcium pyrophosphate dihydrate crystals are rhomboid-shaped and weakly positively birefringent, diagnostic of pseudogout (chondrocalcinosis). This patient's hypercalcemia (12.1 mg/dL) with fatigue, abdominal pain, and mental fogginess suggests hyperparathyroidism, a known predisposing condition for pseudogout.\n(Choice D)\nBudding yeast and lymphocytes\nBudding yeast with lymphocytes would suggest fungal septic arthritis, which typically presents as chronic, indolent joint infection over weeks to months. This patient's acute 48-hour onset makes bacterial or crystal arthropathy much more likely.\n(Choice E)\nPresence of monosodium urate crystals\nMonosodium urate crystals are needle-shaped and negatively birefringent, characteristic of gout. While gout can affect the ankle, this patient's hypercalcemia (12.1 mg/dL; normal 8.5-10.5) and systemic symptoms suggest pseudogout associated with hyperparathyroidism rather than gout.","likely":"C.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":5,"sceneSize":8,"globalIndex":5,"id":"1494","sceneScore":15,"question":"A 50-year-old male arrives at the clinic with severe pain, significant swelling, and an inflamed appearance around his left ankle. He recalls a previous severe episode of ankle pain a few months ago that went away with non-steroidal anti-inflammatory drugs (NSAIDs). He has a medical history of obesity, hypertension, and chronic kidney disease. He reports no illicit drug use. His vital signs reveal a temperature of 38.0°C (100.4°F), blood pressure of 115/70 mmHg, and pulse rate of 102/min. On examination, his left ankle is swollen, tender, and has limited movement due to pain. Based on his presentation, what is the most appropriate next step in management?","answers":[{"label":"A","text":"Repeat dose of NSAIDs\n(4.93%)"},{"label":"B","text":"MRI of the ankle\n(4.23%)"},{"label":"C","text":"X-ray of the ankle\n(9.86%)"},{"label":"D","text":"Synovial fluid analysis\n(70.42%)"},{"label":"E","text":"Serum uric acid level\n(10.56%)"}],"explanation":"Explanation\nGiven this patient's symptoms of acute joint pain, especially with his history, synovial fluid analysis remains the most accurate method to confirm a diagnosis of gout. This procedure distinguishes it from potential septic arthritis, which requires different treatment. Misidentifying septic arthritis can lead to joint destruction if untreated. For educational purposes, a joint aspiration would reveal: - Elevated white blood cell count (typically 20,000 to 100,000 WBC/mL). - Presence of needle-shaped, negatively birefringent monosodium urate crystals under polarized light. Septic arthritis could show similar joint symptoms but usually has purulent fluid with a positive bacterial culture, necessitating urgent antibiotic treatment.\n(Choice A)\nRepeat dose of NSAIDs\nWhile NSAIDs may provide symptomatic relief for gout, empirical treatment without definitive diagnosis is inappropriate given this patient's fever and need to exclude septic arthritis. Additionally, NSAIDs should be used cautiously in this patient with chronic kidney disease.\n(Choice B)\nMRI of the ankle\nWhile MRI can visualize detailed soft tissue changes, synovial fluid analysis is more accessible and specific for differentiating conditions like gout.\n(Choice C)\nX-ray of the ankle\nPlain radiographs are typically normal in early gout and may only show chronic changes like joint space narrowing, erosions, or tophi after years of recurrent attacks. They cannot differentiate between gout and septic arthritis in acute presentations.\n(Choice D)\nSynovial fluid analysis\nTo confirm a diagnosis of gout, the synovial fluid would typically show elevated white blood cells and uric acid crystals, as well as eliminate concerns for septic arthritis.\n(Choice E)\nSerum uric acid level\nSerum uric acid levels can be normal or even low during acute gout attacks due to acute inflammatory response and rapid urate crystal precipitation. Additionally, elevated uric acid alone does not confirm gout, as many people with hyperuricemia never develop gout.","likely":"D.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":6,"sceneSize":8,"globalIndex":6,"id":"5157","sceneScore":15,"question":"A 72-year-old man with a history of primary hyperparathyroidism presents to the emergency department with sudden onset of severe pain, swelling, and redness in his left wrist. He reports no recent trauma, fever, or systemic symptoms, but notes similar episodes in the past that resolved spontaneously. On examination, the wrist is warm, tender, and has limited range of motion. Laboratory tests show an elevated erythrocyte sedimentation rate but normal white blood cell count. Radiograph of the wrist reveals linear calcifications within the triangular fibrocartilage complex. Synovial fluid aspiration demonstrates turbid fluid with 25,000 white blood cells/μL (predominantly neutrophils) and a microscopy is shown below. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"B. Calcium pyrophosphate arthritis\n(95.24%)"},{"label":"B","text":"F. Reactive arthritis\n(0%)"},{"label":"C","text":"E. Osteoarthritis\n(1.59%)"},{"label":"D","text":"A. Gout\n(3.17%)"},{"label":"E","text":"D. Rheumatoid arthritis\n(0%)"}],"explanation":"Explanation\nThe patient exhibits features of acute calcium pyrophosphate dihydrate (CPPD) crystal arthritis (pseudogout), including age >70, acute monoarticular arthritis in the wrist, history of hyperparathyroidism (a risk factor), chondrocalcinosis on imaging, and synovial fluid findings of inflammatory effusion with weak positively birefringent rhomboid crystals. These distinguish it from other arthritides such as gout, septic arthritis, rheumatoid arthritis, osteoarthritis, or reactive arthritis.\n(Choice A)\nB. Calcium pyrophosphate arthritis\nThis is the correct diagnosis, as the clinical presentation, radiographic chondrocalcinosis, and synovial fluid findings of positively birefringent rhomboid crystals are characteristic of CPPD crystal arthritis (pseudogout), especially in the context of hyperparathyroidism.\n(Choice B)\nF. Reactive arthritis\nReactive arthritis usually follows a genitourinary or gastrointestinal infection, presents with asymmetric oligoarthritis, and may include extra-articular features like uveitis or enthesitis, without chondrocalcinosis or specific crystal findings.\n(Choice C)\nE. Osteoarthritis\nOsteoarthritis is a degenerative joint disease with chronic pain, joint space narrowing, and osteophytes on imaging, without acute inflammation, elevated inflammatory markers, or crystal findings in synovial fluid.\n(Choice D)\nA. Gout\nGout presents with strongly negatively birefringent needle-shaped monosodium urate crystals in synovial fluid, not the weakly positively birefringent rhomboid crystals seen here. While gout can occur with hyperparathyroidism, the radiographic chondrocalcinosis and crystal morphology are characteristic of CPPD arthritis.\n(Choice E)\nD. Rheumatoid arthritis\nRheumatoid arthritis is a chronic systemic inflammatory condition that typically affects multiple joints symmetrically, particularly small joints of the hands and feet. It would not present with acute monoarticular arthritis, chondrocalcinosis, or crystal deposition in synovial fluid.","likely":"A.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":7,"sceneSize":8,"globalIndex":7,"id":"3210","sceneScore":15,"question":"A 32-year-old man with a known history of hemophilia B presents to the clinic with progressive pain and stiffness in his left elbow. He reports a lifelong history of easy bruising and spontaneous joint bleeds, particularly in his elbows and knees, but admits to inconsistent adherence to prophylactic factor IX infusions due to financial constraints. Physical examination reveals limited range of motion in the affected elbow with crepitus and mild swelling. Radiographs are shown below. Which of the following best describes the primary pathophysiological mechanism underlying this patient's chronic joint damage?","answers":[{"label":"A","text":"Urate crystal deposition and tophus formation\n(0%)"},{"label":"B","text":"Bacterial invasion and septic synovitis\n(0%)"},{"label":"C","text":"Calcium pyrophosphate deposition and chondrocalcinosis\n(4.94%)"},{"label":"D","text":"Amyloid protein accumulation and villonodular synovitis\n(0%)"},{"label":"E","text":"Hemosiderin deposition and fibrosis\n(95.06%)"}],"explanation":"Explanation\nThis patient with hemophilia B has developed hemophilic arthropathy due to recurrent hemarthroses in his elbow. The condition arises from repeated intra-articular bleeding, leading to hemosiderin deposition within the synovium, which triggers chronic inflammation, synovial hypertrophy, fibrosis, and eventual destruction of cartilage and bone. Prophylactic factor replacement therapy can significantly reduce the risk of such complications by preventing bleeding episodes.\n(Choice A)\nUrate crystal deposition and tophus formation\nThis describes gouty arthritis caused by monosodium urate crystal deposition in joints. While gout can cause chronic joint damage, it is unrelated to bleeding disorders and would present with acute attacks of severe joint pain, typically affecting the first metatarsophalangeal joint initially.\n(Choice B)\nBacterial invasion and septic synovitis\nSeptic arthritis involves bacterial infection of the joint space causing acute purulent synovitis. This patient's chronic, progressive course without fever or acute inflammatory signs, combined with his bleeding disorder history, makes infectious etiology unlikely.\n(Choice C)\nCalcium pyrophosphate deposition and chondrocalcinosis\nThis refers to pseudogout or calcium pyrophosphate deposition disease, which can cause joint inflammation but is not associated with hemophilia or recurrent bleeding.\n(Choice D)\nAmyloid protein accumulation and villonodular synovitis\nPigmented villonodular synovitis (PVNS) is a benign proliferative disorder of synovial tissue that can cause joint destruction. While PVNS can involve hemosiderin deposition, it is not caused by recurrent bleeding episodes and typically presents as a monoarticular process in younger adults without underlying bleeding disorders.\n(Choice E)\nHemosiderin deposition and fibrosis\nRecurrent hemarthroses in hemophilia lead to iron (hemosiderin) accumulation in the synovium, causing chronic synovitis, fibrosis, and progressive joint destruction.","likely":"E.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Hot single joint","sceneHook":"Septic arthritis vs crystal: aspirate before steroids, always","indexInScene":8,"sceneSize":8,"globalIndex":8,"id":"5290","sceneScore":15,"question":"A 45-year-old woman with a history of chronic kidney disease and recent initiation of diuretic therapy presents to the emergency department with sudden onset of severe pain, swelling, and erythema in her left knee. She reports no recent trauma or fever, but notes increased alcohol consumption over the weekend. Vital signs are normal except for mild hypertension. Arthrocentesis reveals turbid synovial fluid with a white blood cell count of 25,000/mm³ (80% neutrophils). Under compensated polarized light microscopy, needle-shaped crystals that appear yellow when parallel to the compensator and blue when perpendicular are observed. Gram stain and culture are negative. What is the most likely pathophysiologic mechanism responsible for this patient's acute monoarthritis?","answers":[{"label":"A","text":"Inflammatory reaction to monosodium urate crystals\n(87.72%)"},{"label":"B","text":"Fungal colonization of the joint space\n(0%)"},{"label":"C","text":"Deposition of calcium pyrophosphate dihydrate crystals\n(10.53%)"},{"label":"D","text":"Autoimmune-mediated synovial inflammation\n(1.75%)"},{"label":"E","text":"Bacterial infection of the joint space\n(0%)"}],"explanation":"Explanation\nThis patient has acute gouty arthritis, presenting as an intensely painful monoarthritis in the knee, triggered by diuretic use and alcohol intake in the setting of chronic kidney disease. Synovial fluid analysis reveals leukocytosis with predominant neutrophils and needle-shaped, negatively birefringent monosodium urate crystals, distinguishing it from other causes like septic arthritis, pseudogout, or autoimmune conditions.\n(Choice A)\nInflammatory reaction to monosodium urate crystals\nAcute gout results from the inflammatory response to monosodium urate crystal deposition in the joint, leading to acute monoarthritis with characteristic synovial fluid findings of needle-shaped, negatively birefringent crystals.\n(Choice B)\nFungal colonization of the joint space\nFungal arthritis is uncommon, typically occurs in immunocompromised patients, presents with a more indolent course, and would show fungal elements on KOH prep or special stains rather than crystals.\n(Choice C)\nDeposition of calcium pyrophosphate dihydrate crystals\nPseudogout (chondrocalcinosis) involves rhomboid-shaped, positively birefringent calcium pyrophosphate dihydrate crystals that appear blue when parallel to the compensator, opposite to the described findings.\n(Choice D)\nAutoimmune-mediated synovial inflammation\nConditions like rheumatoid arthritis or lupus involve immune complexes but present with chronic polyarthritis and lack crystal findings on synovial analysis.\n(Choice E)\nBacterial infection of the joint space\nSeptic arthritis typically presents with fever, systemic symptoms, and higher synovial WBC counts (usually >50,000/mm³), with positive Gram stain or culture. The negative cultures and presence of crystals rule this out.","likely":"A.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":1,"sceneSize":8,"globalIndex":9,"id":"1600","sceneScore":14,"question":"A 45-year-old female presents with recurrent episodes of joint swelling and significant discomfort predominantly affecting her fingers and wrists. She reports intense morning stiffness lasting several hours, which gradually improves as the day progresses. Physical examination reveals nail pitting, and some digits appear swollen like 'sausages.' A clinical image depicting these features is provided.","answers":[{"label":"A","text":"Gout\n(0%)"},{"label":"B","text":"Psoriatic arthritis\n(95.04%)"},{"label":"C","text":"Lupus arthropathy\n(1.65%)"},{"label":"D","text":"Rheumatoid arthritis\n(3.31%)"},{"label":"E","text":"Calcium pyrophosphate dihydrate arthropathy\n(0%)"}],"explanation":"Explanation\nPsoriatic arthritis is an inflammatory arthritis affecting 5-30% of patients with psoriasis. Key clinical features include asymmetric oligoarthritis, distal interphalangeal joint involvement, dactylitis ('sausage digits'), nail changes (pitting, onycholysis), and prolonged morning stiffness. Early diagnosis is important as untreated disease can lead to joint destruction. First-line treatment typically includes NSAIDs for mild disease, with DMARDs (methotrexate) or biologics (TNF inhibitors) for more severe or progressive disease.\n(Choice A)\nGout\nGout typically presents as acute monoarticular attacks, most commonly affecting the first metatarsophalangeal joint. The chronic symmetric polyarthritis, nail pitting, and dactylitis described here are inconsistent with gout.\n(Choice B)\nPsoriatic arthritis\nPsoriatic arthritis can feature dactylitis and nail changes like pitting and onycholysis. It typically affects the DIP joints and may cause prolonged morning stiffness, which aligns with this clinical presentation.\n(Choice C)\nLupus arthropathy\nSystemic lupus erythematosus can cause non-erosive arthritis but typically presents with constitutional symptoms (fatigue, fever), malar rash, and other systemic manifestations. Nail pitting and dactylitis are not features of lupus arthropathy.\n(Choice D)\nRheumatoid arthritis\nWhile rheumatoid arthritis can cause morning stiffness and symmetric polyarthritis, it characteristically spares the distal interphalangeal joints and does not cause nail pitting or dactylitis. RA typically affects MCP and PIP joints in a symmetric pattern.\n(Choice E)\nCalcium pyrophosphate dihydrate arthropathy\nCalcium pyrophosphate dihydrate arthropathy (pseudogout) typically affects fibrocartilaginous joints like the knees and wrists, often with chondrocalcinosis on imaging. It does not cause the nail changes or dactylitis characteristic of psoriatic arthritis.","likely":"B.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":2,"sceneSize":8,"globalIndex":10,"id":"5173","sceneScore":14,"question":"A 62-year-old woman with a history of hypertension managed with hydrochlorothiazide presents to the emergency department with sudden onset of severe pain in her left elbow. The pain began approximately 10 hours ago while she was gardening in hot weather and has rapidly intensified to the point where she cannot move the joint. She reports feeling dehydrated after spending several hours outdoors without adequate fluid intake. On examination, the left elbow is erythematous, warm, swollen, and exquisitely tender to touch. There is no history of trauma, fever, or recent infections. Laboratory studies show an elevated serum uric acid level. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Septic arthritis\n(0%)"},{"label":"B","text":"Rheumatoid arthritis\n(0%)"},{"label":"C","text":"Osteoarthritis\n(0%)"},{"label":"D","text":"Gout\n(93.65%)"},{"label":"E","text":"Calcium pyrophosphate dihydrate crystal arthropathy\n(6.35%)"}],"explanation":"Explanation\nThis patient presents with acute, rapidly progressing elbow pain that reached maximum intensity within about 10 hours, with risk factors including diuretic use and dehydration. The clinical picture suggests gout, characterized by acute monoarticular arthritis with rapid progression. The diagnosis is supported by the trigger of dehydration and medication history, along with elevated serum uric acid.\n(Choice A)\nSeptic arthritis\nSeptic arthritis typically presents with fever, systemic symptoms, and often has risk factors such as immunocompromise, joint instrumentation, or bacteremia. The absence of fever, systemic illness, and infectious risk factors, combined with the classic rapid onset pattern, make this diagnosis less likely than crystal arthropathy.\n(Choice B)\nRheumatoid arthritis\nRheumatoid arthritis usually presents with symmetric polyarticular involvement and morning stiffness, not acute monoarticular pain with rapid onset.\n(Choice C)\nOsteoarthritis\nOsteoarthritis is a chronic degenerative condition with gradual onset of pain, not acute rapid progression to severe intensity in a single joint.\n(Choice D)\nGout\nGout is the correct diagnosis, as it presents with acute monoarticular arthritis that rapidly progresses to peak intensity within 12-24 hours, often triggered by dehydration or diuretics like hydrochlorothiazide, which can elevate uric acid levels.\n(Choice E)\nCalcium pyrophosphate dihydrate crystal arthropathy\nPseudogout (calcium pyrophosphate dihydrate crystal arthropathy) can present similarly to gout with acute monoarticular arthritis, but it typically affects fibrocartilaginous joints like the knee or wrist, is less commonly triggered by dehydration or diuretics, and shows chondrocalcinosis on imaging. The elbow location and clear precipitating factors favor gout.","likely":"D.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":3,"sceneSize":8,"globalIndex":11,"id":"5344","sceneScore":12,"question":"A 62-year-old man with a history of heavy alcohol consumption and obesity presents to the clinic with painless, firm nodules on his elbows and the helix of his ears. He reports a 15-year history of intermittent, excruciating pain and swelling in his right knee and left great toe, which typically resolve after a few days with over-the-counter pain medication. Physical examination reveals nodular deformities around the interphalangeal joints of his hands and limited range of motion in the affected knee. Laboratory studies show a serum uric acid level of 9.2 mg/dL (normal <6.8 mg/dL). What is the most likely composition of the deposits causing his nodular deformities?","answers":[{"label":"A","text":"Hydroxyapatite\n(0%)"},{"label":"B","text":"Cholesterol crystals\n(2.6%)"},{"label":"C","text":"Amyloid protein\n(0%)"},{"label":"D","text":"Calcium pyrophosphate dihydrate\n(18.18%)"},{"label":"E","text":"Monosodium urate\n(79.22%)"}],"explanation":"Explanation\nThis patient has tophaceous gout, resulting from chronic hyperuricemia leading to monosodium urate (MSU) crystal deposition in joints and soft tissues. Initial episodes involve monoarthritis of the knee and first metatarsophalangeal joint, progressing to chronic inflammation and tophi formation in areas like the hands, elbows, and ears.\n(Choice A)\nHydroxyapatite\nHydroxyapatite crystals cause calcific tendinitis and Milwaukee shoulder syndrome, typically presenting with acute periarticular pain and calcifications visible on imaging. These deposits affect tendons and bursae rather than forming the chronic nodular deformities (tophi) characteristic of gout, and they are not associated with hyperuricemia or the pattern of episodic monoarthritis described.\n(Choice B)\nCholesterol crystals\nCholesterol crystals form xanthomas or atherosclerotic plaques but do not cause inflammatory arthritis. While cholesterol deposits can appear as nodular lesions in tendons (tendinous xanthomas), they are typically associated with hyperlipidemia rather than hyperuricemia and do not cause the episodic inflammatory monoarthritis pattern characteristic of gout.\n(Choice C)\nAmyloid protein\nAmyloid deposits occur in systemic amyloidosis, affecting organs like the heart, kidneys, and liver, or in localized forms affecting joints in conditions like dialysis-related amyloidosis. However, amyloid deposits do not cause the pattern of episodic monoarthritis followed by hyperuricemia and characteristic tophi formation in the ears and elbows seen in this patient.\n(Choice D)\nCalcium pyrophosphate dihydrate\nCalcium pyrophosphate dihydrate crystals cause pseudogout (chondrocalcinosis), which typically presents with acute arthritis affecting fibrocartilaginous joints like the knee or wrist in older adults. While pseudogout can cause joint damage over time, it does not form the characteristic soft tissue nodules (tophi) seen in the ears and elbows, nor does it cause the hyperuricemia seen in this patient.\n(Choice E)\nMonosodium urate\nMonosodium urate crystals deposit in joints and soft tissues due to persistent hyperuricemia, leading to tophaceous gout with chronic inflammation and nodular deformities, as seen in this patient's history of episodic monoarthritis progressing to chronic tophi.","likely":"E.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":4,"sceneSize":8,"globalIndex":12,"id":"5168","sceneScore":12,"question":"A 58-year-old man with a history of type 2 diabetes mellitus and chronic fatigue presents to the clinic with progressive bilateral shoulder pain and stiffness over the past 6 months. He reports occasional swelling in his hands and knees but denies acute flares. Physical examination reveals limited range of motion in the shoulders, mild hepatomegaly, and subtle bronze skin discoloration. Laboratory evaluation shows mildly elevated transaminases. Radiograph of the knee is shown below. Which of the following is the most appropriate initial diagnostic test to evaluate the suspected underlying systemic condition?","answers":[{"label":"A","text":"Antinuclear antibody testing\n(0%)"},{"label":"B","text":"Serum ceruloplasmin level\n(17.78%)"},{"label":"C","text":"Liver biopsy\n(2.22%)"},{"label":"D","text":"Serum iron studies\n(73.33%)"},{"label":"E","text":"Synovial fluid crystal analysis\n(6.67%)"}],"explanation":"Explanation\nThis patient has chronic arthropathy with chondrocalcinosis suggestive of calcium pyrophosphate dihydrate (CPPD) deposition disease, along with diabetes, hepatomegaly, and skin changes raising suspicion for hereditary hemochromatosis (HH). HH is associated with iron deposition that promotes CPPD in joints. Initial evaluation for iron overload involves serum iron studies (eg, ferritin, transferrin saturation). Genetic testing confirms the diagnosis, while phlebotomy is the mainstay of treatment. Synovial fluid analysis is useful for acute pseudogout but not initial here. Liver biopsy is invasive and not first-line. Ceruloplasmin assesses for Wilson disease, and ANA is for autoimmune conditions like rheumatoid arthritis.\n(Choice A)\nAntinuclear antibody testing\nANA testing screens for autoimmune connective tissue diseases such as systemic lupus erythematosus or rheumatoid arthritis. However, this patient's presentation with chondrocalcinosis, diabetes, hepatomegaly, and bronze skin discoloration is more consistent with iron overload (hereditary hemochromatosis) than autoimmune arthritis.\n(Choice B)\nSerum ceruloplasmin level\nThis test evaluates for Wilson disease, which can cause liver issues and arthropathy but is not associated with chondrocalcinosis or bronze skin in this context.\n(Choice C)\nLiver biopsy\nThis is invasive and typically reserved for cases where non-invasive tests are inconclusive; it is not the initial step.\n(Choice D)\nSerum iron studies\nThis is the correct initial test to evaluate for iron overload in suspected hereditary hemochromatosis, which is associated with CPPD deposition and the patient's systemic features.\n(Choice E)\nSynovial fluid crystal analysis\nWhile synovial fluid crystal analysis would confirm CPPD crystals and support the diagnosis of pseudogout, it is not the most appropriate initial test for evaluating the underlying systemic condition suggested by the patient's constellation of findings (diabetes, hepatomegaly, bronze skin discoloration, and chondrocalcinosis).","likely":"D.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":5,"sceneSize":8,"globalIndex":13,"id":"5174","sceneScore":12,"question":"A 72-year-old man with a history of primary hyperparathyroidism, previously managed with observation, presents to the emergency department with sudden onset of severe pain, swelling, and redness in his left wrist. He reports recent episodes of muscle weakness, constipation, and polyuria. Laboratory evaluation reveals serum calcium of 11.8 mg/dL (normal: 8.5-10.2 mg/dL) and elevated parathyroid hormone level. X-ray of the wrist shows linear calcification of the articular cartilage. Arthrocentesis yields turbid synovial fluid with a leukocyte count of 18,000/mm³ (80% neutrophils). Which of the following crystal morphologies is most likely to be observed in the synovial fluid under compensated polarized light microscopy?","answers":[{"label":"A","text":"Maltese cross formations\n(0%)"},{"label":"B","text":"Needle-shaped crystals\n(6.35%)"},{"label":"C","text":"Rhomboid-shaped crystals\n(74.6%)"},{"label":"D","text":"Envelope-shaped crystals\n(19.05%)"},{"label":"E","text":"Coffin-lid shaped crystals\n(0%)"}],"explanation":"Explanation\nThe patient has primary hyperparathyroidism causing chronic hypercalcemia, leading to pseudogout with acute wrist arthritis. Synovial fluid analysis will show an inflammatory effusion with rhomboid-shaped, positively birefringent calcium pyrophosphate dihydrate (CPPD) crystals.\n(Choice A)\nMaltese cross formations\nMaltese cross formations under polarized light are seen with lipid droplets or cholesterol crystals. While cholesterol crystals can occasionally be found in synovial fluid in chronic joint conditions, they would not cause acute inflammatory arthritis and are not associated with hyperparathyroidism or chondrocalcinosis.\n(Choice B)\nNeedle-shaped crystals\nNeedle-shaped, negatively birefringent crystals are characteristic of monosodium urate crystals in gout. While hyperparathyroidism can occasionally lead to hyperuricemia through increased uric acid reabsorption, the clinical presentation with chondrocalcinosis on x-ray and the association with chronic hypercalcemia strongly suggests pseudogout rather than gout.\n(Choice C)\nRhomboid-shaped crystals\nRhomboid-shaped, positively birefringent calcium pyrophosphate dihydrate (CPPD) crystals are diagnostic of pseudogout (acute CPPD crystal arthropathy). Chronic hypercalcemia from primary hyperparathyroidism promotes CPPD crystal deposition in cartilage (chondrocalcinosis), which can then shed into the joint space causing acute inflammatory arthritis.\n(Choice D)\nEnvelope-shaped crystals\nEnvelope-shaped crystals are typically calcium oxalate crystals seen in urine or tissues in conditions like ethylene glycol poisoning or primary hyperoxaluria, not in synovial fluid of crystal arthropathies.\n(Choice E)\nCoffin-lid shaped crystals\nCoffin-lid shaped crystals are triple phosphate (struvite) crystals found in urine in the setting of urinary tract infections with urease-producing bacteria, not in synovial fluid.","likely":"C.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":6,"sceneSize":8,"globalIndex":14,"id":"5265","sceneScore":12,"question":"A 78-year-old woman with a history of hypothyroidism and osteoarthritis is admitted to the hospital for management of acute decompensated heart failure. On hospital day 4, she develops sudden onset of severe pain, swelling, and redness in her left wrist. She is afebrile, and vital signs are stable. Arthrocentesis of the wrist joint yields cloudy synovial fluid with 30,000 white blood cells/µL (90% neutrophils), no bacteria on Gram stain, and rhomboid-shaped crystals that exhibit positive birefringence under compensated polarized light microscopy. Serum uric acid level is normal. Which of the following is the most likely finding on wrist radiography?","answers":[{"label":"A","text":"Punched-out lesions\n(5.36%)"},{"label":"B","text":"Osteophytes\n(0%)"},{"label":"C","text":"Marginal erosions\n(0%)"},{"label":"D","text":"Chondrocalcinosis\n(94.64%)"},{"label":"E","text":"Subchondral sclerosis\n(0%)"}],"explanation":"Explanation\nThe patient's acute monoarthritis in the setting of medical illness, with synovial fluid showing inflammatory cells and rhomboid-shaped, positively birefringent crystals, is characteristic of pseudogout. Radiographic chondrocalcinosis (linear calcification of articular cartilage) is commonly seen in this condition. Other findings like marginal erosions, subchondral sclerosis, osteophytes, punched-out lesions, or joint effusion alone do not specifically align with the crystal analysis and clinical context.\n(Choice A)\nPunched-out lesions\nPunched-out lesions (erosions with overhanging edges) are pathognomonic for chronic tophaceous gout caused by urate crystal deposits. However, this patient has rhomboid-shaped, positively birefringent calcium pyrophosphate crystals (not needle-shaped, negatively birefringent urate crystals) and a normal serum uric acid level.\n(Choice B)\nOsteophytes\nOsteophytes are bony spurs seen in osteoarthritis, but they do not explain the acute inflammatory arthritis with positively birefringent crystals.\n(Choice C)\nMarginal erosions\nMarginal erosions are characteristic of rheumatoid arthritis and typically develop over months to years. The acute presentation with rhomboid-shaped, positively birefringent calcium pyrophosphate crystals is diagnostic of pseudogout, not RA.\n(Choice D)\nChondrocalcinosis\nChondrocalcinosis, or linear calcification of articular cartilage, is a classic radiographic finding in calcium pyrophosphate deposition disease (pseudogout) and supports the diagnosis given the synovial fluid crystal analysis.\n(Choice E)\nSubchondral sclerosis\nSubchondral sclerosis is a chronic degenerative change seen in osteoarthritis that develops over years. While this patient has a history of osteoarthritis, the acute inflammatory presentation with calcium pyrophosphate crystals indicates pseudogout as the cause of current symptoms.","likely":"D.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":7,"sceneSize":8,"globalIndex":15,"id":"1629","sceneScore":12,"question":"A 58-year-old African American male presents to the clinic with ongoing pain and stiffness in his knees and fingers that worsens with prolonged use and activity and improves with rest. He notes brief stiffness in his joints after periods of inactivity, typically lasting less than 30 minutes, before loosening up with movement. He has a history of type 2 diabetes and hypertension, both well-controlled. He is a non-smoker and does not consume alcohol. His family history reveals that his father experienced similar joint problems. His current medications include metformin and lisinopril. Blood pressure and heart rate are stable. An X-ray of the hands is presented below.\n\nWhat is the most likely diagnosis for his condition based on the radiographic findings?","answers":[{"label":"A","text":"Pseudogout\n(1.48%)"},{"label":"B","text":"Reactive arthritis\n(2.96%)"},{"label":"C","text":"Osteoarthritis\n(71.85%)"},{"label":"D","text":"Rheumatoid arthritis\n(22.22%)"},{"label":"E","text":"Gouty arthritis\n(1.48%)"}],"explanation":"Explanation\nThe radiographic findings in this patient are consistent with features of osteoarthritis, as evidenced by joint space narrowing and the presence of osteophytes at the distal interphalangeal joints. Such symptoms align with degenerative changes, which are typical in the aging population.\n(Choice A)\nPseudogout\nPseudogout (calcium pyrophosphate dihydrate crystal arthropathy) shows chondrocalcinosis on radiographs and typically affects fibrocartilaginous joints like knees, wrists, and symphysis pubis. The osteophyte formation at DIP joints shown here is not characteristic of pseudogout.\n(Choice B)\nReactive arthritis\nReactive arthritis typically presents as asymmetric oligoarthritis affecting large joints of the lower extremities following an infection. It does not characteristically show the degenerative changes with osteophyte formation seen in the DIP joints on this radiograph.\n(Choice C)\nOsteoarthritis\nThe radiograph shows typical signs of osteoarthritis, which include joint space narrowing and osteophyte formation, particularly affecting the DIP joints.\n(Choice D)\nRheumatoid arthritis\nRheumatoid arthritis typically shows symmetric erosions and joint space narrowing at the MCP and PIP joints with periarticular osteopenia. The radiograph shows osteophyte formation and joint space narrowing predominantly at DIP joints without erosions, which is inconsistent with RA.\n(Choice E)\nGouty arthritis\nGout typically presents with acute monoarticular arthritis, most commonly affecting the first MTP joint. Radiographically, chronic gout shows punched-out erosions with overhanging edges and preserved joint space, not the joint space narrowing and osteophyte formation seen here.","likely":"C.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Crystal under light","sceneHook":"Gout vs CPPD vs hydroxyapatite: birefringence and joint choice","indexInScene":8,"sceneSize":8,"globalIndex":16,"id":"5219","sceneScore":12,"question":"A 52-year-old male carpenter presents with a 3-month history of progressive right elbow pain. He reports that the pain is localized to the outer aspect of the elbow and worsens when he grips tools tightly or performs overhead hammering. He denies any trauma, neck pain, or numbness in the fingers. On physical examination, there is point tenderness just distal to the lateral epicondyle. Pain is elicited with resisted wrist extension while the elbow is extended, and also with passive wrist flexion. Grip strength is slightly reduced on the affected side. There is no swelling, erythema, or instability noted. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Pseudogout\n(0%)"},{"label":"B","text":"Olecranon bursitis\n(4.08%)"},{"label":"C","text":"Osteoarthritis of the elbow\n(0%)"},{"label":"D","text":"Stress fracture of the humerus\n(0%)"},{"label":"E","text":"Lateral epicondylitis\n(95.92%)"}],"explanation":"Explanation\nThe patient's history of repetitive wrist extension activities as a carpenter, combined with lateral elbow tenderness and pain on resisted wrist extension and passive flexion, is characteristic of lateral epicondylitis (tennis elbow). Other conditions like cervical radiculopathy, olecranon bursitis, osteoarthritis, pseudogout, radial tunnel syndrome, and stress fracture do not fit as well with the absence of neck symptoms, swelling, joint involvement, or specific trauma.\n(Choice A)\nPseudogout\nPseudogout involves acute inflammatory arthritis with joint swelling, warmth, and crystals in synovial fluid, typically affecting larger joints like the knee, not matching this tendinopathy presentation.\n(Choice B)\nOlecranon bursitis\nOlecranon bursitis presents with swelling and tenderness over the posterior elbow, often with warmth or fluctuance, not seen in this patient.\n(Choice C)\nOsteoarthritis of the elbow\nElbow osteoarthritis typically presents with pain during joint motion, morning stiffness, possible crepitus, and joint effusion. The focal tenderness at the lateral epicondyle and pain specifically triggered by wrist extension maneuvers indicate tendinopathy rather than arthritis.\n(Choice D)\nStress fracture of the humerus\nA humeral stress fracture would likely present with pain worsened by axial loading or direct trauma history, and imaging would be needed, but the specific exam findings point to tendinosis instead.\n(Choice E)\nLateral epicondylitis\nThis matches the clinical findings of tenderness at the lateral epicondyle and pain with resisted wrist extension and passive flexion, due to overuse of the extensor tendons.","likely":"E.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":1,"sceneSize":8,"globalIndex":17,"id":"1120","sceneScore":12,"question":"A 60-year-old woman visits her primary care doctor complaining of persistent, dull aching pain in both her hands over the past 6 months. The pain worsens with prolonged activity and is somewhat relieved by rest. She notes morning stiffness in her hands, lasting around 15 minutes each day. Her past medical history is unremarkable, and she maintains a balanced diet. Her vital signs are within normal limits, and her Body Mass Index (BMI) is 24 Kg/m². On examination, minimal swelling with palpable crepitus can be felt in several of her finger joints. Which of the following initial treatments is most appropriate for her symptoms?","answers":[{"label":"A","text":"Tramadol\n(2.48%)"},{"label":"B","text":"Glucosamine supplements\n(1.65%)"},{"label":"C","text":"Acetaminophen\n(57.85%)"},{"label":"D","text":"Diclofenac gel\n(32.23%)"},{"label":"E","text":"Hydroxychloroquine\n(5.79%)"}],"explanation":"Explanation\nThis patient presents with classic hand osteoarthritis: bilateral joint pain worsening with activity, brief morning stiffness under 30 minutes, and crepitus on examination. Per 2019 ACR/Arthritis Foundation guidelines, topical NSAIDs — particularly diclofenac gel — are strongly recommended as first-line pharmacological therapy for hand OA due to their efficacy against both the analgesic and inflammatory components of OA, combined with a favorable systemic safety profile. Acetaminophen, while historically first-line, received only a conditional recommendation in 2019 guidelines due to its lack of anti-inflammatory activity and modest effect size. The brief morning stiffness helps distinguish this from inflammatory arthritis such as rheumatoid arthritis, which typically causes prolonged morning stiffness exceeding one hour.\n(Choice A)\nTramadol\nTramadol is an opioid-like analgesic that should be reserved for patients with moderate to severe OA pain who have failed first-line treatments (acetaminophen, topical NSAIDs) and cannot tolerate oral NSAIDs. It carries risks of dependency, sedation, and serotonin syndrome.\n(Choice B)\nGlucosamine supplements\nGlucosamine supplements have not demonstrated consistent efficacy in clinical trials for osteoarthritis. The GAIT trial (Glucosamine/Chondroitin Arthritis Intervention Trial) found no significant benefit of glucosamine or chondroitin over placebo for most OA patients. Current ACR guidelines do not recommend glucosamine for OA management. While generally safe, it should not replace evidence-based pharmacological therapies.\n(Choice C)\nAcetaminophen\nAcetaminophen was historically considered the first-line oral analgesic for osteoarthritis, but its role has been significantly downgraded in the 2019 ACR/Arthritis Foundation OA guidelines, where it received only a conditional recommendation — below the strong recommendation given to topical NSAIDs for hand OA. Acetaminophen provides purely analgesic effects with no anti-inflammatory activity, which is a meaningful limitation given the synovitic and inflammatory component of OA pain. Multiple systematic reviews have also demonstrated that acetaminophen's effect size for OA pain is modest at best. While acetaminophen remains an option for patients who cannot tolerate any NSAID therapy, topical diclofenac is the more appropriate first-line choice for hand OA.\n(Choice D)\nDiclofenac gel\nTopical diclofenac gel is the recommended first-line pharmacological treatment","likely":"D.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":2,"sceneSize":8,"globalIndex":18,"id":"1672","sceneScore":12,"question":"A 44-year-old man presents with three days of joint discomfort primarily in the knees and elbows. He reports that the stiffness is most pronounced upon waking and tends to last about 10 to 20 minutes. He denies any history of trauma, fever, weight loss, or rashes. He works as a preschool teacher and does not smoke, drink, or use recreational drugs. Vital signs are stable. On examination, the joints are without redness, swelling, or signs of tender inflammation. Laboratory results show a C-reactive protein level of 5 mg/L. What is the most probable diagnosis?","answers":[{"label":"A","text":"Rheumatoid arthritis\n(10.45%)"},{"label":"B","text":"Osteoarthritis\n(38.06%)"},{"label":"C","text":"Viral arthritis\n(41.04%)"},{"label":"D","text":"Gouty arthritis\n(0.75%)"},{"label":"E","text":"Reactive arthritis\n(9.7%)"}],"explanation":"Explanation\nThe patient's acute onset symmetric polyarthritis with brief morning stiffness, absence of joint inflammation, and occupational exposure to children (preschool teacher) strongly suggests viral arthritis, most likely parvovirus B19. The self-limited nature, normal inflammatory markers (CRP 5 mg/L is minimally elevated), and lack of systemic symptoms support this diagnosis over chronic inflammatory conditions.\n(Choice A)\nRheumatoid arthritis\nRheumatoid arthritis presents with symmetric polyarthritis and prolonged morning stiffness (>1 hour), which could initially seem similar. However, RA typically involves joint swelling, tenderness, and systemic symptoms (fatigue, low-grade fever), with elevated inflammatory markers. The brief morning stiffness (10-20 minutes), absence of synovitis, and acute self-limited course favor viral arthritis over RA.\n(Choice B)\nOsteoarthritis\nOsteoarthritis is a degenerative joint disease that typically affects weight-bearing joints (knees, hips) and hands, with gradual onset over months to years. Morning stiffness in OA is brief (<30 minutes) but the chronic, progressive nature and lack of acute symmetric polyarticular presentation make this diagnosis unlikely in this acute setting.\n(Choice C)\nViral arthritis\nViral arthritis is the most likely diagnosis in this case considering the acute onset, symmetric involvement, short duration of morning stiffness, and occupational exposure to young children. Parvovirus B19 is a common cause, with symptoms aligning closely with the patient's presentation.\n(Choice D)\nGouty arthritis\nGout typically presents with acute onset of severe, excruciating pain in a single joint (monoarticular), most commonly the first metatarsophalangeal joint (podagra), associated with erythema, swelling, and warmth. The patient's symmetric polyarticular presentation without inflammatory signs makes gout unlikely.\n(Choice E)\nReactive arthritis\nReactive arthritis typically develops 1-4 weeks following a gastrointestinal (Salmonella, Shigella, Campylobacter) or genitourinary (Chlamydia) infection. It classically presents with the triad of arthritis, urethritis, and conjunctivitis, though incomplete forms are common. This patient lacks preceding infection history and associated extra-articular symptoms.","likely":"C.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":3,"sceneSize":8,"globalIndex":19,"id":"1551","sceneScore":12,"question":"A 70-year-old man visits the clinic, accompanied by his grandson, because of intense pain and swelling in his large toe. The grandson mentions, \"Grandpa has been complaining about this on and off for years, and he's never really sought medical help.\" The patient notes that this episode began a few days ago after a holiday meal, and he recalls having similar issues with his elbows last year. He was prescribed medication, but it brought little relief. His manual jobs keep him fit, and he is on medication to manage his blood pressure.","answers":[{"label":"A","text":"Gouty arthritis\n(97.74%)"},{"label":"B","text":"Psoriatic arthritis\n(0%)"},{"label":"C","text":"Chronic osteoarthritis\n(0%)"},{"label":"D","text":"Rheumatoid nodules\n(0%)"},{"label":"E","text":"Calcinosis cutis\n(2.26%)"}],"explanation":"Explanation\nThe patient's acute and recurring joint pain, particularly in the big toe (podagra), alongside dietary triggers and antihypertensive medication use, strongly suggests gouty arthritis. Diuretics commonly used for blood pressure management can exacerbate gout by reducing renal uric acid excretion, leading to hyperuricemia and urate crystal deposition in joints. Management includes acute anti-inflammatory therapy and lifestyle modifications.\n(Choice A)\nGouty arthritis\nThe patient shows classical symptoms of gouty arthritis, including sudden intense pain in the joints, particularly the big toe, known as podagra. Triggered by dietary indiscretion (rich holiday meal), it often occurs against a backdrop of hyperuricemia. His antihypertensive medication likely includes a diuretic, which can precipitate gout attacks by increasing uric acid retention and reducing renal excretion.\n(Choice B)\nPsoriatic arthritis\nPsoriatic arthritis typically presents with asymmetric joint involvement, dactylitis ('sausage digits'), and is associated with psoriatic skin plaques. While it can affect the toes, it more commonly involves the distal interphalangeal joints of fingers and does not typically present as isolated, recurrent acute attacks of podagra.\n(Choice C)\nChronic osteoarthritis\nChronic osteoarthritis is characterized by progressive, mechanical joint pain that worsens with activity and improves with rest. It develops gradual joint deformities like Heberden's and Bouchard's nodes on the fingers, rather than presenting as acute, sudden attacks of severe joint pain and swelling.\n(Choice D)\nRheumatoid nodules\nRheumatoid nodules are typically firm, rubbery, and nontender subcutaneous masses that form over joint extensor surfaces and pressure points. They occur in chronic rheumatoid arthritis patients, often with positive rheumatoid factor, and do not present as acute, episodic joint pain and swelling.\n(Choice E)\nCalcinosis cutis\nCalcinosis cutis refers to calcium phosphate deposits in the skin and subcutaneous tissue, often associated with connective tissue disorders like systemic sclerosis. These deposits feel hard and nodular but do not cause acute joint inflammation, pain, or swelling as described in this case.","likely":"A.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":4,"sceneSize":8,"globalIndex":20,"id":"2406","sceneScore":12,"question":"A 55-year-old woman presents with a 2-year history of progressive pain and stiffness in her shoulders and knees. She reports that her feet have increased in size, requiring larger shoes, and she has developed numbness in her hands consistent with carpal tunnel syndrome. Physical examination reveals coarsened facial features, a prominent brow, and enlarged hands. Laboratory values are shown below. X-ray of the knees demonstrates widened joint spaces without erosions or osteophytes. Which of the following is the most likely diagnosis?\n\n\n\nFasting Glucose\t150 mg/dL\nTSH\t0.4 mU/L\nWhite Blood Cell Count\t6.500 /mm³\nHemoglobin\t14 g/dL\nHematocrit\t42%\nPlatelet Count\t250.000 /mm³\nAST\t22 U/L\nALT\t25 U/L\nAlkaline Phosphatase\t80 U/L\nTotal Bilirubin\t0.8 mg/dL","answers":[{"label":"A","text":"Hypothyroidism\n(0%)"},{"label":"B","text":"Acromegaly\n(92.71%)"},{"label":"C","text":"Paget disease of bone\n(7.29%)"},{"label":"D","text":"Rheumatoid arthritis\n(0%)"},{"label":"E","text":"Osteoarthritis\n(0%)"}],"explanation":"Explanation\nThis patient has features suggestive of acromegaly, including acral enlargement (feet and hands), coarsened facial features, carpal tunnel syndrome, and hyperglycemia. The joint pain and x-ray finding of widened joint spaces are due to growth hormone-induced hyperplasia of articular chondrocytes and synovial hypertrophy. Acromegaly is typically caused by a pituitary adenoma secreting excess growth hormone, which can also affect other pituitary functions and lead to metabolic changes.\n(Choice A)\nHypothyroidism\nHypothyroidism can cause myalgias, joint stiffness, and carpal tunnel syndrome due to myxedematous infiltration. However, the TSH is normal (0.4 mU/L), ruling out hypothyroidism. Additionally, hypothyroidism does not cause acral enlargement, coarsened facial features, or joint space widening on x-ray.\n(Choice B)\nAcromegaly\nAcromegaly involves excess growth hormone leading to tissue overgrowth, including articular cartilage hyperplasia causing joint space widening on x-ray, along with acral enlargement and metabolic disturbances.\n(Choice C)\nPaget disease of bone\nPaget disease causes abnormal bone remodeling leading to enlarged, deformed bones with a 'cotton wool' appearance on x-ray. While it can cause bone pain and secondary osteoarthritis, it does not cause primary joint space widening or the soft tissue overgrowth (acral enlargement, coarsened facial features) characteristic of growth hormone excess.\n(Choice D)\nRheumatoid arthritis\nRheumatoid arthritis typically causes joint space narrowing and erosions on x-ray, not joint space widening. While RA can cause carpal tunnel syndrome, it characteristically involves symmetric small joints (hands, feet) with morning stiffness and positive rheumatoid factor or anti-CCP antibodies. The acral enlargement and coarsened facial features are not seen in RA.\n(Choice E)\nOsteoarthritis\nOsteoarthritis typically presents with joint space narrowing, osteophytes, and subchondral sclerosis on x-ray. The widened joint spaces seen here are characteristic of acromegaly, not osteoarthritis. Additionally, osteoarthritis lacks the systemic features present in this case such as acral enlargement, coarsened facial features, and hyperglycemia.","likely":"B.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":5,"sceneSize":8,"globalIndex":21,"id":"5294","sceneScore":12,"question":"A 62-year-old retired carpenter presents with a 2-year history of progressive pain and stiffness in both hands, particularly affecting his ability to grip tools. The pain worsens with repetitive use and improves with rest. He denies morning stiffness lasting more than 30 minutes, rash, fever, or weight loss. Physical examination reveals bony enlargements at the distal interphalangeal joints of the index and middle fingers bilaterally, as well as at the proximal interphalangeal joints of the thumbs. There is mild tenderness on palpation but no erythema or warmth. Grip strength is slightly reduced. What is the most appropriate next step in management?","answers":[{"label":"A","text":"Hand x-ray\n(50.94%)"},{"label":"B","text":"Rheumatoid factor testing\n(9.43%)"},{"label":"C","text":"Antinuclear antibody testing\n(0%)"},{"label":"D","text":"No additional testing\n(39.62%)"},{"label":"E","text":"Magnetic resonance imaging of the hands\n(0%)"}],"explanation":"Explanation\nThis patient has osteoarthritis of the hands, characterized by activity-related pain, Heberden nodes at the distal interphalangeal joints, and Bouchard nodes at the proximal interphalangeal joints. These findings are pathognomonic for osteoarthritis, which is a clinical diagnosis. Additional imaging or laboratory testing is unnecessary for diagnosis or initial management.\n(Choice A)\nHand x-ray\nWhile x-rays can show joint space narrowing and osteophytes in osteoarthritis, imaging is not necessary when clinical findings are diagnostic. The presence of Heberden and Bouchard nodes is pathognomonic for hand osteoarthritis, making additional imaging unnecessary for diagnosis or initial management.\n(Choice B)\nRheumatoid factor testing\nRheumatoid factor testing is used to evaluate for rheumatoid arthritis, which typically presents with prolonged morning stiffness (>1 hour), symmetric joint swelling, and systemic symptoms. This patient's brief morning stiffness (<30 minutes), mechanical pain pattern, and characteristic bony enlargements are classic for osteoarthritis, not inflammatory arthritis.\n(Choice C)\nAntinuclear antibody testing\nANA testing is used to screen for systemic autoimmune conditions like systemic lupus erythematosus or systemic sclerosis. This patient's isolated hand joint involvement without systemic symptoms (fever, rash, weight loss) and the presence of pathognomonic bony enlargements make osteoarthritis the clear diagnosis, not requiring autoimmune workup.\n(Choice D)\nNo additional testing\nOsteoarthritis of the hands is diagnosed clinically based on history and pathognomonic findings like Heberden and Bouchard nodes. No further testing is required for diagnosis or initial management.\n(Choice E)\nMagnetic resonance imaging of the hands\nMRI provides detailed soft tissue imaging and can detect early cartilage changes, but it is expensive and unnecessary when clinical findings are diagnostic. The presence of Heberden and Bouchard nodes is pathognomonic for hand osteoarthritis, and MRI would not change management at this stage.","likely":"D.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":6,"sceneSize":8,"globalIndex":22,"id":"5334","sceneScore":12,"question":"A 52-year-old man with a 20-year history of plaque psoriasis presents with a 6-month history of progressive pain and swelling in his hands and feet. He describes morning stiffness lasting approximately 90 minutes that improves with physical activity throughout the day. On physical examination, there is asymmetric tenderness and swelling involving the distal interphalangeal (DIP) joints of the second and third fingers on the right hand, the proximal interphalangeal (PIP) joints of the left hand, and the DIP joints of the first and second toes bilaterally. His fingernails exhibit extensive pitting and onycholysis. Laboratory evaluation reveals an elevated erythrocyte sedimentation rate, but rheumatoid factor and anti-cyclic citrullinated peptide antibodies are negative. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Reactive arthritis\n(4.23%)"},{"label":"B","text":"Osteoarthritis\n(4.23%)"},{"label":"C","text":"Gout\n(1.41%)"},{"label":"D","text":"Rheumatoid arthritis\n(1.41%)"},{"label":"E","text":"Psoriatic arthritis\n(88.73%)"}],"explanation":"Explanation\nThis patient has asymmetric inflammatory arthritis involving the DIP joints, morning stiffness improving with activity, nail pitting, and a long-standing history of psoriasis, which are highly characteristic of psoriatic arthritis. Psoriatic arthritis affects 15%-30% of patients with psoriasis and often presents with asymmetric oligoarthritis or symmetric polyarthritis, frequently involving DIP joints and associated with nail changes like pitting. The negative rheumatoid factor and anti-CCP antibodies help distinguish it from rheumatoid arthritis. Other options are less consistent with the combination of findings.\n(Choice A)\nReactive arthritis\nReactive arthritis follows genitourinary or gastrointestinal infection, often involves lower extremities with enthesitis, and may have skin lesions like keratoderma blennorrhagicum, but not typically nail pitting or long-standing plaque psoriasis.\n(Choice B)\nOsteoarthritis\nOsteoarthritis typically involves DIP joints but is degenerative, not inflammatory, and does not cause prolonged morning stiffness, asymmetric distribution with inflammation, or nail changes like pitting.\n(Choice C)\nGout\nGout typically presents as acute monoarticular attacks, most commonly affecting the first metatarsophalangeal joint initially. It is associated with hyperuricemia and tophi in chronic cases, but does not cause nail pitting or the described pattern of chronic symmetric/asymmetric inflammatory polyarthritis.\n(Choice D)\nRheumatoid arthritis\nRheumatoid arthritis typically presents with symmetric polyarthritis primarily involving PIP and metacarpophalangeal joints while sparing DIP joints. Most patients (70-80%) have positive rheumatoid factor or anti-CCP antibodies, and nail pitting is not a feature of RA.\n(Choice E)\nPsoriatic arthritis\nPsoriatic arthritis fits with the long-standing psoriasis, asymmetric involvement including DIP joints, nail pitting, inflammatory morning stiffness improving with activity, and negative serologies.","likely":"E.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":7,"sceneSize":8,"globalIndex":23,"id":"1133","sceneScore":12,"question":"A 54-year-old woman presents to the clinic with increasingly impaired gait and persistent pain in her left ankle, which has been a concern over the past two months. Her medical history includes type 2 diabetes mellitus, longstanding hypertension, and dyslipidemia. On examination, there is significant deformity observed in both her ankles, but more pronounced in the left. An X-ray of her left foot reveals joint effusion and large osteophytes with displaced bone fragments around the tibiotalar joint. What is the most likely underlying cause of this woman's symptoms?","answers":[{"label":"A","text":"Vascular insufficiency\n(2.22%)"},{"label":"B","text":"Primary osteoarthritis\n(51.11%)"},{"label":"C","text":"Bone mineral density loss\n(2.22%)"},{"label":"D","text":"Rheumatoid arthritis\n(4.44%)"},{"label":"E","text":"Peripheral neuropathy\n(40%)"}],"explanation":"Explanation\nThe patient's symptoms and X-ray findings are indicative of Charcot's joint. Diabetes-induced peripheral neuropathy results in loss of sensation, preventing pain detection, and results in repetitive joint injury and subsequent deformation. Radiographic findings typically include joint effusions, osteophytes, and joint fragmentation. Management involves offloading the affected limb and optimizing glucose control.\n(Choice A)\nVascular insufficiency\nVascular insufficiency from peripheral artery disease can cause tissue ischemia and ulcerations in diabetic patients, but it does not directly cause the joint destruction, osteophyte formation, and bone fragmentation seen on this patient's X-ray.\n(Choice B)\nPrimary osteoarthritis\nPrimary osteoarthritis typically affects weight-bearing joints with gradual joint space narrowing and osteophyte formation, but the acute presentation with extensive joint destruction and bone fragmentation in a diabetic patient is more consistent with neuropathic arthropathy than degenerative joint disease.\n(Choice C)\nBone mineral density loss\nOsteoporosis causes decreased bone mineral density and predisposes to fractures, but it does not cause the active joint destruction, osteophyte formation, and bone fragmentation seen in this case without associated trauma or underlying joint disease.\n(Choice D)\nRheumatoid arthritis\nRheumatoid arthritis and other inflammatory arthritides typically cause symmetric polyarticular involvement with joint space narrowing, erosions, and soft tissue swelling. The unilateral presentation with extensive osteophyte formation and bone fragmentation is not characteristic of inflammatory joint disease.\n(Choice E)\nPeripheral neuropathy\nIn individuals with long-standing diabetes, peripheral neuropathy causes damage to sensory nerves, leading to Charcot's joint or neurogenic arthropathy. Without sensation, continuous trauma to weight-bearing joints goes unnoticed, resulting in deformity and joint destruction.","likely":"E.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Many joints, morning gel","sceneHook":"RA vs OA vs SLE arthritis: symmetric small joints vs wear-and-tear","indexInScene":8,"sceneSize":8,"globalIndex":24,"id":"1051","sceneScore":12,"question":"A 69-year-old female presents to the clinic with complaints of increasing discomfort in her left knee for the past several months. She reports the pain intensifies with movement and subsides with rest. She also notes stiffness lasting less than 30 minutes after waking up or staying in one position for a prolonged period. She denies any recent trauma, fevers, or unexpected weight loss. Her medical history is significant for hypertension, but she denies any current back pain or new medical issues. Her vital signs are stable, and she weighs 85 kg (187 lb) and is 165 cm (65 in) tall. On examination, there is limited range of motion with passive internal rotation of the left knee and mild crepitus. There is no tenderness upon palpation, and no observable swelling. Her reflexes are normal, and there are no sensory deficits. Which of the following is the most likely cause of her knee pain?","answers":[{"label":"A","text":"Meniscal tear\n(2.27%)"},{"label":"B","text":"Rheumatoid arthritis\n(3.79%)"},{"label":"C","text":"Baker's cyst\n(0%)"},{"label":"D","text":"Patellar tendinopathy\n(1.52%)"},{"label":"E","text":"Degenerative joint disease\n(92.42%)"}],"explanation":"Explanation\nThe clinical presentation of progressive left knee pain, exacerbation with activity, and short-duration stiffness are hallmark symptoms of osteoarthritis. Abnormal cartilage wear from mechanical stress leads to joint degeneration. The examination reveals classic signs, such as limited range of motion and crepitus, without swelling or tenderness, typical of non-inflammatory arthritis. The patient's age and clinical findings support this diagnosis.\n(Choice A)\nMeniscal tear\nMeniscal tears typically present with acute onset following a twisting injury, along with joint line tenderness, possible effusion, and mechanical symptoms like locking or catching. The gradual onset and absence of mechanical symptoms make this diagnosis less likely.\n(Choice B)\nRheumatoid arthritis\nRheumatoid arthr
