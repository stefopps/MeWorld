itis typically presents with prolonged morning stiffness (>1 hour), symmetric polyarticular involvement, and systemic symptoms. The brief morning stiffness (<30 minutes) and unilateral presentation make this diagnosis unlikely.\n(Choice C)\nBaker's cyst\nBaker's cyst presents as a palpable mass in the popliteal fossa (back of knee) and may cause posterior knee discomfort or tightness. The anterior and activity-related pain pattern described here is inconsistent with a Baker's cyst.\n(Choice D)\nPatellar tendinopathy\nPatellar tendinopathy typically presents with anterior knee pain localized just below the patella, especially with activities involving jumping or knee extension against resistance. There would be focal tenderness at the patellar tendon insertion, which is absent in this case.\n(Choice E)\nDegenerative joint disease\nDegenerative joint disease (osteoarthritis) is the most likely diagnosis. It commonly affects people over 50 and is marked by progressive, activity-related pain and morning stiffness less than 30 minutes. Joint examination may reveal crepitus.","likely":"E.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":1,"sceneSize":8,"globalIndex":25,"id":"5226","sceneScore":13,"question":"A 32-year-old man who works as a park ranger in Pennsylvania presents with a 2-week history of swelling and pain in his left knee. He reports no fever, chills, or recent trauma. Six months ago, he noticed a expanding red rash on his thigh after a hiking trip, which resolved without treatment. On examination, the knee is warm and swollen with limited range of motion, but he is afebrile. Synovial fluid analysis reveals a white blood cell count of 25,000/mm³ with 80% neutrophils, but Gram stain and bacterial cultures are negative. Which of the following is the most likely cause of this patient's arthritis?","answers":[{"label":"A","text":"Rheumatoid arthritis\n(0%)"},{"label":"B","text":"Reactive arthritis\n(3.39%)"},{"label":"C","text":"Borrelia burgdorferi infection\n(83.05%)"},{"label":"D","text":"Neisseria gonorrhoeae infection\n(8.47%)"},{"label":"E","text":"Staphylococcus aureus infection\n(5.08%)"}],"explanation":"Explanation\nLyme arthritis is the hallmark of late Lyme disease caused by Borrelia burgdorferi, characterized by monoarticular arthritis of a large joint (commonly the knee), with inflammation and negative Gram stain and culture. The patient’s history of tick exposure in an endemic area and prior rash aligns with late Lyme arthritis. Image shows the classic bull’s-eye rash.\n(Choice A)\nRheumatoid arthritis\nThis is incorrect. Rheumatoid arthritis typically presents with symmetric polyarticular involvement of small joints (hands, wrists, feet), morning stiffness lasting >1 hour, and systemic symptoms. It rarely presents as acute monoarticular large joint arthritis, and the history of tick exposure with prior rash strongly points to an infectious etiology.\n(Choice B)\nReactive arthritis\nThis is incorrect. Reactive arthritis (formerly Reiter's syndrome) typically follows gastrointestinal or genitourinary infections and presents with asymmetric oligoarthritis, often accompanied by conjunctivitis, urethritis, and enthesitis. While it can cause monoarticular knee arthritis, the specific history of tick exposure in an endemic area with a prior expanding rash is pathognomonic for Lyme disease.\n(Choice C)\nBorrelia burgdorferi infection\nThis is correct. The patient's history of a rash consistent with erythema migrans, exposure in a Lyme-endemic area, and presentation with monoarticular knee arthritis with inflammatory synovial fluid but negative cultures are classic for late-stage Lyme arthritis.\n(Choice D)\nNeisseria gonorrhoeae infection\nThis is incorrect. Gonococcal arthritis typically presents with fever, polyarticular involvement (often asymmetric oligoarthritis), and may show positive Gram stain or cultures. It's frequently associated with tenosynovitis, skin lesions (petechial or pustular), and genitourinary symptoms, none of which are present in this case.\n(Choice E)\nStaphylococcus aureus infection\nThis is incorrect. Septic arthritis from S. aureus typically presents with fever, severe pain, rapid onset, and positive bacterial cultures from synovial fluid. The combination of negative Gram stain, negative cultures, and absence of systemic signs of infection makes bacterial septic arthritis unlikely.","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":2,"sceneSize":8,"globalIndex":26,"id":"5270","sceneScore":13,"question":"A 24-year-old woman presents to the emergency department with a 3-day history of fever, chills, migratory joint pains affecting her wrists and ankles, pain along the tendons of her fingers, and several small, painful pustular lesions on the palms of her hands and soles of her feet. She denies any vaginal discharge or dysuria but reports being sexually active with a new partner she met at a music festival 2 weeks ago without consistent condom use. Physical examination reveals tenderness and mild swelling in the affected joints, flexor tenosynovitis in the fingers, and scattered vesiculopustular lesions on erythematous bases on her distal extremities. Blood cultures are pending, and synovial fluid analysis from an aspirated joint shows gram-negative diplococci. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Septic arthritis due to Staphylococcus aureus\n(0%)"},{"label":"B","text":"Rheumatoid arthritis\n(0%)"},{"label":"C","text":"Lyme disease\n(0%)"},{"label":"D","text":"Reactive arthritis\n(1.72%)"},{"label":"E","text":"Gonococcemia\n(98.28%)"}],"explanation":"Explanation\nThis patient developed manifestations of disseminated gonococcal infection (DGI) after unprotected sexual activity with a new partner at a music festival, presenting with the classic triad of polyarthralgia, tenosynovitis, and vesiculopustular skin lesions, along with fever and chills. Diagnosis is supported by gram-negative diplococci in synovial fluid, and treatment typically involves intravenous ceftriaxone with testing of mucosal sites for gonorrhea.\n(Choice A)\nSeptic arthritis due to Staphylococcus aureus\nStaphylococcal septic arthritis usually presents as monoarticular purulent arthritis without the triad of tenosynovitis and skin lesions, and gram stain would show gram-positive cocci, not gram-negative diplococci.\n(Choice B)\nRheumatoid arthritis\nRheumatoid arthritis is a chronic autoimmune condition with symmetric polyarthritis, morning stiffness, and no acute fever, skin pustules, or positive bacterial cultures in synovial fluid.\n(Choice C)\nLyme disease\nLyme disease can cause migratory arthralgias and fever, but skin manifestations are typically erythema migrans (not vesiculopustular lesions), it follows tick exposure rather than sexual contact, and synovial fluid would not contain gram-negative diplococci.\n(Choice D)\nReactive arthritis\nReactive arthritis typically follows genitourinary or gastrointestinal infection and presents with asymmetric oligoarthritis, often with conjunctivitis and urethritis, but not usually with pustular skin lesions or positive synovial fluid cultures for gonorrhea.\n(Choice E)\nGonococcemia\nThis is the correct diagnosis. The patient's presentation with fever, polyarthralgia, tenosynovitis, and vesiculopustular lesions, along with gram-negative diplococci in synovial fluid, is classic for disseminated gonococcal infection (gonococcemia).","likely":"E.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":3,"sceneSize":8,"globalIndex":27,"id":"1702","sceneScore":12,"question":"A 27-year-old male presents with persistent low back pain and limited spinal mobility. He notes that the pain is more profound in the mornings and decreases with movement. He also reports recurring bouts of bloody diarrhea and feels generally fatigued. On physical examination, there are numerous red, painful bumps on his shins. Laboratory analysis shows anemia and elevated platelets. His P-ANCA test is notably positive, while stool cultures return negative results. Pelvic X-rays reveal sacroiliitis. What is the most likely underlying condition causing these symptoms?","answers":[{"label":"A","text":"Inflammatory bowel disease\n(68.26%)"},{"label":"B","text":"Reactive arthritis\n(17.96%)"},{"label":"C","text":"Whipple disease\n(8.38%)"},{"label":"D","text":"Giardiasis\n(1.2%)"},{"label":"E","text":"Celiac disease\n(4.19%)"}],"explanation":"Explanation\nThis case aligns with ulcerative colitis, marked by chronic bloody diarrhea, systemic inflammation signs, and sacroiliac joint involvement suggesting axial arthritis. Both sacroiliitis and erythema nodosum frequently accompany inflammatory bowel disease. P-ANCA positivity and negative stool cultures further support this diagnosis.\n(Choice A)\nInflammatory bowel disease\nThe patient’s symptoms suggest ulcerative colitis, a type of inflammatory bowel disease (IBD). This condition commonly presents with persistent bloody diarrhea, anemia, and extra-intestinal symptoms like erythema nodosum and arthritis. p-ANCA positivity is consistent with ulcerative colitis.\n(Choice B)\nReactive arthritis\nReactive arthritis typically follows genitourinary or gastrointestinal infections and presents with the classic triad of arthritis, urethritis, and conjunctivitis. While it can cause sacroiliitis, it does not typically present with bloody diarrhea or p-ANCA positivity, and the skin lesions would more likely be keratoderma blennorrhagicum rather than erythema nodosum.\n(Choice C)\nWhipple disease\nWhipple disease presents with weight loss, malabsorptive diarrhea, and migratory arthritis, typically in middle-aged white men. The diarrhea is usually non-bloody and watery. p-ANCA positivity is not associated with Whipple disease, and erythema nodosum is not a typical manifestation.\n(Choice D)\nGiardiasis\nGiardiasis is a parasitic infection causing malabsorptive diarrhea with greasy, foul-smelling stools, bloating, and weight loss. The diarrhea is characteristically non-bloody. It does not cause systemic inflammatory manifestations like erythema nodosum, sacroiliitis, or p-ANCA positivity.\n(Choice E)\nCeliac disease\nCeliac disease causes malabsorptive diarrhea with steatorrhea, weight loss, and nutritional deficiencies. The diarrhea is typically non-bloody. Laboratory findings include positive anti-tissue transglutaminase or anti-endomysial antibodies, not p-ANCA. Extraintestinal manifestations like erythema nodosum and sacroiliitis are rare.","likely":"A.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":4,"sceneSize":8,"globalIndex":28,"id":"5225","sceneScore":12,"question":"A 32-year-old woman of Iranian descent presents with a 2-year history of recurrent painful oral ulcers and genital sores that heal with scarring. She recently developed blurred vision in her right eye and was diagnosed with anterior uveitis by an ophthalmologist. Additionally, she reports a recent episode of deep vein thrombosis in her left leg, confirmed by ultrasound, and notes that minor skin pricks often lead to exaggerated pustular reactions. She denies gastrointestinal symptoms or joint pains. Physical examination reveals erythema nodosum-like lesions on her shins. What is the most likely diagnosis?","answers":[{"label":"A","text":"Systemic lupus erythematosus\n(14.29%)"},{"label":"B","text":"Reactive arthritis\n(1.59%)"},{"label":"C","text":"Herpes simplex virus infection\n(1.59%)"},{"label":"D","text":"Inflammatory bowel disease\n(4.76%)"},{"label":"E","text":"Behçet syndrome\n(77.78%)"}],"explanation":"Explanation\nThis patient has characteristic features of Behçet syndrome, including recurrent oral and genital aphthous ulcers, uveitis, erythema nodosum, venous thrombosis, and pathergy. Behçet syndrome is most common in patients of Turkish, Middle Eastern, and Asian descent. Diagnosis is clinical, and other conditions like SLE or IBD are less likely given the absence of typical features such as photosensitivity, renal involvement, or chronic diarrhea.\n(Choice A)\nSystemic lupus erythematosus\nSLE can cause oral ulcers and uveitis, but typically presents with joint pain, photosensitive rash, and renal involvement. Thrombosis in SLE occurs with antiphospholipid antibodies, not pathergy reactions. The absence of arthritis and typical SLE features makes this diagnosis unlikely.\n(Choice B)\nReactive arthritis\nReactive arthritis (formerly Reiter's syndrome) presents with the classic triad of arthritis, urethritis, and conjunctivitis following infection. While it can cause oral ulcers, it does not typically cause genital ulcers, thrombosis, or pathergy reactions. The absence of joint symptoms makes this diagnosis unlikely.\n(Choice C)\nHerpes simplex virus infection\nHSV causes recurrent vesicular ulcerations that typically heal without scarring, unlike the scarring ulcers described here. HSV does not cause systemic manifestations like uveitis, thrombosis, pathergy reactions, or erythema nodosum-like lesions.\n(Choice D)\nInflammatory bowel disease\nCrohn disease may present with oral aphthae and genital ulcers mimicking Behçet, but it usually involves chronic diarrhea, abdominal pain, and bowel inflammation, which are absent here. Ocular involvement and thrombosis are less common.\n(Choice E)\nBehçet syndrome\nThis is the correct diagnosis, as the patient's recurrent oral and genital ulcers, uveitis, thrombosis, pathergy, and erythema nodosum are hallmark features of Behçet syndrome, a vasculitis common in Middle Eastern populations.","likely":"E.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":5,"sceneSize":8,"globalIndex":29,"id":"5259","sceneScore":9,"question":"A 22-year-old man presents to the clinic with a 2-week history of pain and swelling in his left knee and right ankle following an episode of bloody diarrhea. He also reports red, painful eyes and significant pain at the back of both heels, especially when walking or standing. He denies fever, rash, or urinary symptoms at present, but recalls mild dysuria during the diarrheal episode. Physical examination reveals conjunctival injection, asymmetric joint swelling, and marked tenderness at the insertion of the Achilles tendons bilaterally. Laboratory tests show elevated erythrocyte sedimentation rate. The heel pain in this patient is most likely due to which of the following?","answers":[{"label":"A","text":"Synovitis\n(3.28%)"},{"label":"B","text":"Bursitis\n(0%)"},{"label":"C","text":"Osteomyelitis\n(0%)"},{"label":"D","text":"Tendinitis\n(26.23%)"},{"label":"E","text":"Enthesitis\n(70.49%)"}],"explanation":"Explanation\nThis patient presents with features suggestive of reactive arthritis, a spondyloarthropathy, including post-infectious asymmetric oligoarthritis, conjunctivitis, and enthesitis causing heel pain at the Achilles tendon insertion. Enthesitis is inflammation at sites of tendon and ligament attachment to bone, distinguishing it from other causes like bursitis or synovitis. Features of rheumatoid arthritis or systemic lupus erythematosus, such as positive autoantibodies or renal involvement, are not present.\n(Choice A)\nSynovitis\nSynovitis is inflammation of the synovial membrane that lines joint capsules. While synovitis explains this patient's knee and ankle joint swelling, it does not account for the specific heel pain at the Achilles tendon insertion site. The heel pain location is extra-articular and specifically involves the enthesis (tendon-bone junction).\n(Choice B)\nBursitis\nBursitis involves inflammation of the bursa sacs that cushion joints and reduce friction between bones and soft tissues. While bursitis can cause heel pain (such as retrocalcaneal bursitis), it would not specifically cause the marked tenderness at the Achilles tendon insertion site described in this patient with reactive arthritis.\n(Choice C)\nOsteomyelitis\nOsteomyelitis is a bacterial infection of the bone that typically presents with fever, severe localized bone pain, and systemic signs of infection. This patient's presentation is consistent with post-infectious inflammatory arthritis (reactive arthritis) rather than an active bone infection, and the specific location of pain at tendon insertion sites is characteristic of enthesitis, not osteomyelitis.\n(Choice D)\nTendinitis\nTendinitis involves inflammation of the tendon itself, typically from overuse or mechanical stress. However, this patient's heel pain is specifically located at the Achilles tendon insertion site (the enthesis), which is characteristic of enthesitis in spondyloarthropathies like reactive arthritis, rather than mid-substance tendon inflammation seen in typical tendinitis.\n(Choice E)\nEnthesitis\nEnthesitis is the inflammation at the sites where tendons or ligaments attach to bone, a hallmark feature in spondyloarthropathies like reactive arthritis, matching this patient's presentation of heel pain at the Achilles insertion.","likely":"E.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":6,"sceneSize":8,"globalIndex":30,"id":"1409","sceneScore":9,"question":"A 32-year-old Hispanic male comes to the clinic with a two-week history of fatigue, fever, and aching in his knees and elbows. He reports joint stiffness in the mornings that improves throughout the day. His laboratory results show negative rheumatoid factor and a weakly positive ANA. After being prescribed non-steroidal anti-inflammatory drugs (NSAIDs), he notes substantial improvement in symptoms after three weeks without medication. What is the most likely diagnosis?","answers":[{"label":"A","text":"Gout\n(0.65%)"},{"label":"B","text":"Reactive arthritis\n(33.33%)"},{"label":"C","text":"Viral arthritis\n(51.63%)"},{"label":"D","text":"Rheumatic fever\n(2.61%)"},{"label":"E","text":"Systemic lupus erythematosus\n(11.76%)"}],"explanation":"Explanation\nIn this clinical scenario, the patient presents with acute-onset polyarticular symmetric arthritis with constitutional symptoms that resolves spontaneously within weeks. This pattern is classic for viral arthritis, which commonly presents with symmetric joint involvement, systemic symptoms like fever, and self-limited course. Common viral causes include parvovirus B19, hepatitis B, rubella, and EBV. The negative rheumatoid factor, weakly positive ANA, and spontaneous resolution distinguish viral arthritis from chronic inflammatory arthritides like rheumatoid arthritis or SLE, which require ongoing treatment and have persistent symptoms.\n(Choice A)\nGout\nGout typically presents with sudden, severe monoarticular attacks, most commonly affecting the first metatarsophalangeal joint. This patient's polyarticular, symmetric presentation with morning stiffness lasting weeks is inconsistent with gout's typical acute, asymmetric pattern.\n(Choice B)\nReactive arthritis\nReactive arthritis typically develops 1-4 weeks after a genitourinary or gastrointestinal infection and presents with asymmetric oligoarthritis, often involving large joints and enthesitis. This patient's symmetric polyarticular presentation without preceding infection history makes reactive arthritis unlikely.\n(Choice C)\nViral arthritis\nThe patient presents with polyarticular, symmetric arthritis of acute onset, and a short duration. The spontaneous resolution of symptoms and systemic features such as fever suggest a viral etiology.\n(Choice D)\nRheumatic fever\nRheumatic fever follows group A streptococcal pharyngitis and presents with migratory polyarthritis, but requires evidence of preceding streptococcal infection and typically needs antibiotic treatment. The spontaneous resolution without treatment and lack of streptococcal history make this diagnosis unlikely.\n(Choice E)\nSystemic lupus erythematosus\nWhile SLE can present with polyarticular arthritis and positive ANA, it is a chronic autoimmune condition that persists for months to years and typically requires ongoing immunosuppressive therapy. This patient's spontaneous resolution within weeks argues against SLE.","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":7,"sceneSize":8,"globalIndex":31,"id":"213","sceneScore":9,"question":"A five-year-old girl is taken to the emergency room with complaints of limping and mild discomfort in her right hip and thigh for the past three weeks. She has no recent history of injury or fever. On examination, normal joint movement is noted at the knee, but there is significant restriction in the internal rotation and abduction of the right hip. Her vital signs are stable with a temperature of 36.8°C (98.2°F), blood pressure of 95/55 mm Hg, pulse of 82/min, and respiratory rate of 18/min. Blood tests return within normal limits including a complete blood count and metabolic profile. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Juvenile idiopathic arthritis\n(7.52%)"},{"label":"B","text":"Legg-Calve-Perthes disease\n(49.62%)"},{"label":"C","text":"Reactive arthritis following a viral infection\n(5.26%)"},{"label":"D","text":"Early-onset scoliosis-related hip pain\n(0%)"},{"label":"E","text":"Transient synovitis of the hip\n(37.59%)"}],"explanation":"Explanation\nLegg-Calvé-Perthes disease manifests as avascular necrosis of the femoral head in children aged 4-10 years, presenting with gradual onset limp and hip discomfort over weeks to months. Physical findings characteristically include limited internal rotation and abduction of the affected hip. Plain radiographs may initially appear normal in early disease, making MRI the preferred imaging modality for early detection. Early diagnosis and appropriate treatment (activity modification, bracing, or surgery depending on severity) are crucial to preserve hip joint function and prevent long-term complications.\n(Choice A)\nJuvenile idiopathic arthritis\nJuvenile idiopathic arthritis presents with chronic joint inflammation, morning stiffness lasting >1 hour, and joint swelling. This case lacks the inflammatory signs, systemic symptoms, and the chronic progressive nature typical of JIA.\n(Choice B)\nLegg-Calve-Perthes disease\nLegg-Calvé-Perthes disease is avascular necrosis of the femoral head, seen in children around four to ten years old, presenting with gradual hip pain and restricted movement specially in internal rotation and abduction.\n(Choice C)\nReactive arthritis following a viral infection\nReactive arthritis follows infections (typically enteric or genitourinary) and presents as part of a triad including arthritis, conjunctivitis, and urethritis. This case lacks the preceding infection history and associated extra-articular manifestations.\n(Choice D)\nEarly-onset scoliosis-related hip pain\nEarly-onset scoliosis can cause compensatory hip discomfort due to pelvic obliquity, but would not produce the specific pattern of restricted internal rotation and abduction seen in hip pathology. Physical examination would reveal spinal curvature.\n(Choice E)\nTransient synovitis of the hip\nTransient synovitis typically presents with acute hip pain and limping in children, often following a recent upper respiratory infection. Unlike this case, symptoms usually have a more acute onset and improve rapidly with NSAIDs and rest within days to weeks.","likely":"B.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"After the bug","sceneHook":"Reactive arthritis vs gonococcal vs IBD arthritis: can't see, can't climb, can't pee","indexInScene":8,"sceneSize":8,"globalIndex":32,"id":"690","sceneScore":9,"question":"A father brings his 9-year-old son to the pediatrician after noticing that the child has had persistent joint pain and a spreading rash over the past week. The child has a history of a sore throat approximately three weeks ago, which resolved without medication. The pain initially affected the child's knees but later moved to the elbows and shoulders. Current vitals include a temperature of 37.8°C (100°F), heart rate of 90/min, and respiratory rate of 18/min. On physical evaluation, mild swelling and tenderness are noted in the shoulders and elbows, and a pink, serpiginous rash is visible on the child's abdomen. Blood work reveals the following:\n\nComplete blood count\n- Hemoglobin 13 g/dL \n- MCHC 31%\n- MCV 84 fL \n- Reticulocyte count 0.2%\n- Platelet count 220,000/mm³\n- Leukocyte count 7,200/mm³\n- Neutrophils 60%\n- Eosinophils 2%\n- Lymphocytes 30%\n- Monocytes 8%\n- C-reactive protein 3 mg/dL\n- Erythrocyte sedimentation rate 40 mm/hr\n\nWhich of the following is the most probable diagnosis?","answers":[{"label":"A","text":"Acute leukemia\n(0%)"},{"label":"B","text":"Juvenile idiopathic arthritis\n(19.05%)"},{"label":"C","text":"Rheumatic fever\n(57.67%)"},{"label":"D","text":"Reactive arthritis\n(5.82%)"},{"label":"E","text":"Parvovirus arthritis\n(17.46%)"}],"explanation":"Explanation\nThis case demonstrates the classic presentation of rheumatic fever with migratory polyarthritis following untreated streptococcal pharyngitis. The patient meets multiple Jones criteria including fever, migratory arthritis, and erythema marginatum (the characteristic serpiginous rash). Elevated acute phase reactants (ESR and CRP) support the diagnosis. Confirmatory testing with ASO or anti-DNase B titers would strengthen the diagnosis, and echocardiography should be performed to assess for carditis.\n(Choice A)\nAcute leukemia\nAcute leukemia may present with bone pain, thrombocytopenia, and anemia, and the peripheral blood smear often shows presence of blasts.\n(Choice B)\nJuvenile idiopathic arthritis\nJuvenile idiopathic arthritis requires persistent joint inflammation for at least 6 weeks and typically does not follow an infectious prodrome. The arthritis is usually symmetric and non-migratory, unlike the pattern described in this case. Additionally, JIA would not explain the characteristic erythema marginatum rash.\n(Choice C)\nRheumatic fever\nRheumatic fever follows untreated group A streptococcal infection and is characterized by migratory polyarthritis and erythema marginatum, making it the most likely diagnosis given the clinical presentation and laboratory findings.\n(Choice D)\nReactive arthritis\nReactive arthritis (formerly Reiter's syndrome) is a seronegative spondyloarthropathy that follows genitourinary or gastrointestinal infections, not pharyngitis. The classic triad includes conjunctivitis, urethritis, and asymmetric arthritis affecting lower extremities. This patient lacks these features and has the wrong preceding infection.\n(Choice E)\nParvovirus arthritis\nParvovirus B19 can cause transient arthralgia and the classic 'slapped cheek' rash in children. However, parvovirus arthritis typically affects small joints symmetrically, is self-limiting, and does not present with the migratory large joint pattern or erythema marginatum seen in this case.","likely":"C.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":1,"sceneSize":8,"globalIndex":33,"id":"5245","sceneScore":12,"question":"A 58-year-old postmenopausal woman with a history of long-term corticosteroid use for systemic lupus erythematosus presents to the clinic with sudden onset of severe mid-back pain that began while she was twisting to reach for an item on a high shelf. She denies any falls or trauma. The pain worsens with movement, coughing, and deep breathing, and is somewhat relieved by lying down. Physical examination reveals point tenderness over the T10 vertebra, but no neurologic deficits, erythema, or fever. Laboratory studies show normal complete blood count and inflammatory markers. What is the most likely underlying pathophysiology of this patient's condition?","answers":[{"label":"A","text":"Loss of bone mineral density\n(82.61%)"},{"label":"B","text":"Acute paraspinal muscle strain\n(13.04%)"},{"label":"C","text":"Spinal metastasis\n(0%)"},{"label":"D","text":"Acute flare of ankylosing spondylitis\n(2.17%)"},{"label":"E","text":"Intervertebral disc herniation with nerve root compression\n(2.17%)"}],"explanation":"Explanation\nThis postmenopausal woman on long-term corticosteroids developed acute back pain with vertebral point tenderness after a twisting motion, consistent with an acute vertebral compression fracture due to decreased bone mineral density from osteoporosis secondary to corticosteroid use and menopause. The pain is localized, exacerbated by movement and straining, with no signs of infection or neurologic involvement.\n(Choice A)\nLoss of bone mineral density\nLong-term corticosteroid use and postmenopausal status predispose to osteoporosis, leading to decreased bone mineral density and increased risk of vertebral compression fractures from minor stressors like twisting.\n(Choice B)\nAcute paraspinal muscle strain\nMuscle strain causes diffuse pain without specific vertebral tenderness and usually resolves quickly; it does not explain the acute onset after twisting in a patient with risk factors for bone fragility.\n(Choice C)\nSpinal metastasis\nSpinal metastasis typically presents with progressive pain that worsens at night, constitutional symptoms like weight loss or fever, and often has an associated history of malignancy. The acute onset after a specific precipitating event and normal inflammatory markers make metastatic disease less likely.\n(Choice D)\nAcute flare of ankylosing spondylitis\nAnkylosing spondylitis involves chronic inflammatory back pain, morning stiffness, and sacroiliitis, not acute point tenderness from a single motion in a patient without prior diagnosis.\n(Choice E)\nIntervertebral disc herniation with nerve root compression\nDisc herniation typically presents with radicular pain radiating down the leg, neurologic deficits such as weakness or numbness, or positive straight-leg raise test, none of which are present here. The acute point tenderness over T10 vertebra after a twisting motion is more consistent with vertebral pathology.","likely":"A.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":2,"sceneSize":8,"globalIndex":34,"id":"5178","sceneScore":11,"question":"A 28-year-old female graphic designer presents to her primary care physician with a 9-month history of insidious onset lower back pain and stiffness. She reports that the pain is most severe upon waking, lasting over an hour, and improves with light exercise and hot showers but worsens with prolonged sitting at her desk. On examination, she has tenderness over the lumbosacral region, reduced lumbar flexion to 40 degrees (normal >60 degrees), and no neurologic deficits. She denies any history of trauma, fever, weight loss, or gastrointestinal symptoms. Family history is notable for a brother with chronic back issues. Which of the following is the most appropriate next step in diagnosis?","answers":[{"label":"A","text":"HLA-B27 genotyping\n(12.9%)"},{"label":"B","text":"Bone scintigraphy\n(0%)"},{"label":"C","text":"MRI of the lumbar spine\n(0%)"},{"label":"D","text":"CT scan of the pelvis\n(0%)"},{"label":"E","text":"X-ray of the sacroiliac joints\n(87.1%)"}],"explanation":"Explanation\nThis patient presents with clinical features highly suggestive of ankylosing spondylitis (AS): chronic inflammatory back pain with morning stiffness lasting over an hour that improves with exercise, reduced spinal mobility (lumbar flexion <60°), and onset in a young adult. The most appropriate next diagnostic step is plain radiographs of the sacroiliac joints to evaluate for sacroiliitis, which is the hallmark radiographic finding in AS. The image demonstrates advanced AS changes including bilateral sacroiliitis, syndesmophytes forming vertical bony bridges between vertebrae, squaring of vertebral bodies, and fusion of spinous processes creating the characteristic \"bamboo spine\" appearance. While HLA-B27 is strongly associated with AS, it is not diagnostic and plain radiographs remain the first-line imaging modality per current classification criteria.\n(Choice A)\nHLA-B27 genotyping\nHLA-B27 is associated with ankylosing spondylitis but is not diagnostic. Approximately 90-95% of AS patients are HLA-B27 positive, but 8-10% of healthy individuals are also positive. HLA-B27 testing may be useful for prognosis or in cases where imaging is equivocal, but plain radiographs are the first-line diagnostic test.\n(Choice B)\nBone scintigraphy\nBone scintigraphy can show increased uptake in the sacroiliac joints in inflammatory arthritis but lacks specificity for ankylosing spondylitis. It may show abnormalities in other conditions such as infection, malignancy, or degenerative joint disease. Plain radiographs are preferred as the initial imaging study.\n(Choice C)\nMRI of the lumbar spine\nMRI is more sensitive than plain radiographs for detecting early inflammatory changes (bone marrow edema) in the sacroiliac joints and spine. However, plain radiographs remain the first-line imaging modality per classification criteria. MRI is typically reserved for cases where plain films are normal but clinical suspicion remains high.\n(Choice D)\nCT scan of the pelvis\nCT scan can provide excellent detail of bony erosions and sclerosis in the sacroiliac joints and may be more sensitive than plain radiographs for detecting structural changes. However, due to higher radiation exposure and cost, plain radiographs remain the recommended first-line imaging for suspected sacroiliitis.\n(Choice E)\nX-ray of the sacroiliac joints\nPlain x-rays of the sacroiliac joints are the most appropriate next step to confirm sacroiliitis, a hallmark of ankylosing spondylitis in patients with charact","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":3,"sceneSize":8,"globalIndex":35,"id":"5261","sceneScore":10,"question":"A 62-year-old woman with a 25-year history of ankylosing spondylitis presents to the emergency department with sudden, severe lower back pain that started after she bent down to pick up a light grocery bag. She has a history of HLA-B27 positivity, recurrent anterior uveitis, and progressive spinal stiffness over the years. Her medications include nonsteroidal anti-inflammatory drugs and a tumor necrosis factor inhibitor. On examination, she exhibits limited lumbar flexion, tenderness over the L3 vertebra, and no focal neurological deficits. Straight-leg raise test is negative bilaterally. Laboratory results show elevated C-reactive protein but normal complete blood count and renal function. What is the most likely diagnosis?","answers":[{"label":"A","text":"Metastatic spinal fracture\n(0%)"},{"label":"B","text":"Acute exacerbation of ankylosing spondylitis\n(20%)"},{"label":"C","text":"Acute lumbar disc herniation\n(4%)"},{"label":"D","text":"Aortic dissection\n(0%)"},{"label":"E","text":"Vertebral fracture\n(76%)"}],"explanation":"Explanation\nThe patient has long-standing ankylosing spondylitis (AS) with spinal rigidity and a history of uveitis. Acute severe back pain following minimal trauma (bending to lift a light object) in the setting of AS increases the risk for vertebral fracture due to underlying osteoporosis from chronic inflammation and increased osteoclast activity. Other differentials like disc herniation, muscle strain, AS flare, metastatic fracture, or aortic pathology are less likely given the absence of neurological signs, lack of systemic symptoms, and the mechanism of minimal trauma.\n(Choice A)\nMetastatic spinal fracture\nMetastatic spinal fracture is unlikely given the absence of constitutional symptoms (fever, weight loss, night sweats), normal complete blood count, and lack of known primary malignancy; the clinical picture is more consistent with osteoporotic fracture secondary to AS.\n(Choice B)\nAcute exacerbation of ankylosing spondylitis\nAS flares typically involve gradual worsening of chronic pain and stiffness rather than sudden severe pain from minimal trauma; elevated CRP could fit, but the presentation suggests fracture.\n(Choice C)\nAcute lumbar disc herniation\nLumbar disc herniation is less likely because the patient lacks neurological deficits (normal motor/sensory exam) and has a negative straight-leg raise test bilaterally, which are hallmarks of nerve root compression from disc herniation.\n(Choice D)\nAortic dissection\nAS can be associated with aortic involvement, but the pain is localized to the lower back with vertebral tenderness and no chest pain, hypotension, or pulse deficits, making this less likely.\n(Choice E)\nVertebral fracture\nThis is the most likely diagnosis, as long-standing AS leads to osteoporosis from chronic inflammation and increased osteoclast activity, combined with spinal rigidity, predisposing to fractures from minimal trauma like bending.","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":4,"sceneSize":8,"globalIndex":36,"id":"4192","sceneScore":9,"question":"A 28-year-old male construction worker presents to the ophthalmology clinic with a 3-day history of severe pain, redness, and light sensitivity in his left eye. On examination, he has decreased visual acuity, circumcorneal injection, and cells in the anterior chamber, consistent with anterior uveitis. He reports a 2-year history of intermittent lower back stiffness that improves with exercise and a recent episode of painful swelling at the Achilles tendon insertion. He denies fever, rash, or gastrointestinal symptoms. What is the most appropriate next step in evaluating for an associated systemic condition?","answers":[{"label":"A","text":"MRI of the brain\n(0%)"},{"label":"B","text":"Anti-Ro/SSA antibody assay\n(10.71%)"},{"label":"C","text":"X-ray of the sacroiliac joints\n(85.71%)"},{"label":"D","text":"Lyme serology\n(1.19%)"},{"label":"E","text":"Rheumatoid factor\n(2.38%)"}],"explanation":"Explanation\nThis patient presents with anterior uveitis in the setting of inflammatory back pain (improves with exercise, typical of inflammatory conditions) and enthesitis (Achilles tendon insertion pain), which strongly suggests seronegative spondyloarthropathy, particularly ankylosing spondylitis. X-ray of the sacroiliac joints is the most appropriate initial imaging study to evaluate for sacroiliitis, which is a hallmark early finding in ankylosing spondylitis. The other diagnostic tests are not indicated for this clinical presentation pattern.\n(Choice A)\nMRI of the brain\nThis is incorrect. Brain MRI would be appropriate for evaluating optic neuritis associated with multiple sclerosis or other demyelinating diseases, but this patient has anterior uveitis, not optic neuritis. His musculoskeletal symptoms (inflammatory back pain and enthesitis) point toward spondyloarthropathy rather than neurologic disease.\n(Choice B)\nAnti-Ro/SSA antibody assay\nThis is incorrect. Anti-Ro/SSA antibodies are associated with Sjögren syndrome and systemic lupus erythematosus, which can cause keratoconjunctivitis sicca (dry eyes) but do not typically cause anterior uveitis. The patient's presentation of anterior uveitis with inflammatory back pain and enthesitis is not consistent with these conditions.\n(Choice C)\nX-ray of the sacroiliac joints\nThis is the correct choice. The patient's symptoms suggest ankylosing spondylitis, a seronegative spondyloarthropathy associated with anterior uveitis, inflammatory back pain, and enthesitis. Sacroiliac joint x-rays can reveal sacroiliitis, a hallmark finding.\n(Choice D)\nLyme serology\nThis is incorrect. Lyme disease can rarely cause uveitis, but the patient lacks key features suggestive of Lyme disease such as history of tick exposure in an endemic area, erythema migrans rash, or migratory arthritis. His presentation of inflammatory back pain and enthesitis is more consistent with seronegative spondyloarthropathy.\n(Choice E)\nRheumatoid factor\nThis is incorrect. Rheumatoid factor is elevated in rheumatoid arthritis, which typically causes symmetric peripheral joint arthritis and can be associated with scleritis or episcleritis. However, anterior uveitis is uncommon in RA, and the patient's pattern of axial spine involvement with enthesitis is characteristic of seronegative spondyloarthropathy, not rheumatoid arthritis.","likely":"C.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":5,"sceneSize":8,"globalIndex":37,"id":"59","sceneScore":9,"question":"A 32-year-old pregnant woman, in her second trimester, visits the clinic with concerns about persistent low back pain. The discomfort tends to escalate towards the evening, albeit she feels relief in the mornings. She has observed slight swelling in her feet, particularly at night. Her previous medical records reveal no notable concerns. Present vitals show a temperature of 37°C (98.6°F), heart rate of 88 bpm, blood pressure of 118/77 mmHg, and respiratory rate of 17/min. A urine analysis returns normal results. What is the most probable cause of her symptoms?","answers":[{"label":"A","text":"Acute lumbar disc herniation\n(0%)"},{"label":"B","text":"Ankylosing spondylitis\n(0.87%)"},{"label":"C","text":"Multiple myeloma\n(0%)"},{"label":"D","text":"Vertebral compression fracture\n(0%)"},{"label":"E","text":"Increased lumbar lordosis due to pregnancy-related joint relaxation\n(99.13%)"}],"explanation":"Explanation\nPregnancy-related back pain is primarily mechanical, caused by increased lumbar lordosis from the growing uterus and hormonal relaxation of pelvic ligaments (relaxin and progesterone effects). This combination leads to spinal instability and altered biomechanics, resulting in pain that typically worsens with prolonged standing or activity and improves with rest. The evening pattern of symptoms described is characteristic of mechanical rather than inflammatory causes.\n(Choice A)\nAcute lumbar disc herniation\nAcute lumbar disc herniation typically presents with sudden onset of severe, continuous pain that may radiate down the leg, often accompanied by neurological symptoms such as numbness, tingling, or weakness. The gradual onset and evening pattern described here are inconsistent with acute disc pathology.\n(Choice B)\nAnkylosing spondylitis\nAnkylosing spondylitis typically causes inflammatory back pain that is worse in the morning with prolonged stiffness, improving with activity throughout the day. This patient's pattern of evening worsening and morning relief is opposite to what would be expected with inflammatory spondyloarthropathy.\n(Choice C)\nMultiple myeloma\nMultiple myeloma would present with bone pain, often accompanied by systemic symptoms such as fatigue, weight loss, and laboratory abnormalities including proteinuria, hypercalcemia, or anemia. The normal urinalysis and absence of systemic symptoms make this diagnosis unlikely in this young pregnant patient.\n(Choice D)\nVertebral compression fracture\nVertebral compression fractures typically result from significant trauma or underlying bone pathology such as osteoporosis. They present with acute, severe pain at the fracture site. This young pregnant woman has no history of trauma, and her gradual onset of mechanical-type pain makes compression fracture very unlikely.\n(Choice E)\nIncreased lumbar lordosis due to pregnancy-related joint relaxation\nHormonal changes during pregnancy can increase lumbar curvature due to ligament relaxation, which is most consistent with this presentation.","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":6,"sceneSize":8,"globalIndex":38,"id":"5176","sceneScore":9,"question":"A 62-year-old retired construction worker presents with a 6-month history of low back pain radiating to both legs, described as aching and heaviness. The pain intensifies when he stands for prolonged periods while fishing at the lake or walks downhill to his boat, but it significantly improves when he sits on a stool or leans forward over his tackle box. He denies pain at rest or during sleep. Physical examination reveals normal peripheral pulses, no muscle atrophy, and intact sensation. Ankle-brachial index is 1.1 bilaterally. Straight-leg raise test is negative. What is the most likely underlying cause of his symptoms?","answers":[{"label":"A","text":"Peripheral artery disease\n(0%)"},{"label":"B","text":"Ankylosing spondylitis\n(6.67%)"},{"label":"C","text":"Metastatic prostate cancer\n(0%)"},{"label":"D","text":"Thoracic myelopathy from spinal cord compression\n(28.89%)"},{"label":"E","text":"Osteoarthritis of the spine\n(64.44%)"}],"explanation":"Explanation\nThis patient's symptoms are consistent with lumbar spinal stenosis due to degenerative osteoarthritis, leading to neurogenic claudication. The pain is position-dependent, worsening with lumbar extension (standing, walking downhill) and improving with flexion (sitting, leaning forward), distinguishing it from vascular claudication, which resolves with standing still and is exertion-dependent. Normal vascular studies and absence of neuropathic features rule out other differentials.\n(Choice A)\nPeripheral artery disease\nPeripheral artery disease causes vascular claudication with leg pain during exertion that resolves promptly with rest (standing still). This patient's pain persists while standing and improves specifically with spinal flexion, indicating neurogenic rather than vascular claudication. The normal ankle-brachial index of 1.1 further excludes significant peripheral arterial disease.\n(Choice B)\nAnkylosing spondylitis\nAnkylosing spondylitis is an inflammatory spondyloarthropathy that typically affects younger patients and presents with inflammatory back pain (morning stiffness, improvement with activity), sacroiliitis, and systemic features. It does not commonly cause neurogenic claudication or the characteristic position-dependent leg symptoms seen in spinal stenosis.\n(Choice C)\nMetastatic prostate cancer\nThis could cause back pain from vertebral involvement, but typically with constitutional symptoms, and leg pain would not be position-dependent or relieved by flexion without cord compression signs.\n(Choice D)\nThoracic myelopathy from spinal cord compression\nThis would likely cause upper motor neuron signs, myelopathy, and possibly bowel/bladder dysfunction, not fitting the lower extremity positional pain without those features.\n(Choice E)\nOsteoarthritis of the spine\nDegenerative osteoarthritis leads to facet joint hypertrophy, ligamentum flavum thickening, and disc degeneration, causing lumbar spinal stenosis and neurogenic claudication with position-dependent symptoms as described.","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":7,"sceneSize":8,"globalIndex":39,"id":"5105","sceneScore":7,"question":"A 55-year-old man with a 25-year history of poorly controlled ankylosing spondylitis presents to the clinic with progressive fatigue, bilateral lower extremity edema, and orthostatic hypotension. He reports chronic back pain and stiffness but denies recent infections or changes in medication. Physical examination reveals 2+ pitting edema in the legs and mild hepatomegaly. Laboratory studies shown below. A renal biopsy is performed to evaluate the cause of his nephrotic syndrome. Which of the following is the most likely histologic finding?\n\n\n\nTest\tResult\tUnits\nSerum Albumin\t2.8\tg/dL\nSerum Creatinine\t1.8\tmg/dL\nBlood Urea Nitrogen (BUN)\t32\tmg/dL\nSodium\t138\tmmol/L\nPotassium\t4.5\tmmol/L\nChloride\t103\tmmol/L\nBicarbonate\t23\tmmol/L\nGlucose\t102\tmg/dL\nTotal Cholesterol\t280\tmg/dL\nTriglycerides\t210\tmg/dL\n\nUrinalysis - Protein\t3+ (large)\t-\nUrinalysis - Appearance\tClear to foamy\t-\nUrinalysis - Color\tYellow\t-\nUrinalysis - pH\t6.0\t-\nUrinalysis - Specific Gravity\t1.022\t-\nUrinalysis - Glucose\tNegative\t-\nUrinalysis - Ketones\tNegative\t-\nUrinalysis - Blood\tNegative\t-\nUrinalysis - Leukocyte Esterase\tNegative\t-\nUrinalysis - Nitrite\tNegative\t-\nUrinalysis - RBC (microscopic)\t0-2\t/hpf\nUrinalysis - WBC (microscopic)\t0-2\t/hpf\nUrinalysis - Casts\tOccasional hyaline\t-","answers":[{"label":"A","text":"Effacement of podocyte foot processes without deposits\n(19.74%)"},{"label":"B","text":"Mesangial IgA deposits with mesangial proliferation\n(2.63%)"},{"label":"C","text":"Subendothelial electron-dense deposits\n(11.84%)"},{"label":"D","text":"Linear IgG deposits along the glomerular basement membrane\n(9.21%)"},{"label":"E","text":"Congo red–positive amorphous deposits in the glomeruli\n(56.58%)"}],"explanation":"Explanation\nThis patient has nephrotic syndrome (proteinuria, hypoalbuminemia, edema) in the setting of long-standing ankylosing spondylitis, a chronic inflammatory condition that can lead to AA amyloidosis. The diagnosis is confirmed by renal biopsy showing amyloid deposits that stain positive with Congo red.\n(Choice A)\nEffacement of podocyte foot processes without deposits\nPodocyte foot process effacement without immune deposits is the hallmark of minimal change disease, which is the most common cause of nephrotic syndrome in children. In adults, it can be associated with NSAIDs, malignancy, or infections, but it would not be expected in a patient with long-standing inflammatory arthritis leading to secondary amyloidosis.\n(Choice B)\nMesangial IgA deposits with mesangial proliferation\nThis describes IgA nephropathy, which typically presents with episodic gross hematuria following upper respiratory infections. While it can cause proteinuria, it is not associated with chronic inflammatory conditions like ankylosing spondylitis and would not cause the constellation of findings seen in this patient with secondary amyloidosis.\n(Choice C)\nSubendothelial electron-dense deposits\nSubendothelial deposits are characteristic of membranoproliferative glomerulonephritis (MPGN), which can be associated with chronic infections, autoimmune diseases, or complement disorders. However, this patient's chronic inflammatory condition (ankylosing spondylitis) predisposes to amyloid deposition rather than immune complex-mediated glomerulonephritis.\n(Choice D)\nLinear IgG deposits along the glomerular basement membrane\nLinear IgG deposition along the glomerular basement membrane is pathognomonic for anti-GBM disease (Goodpasture syndrome). This condition typically presents as rapidly progressive glomerulonephritis with crescents, often accompanied by pulmonary hemorrhage. The acute presentation and pulmonary involvement distinguish it from the chronic, slowly progressive nephrotic syndrome seen with AA amyloidosis.\n(Choice E)\nCongo red–positive amorphous deposits in the glomeruli\nThis finding is characteristic of AA amyloidosis, which develops secondary to chronic inflammation from conditions like ankylosing spondylitis, leading to renal involvement with nephrotic syndrome.","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Back and sacroiliac","sceneHook":"Ankylosing vs mechanical back vs discitis: morning stiffness and bamboo spine","indexInScene":8,"sceneSize":8,"globalIndex":40,"id":"5189","sceneScore":7,"question":"A 58-year-old man with a history of prostate cancer diagnosed 3 years ago, currently in remission after radical prostatectomy and radiation therapy, presents to the clinic with a 6-week history of progressively worsening low back pain. The pain is constant, exacerbated by lying down, and partially relieved by sitting up or walking. He reports no recent falls or injuries, but mentions unintentional weight loss of 10 pounds over the past 2 months. Physical examination reveals point tenderness over the lower thoracic vertebrae, with no neurological deficits in the lower extremities. Laboratory studies shown below. What is the most likely cause of his low back pain?\n\n\n\nTest\tValue\tUnits\nSodium\t140\tmEq/L\nPotassium\t4.2\tmEq/L\nChloride\t102\tmEq/L\nBicarbonate (CO2)\t26\tmEq/L\nBUN (Blood Urea Nitrogen)\t14\tmg/dL\nCreatinine\t0.9\tmg/dL\nGlucose\t88\tmg/dL\nCalcium\t9.4\tmg/dL\nUrinalysis - Color\tnormal (yellow to amber)\t-\nUrinalysis - Clarity\tclear\t-\nUrinalysis - Specific Gravity\t1.015\t-\nUrinalysis - pH\t6.0\t-\nUrinalysis - Protein\tnegative\t-\nUrinalysis - Glucose\tnegative\t-\nUrinalysis - Ketones\tnegative\t-\nUrinalysis - Bilirubin\tnegative\t-\nUrinalysis - Urobilinogen\tnormal\t-\nUrinalysis - Blood/Hematuria\tnegative\t-\nUrinalysis - Leukocyte Esterase\tnegative\t-\nUrinalysis - Nitrite\tnegative\t-\nUrinalysis - White Blood Cells (WBC)\tnone seen or <5/hpf\t-\nUrinalysis - Red Blood Cells (RBC)\tnone seen or <3/hpf\t-\nUrinalysis - Epithelial Cells\tnone or few\t-\nUrinalysis - Casts\tnone\t-\nUrinalysis - Crystals\tnone or few (physiologic)\t-\nUrinalysis - Bacteria\tnone\t-\nUrinalysis - Overall Interpretation\tbland (normal)\t-\nPSA (Prostate-Specific Antigen)\t4.8\tng/mL (drawn 1 year ago)\nPSA (Prostate-Specific Antigen)\t8.5\tng/mL (current)","answers":[{"label":"A","text":"Metastatic cancer\n(96.88%)"},{"label":"B","text":"Mechanical low back pain\n(0%)"},{"label":"C","text":"Lumbar disc herniation\n(0%)"},{"label":"D","text":"Spinal epidural abscess\n(0%)"},{"label":"E","text":"Osteoporotic vertebral compression fracture\n(3.12%)"}],"explanation":"Explanation\nThis patient's history of prostate cancer, pain worse when lying down, unintentional weight loss, focal vertebral tenderness, and rising PSA suggest metastatic bone disease as the most likely cause of his worsening low back pain.\n(Choice A)\nMetastatic cancer\nThe patient's history of prostate cancer, rising PSA, nocturnal pain exacerbation, weight loss, and focal vertebral tenderness are classic indicators of bone metastasis, particularly to the spine, which is common in advanced prostate cancer.\n(Choice B)\nMechanical low back pain\nMuscle strain usually follows injury or overuse, improves with rest, and lacks systemic features like weight loss or laboratory abnormalities; the chronic progression and vertebral tenderness point away from this diagnosis.\n(Choice C)\nLumbar disc herniation\nLumbar disc herniation typically presents with radicular pain following a dermatomal distribution, often with neurological deficits such as weakness or sensory changes. The pain pattern is usually mechanical (worse with flexion/movement, better with rest). This patient's constant pain that worsens with recumbency, absence of neurological deficits, and systemic features like weight loss and rising PSA point away from disc pathology.\n(Choice D)\nSpinal epidural abscess\nSpinal epidural abscess typically presents with the classic triad of fever, back pain, and neurological deficits, along with elevated inflammatory markers (ESR, CRP) and leukocytosis. This patient lacks fever, infectious symptoms, and neurological signs. The rising PSA and cancer history make metastatic disease far more likely than an infectious etiology.\n(Choice E)\nOsteoporotic vertebral compression fracture\nWhile osteoporotic compression fractures can cause back pain in older men and radiation therapy can contribute to bone loss, the key distinguishing features here are the nocturnal pain pattern (worse when lying down), unintentional weight loss, and most importantly the rising PSA from 4.8 to 8.5 ng/mL, which strongly suggests disease recurrence rather than a benign osteoporotic process.","likely":"A.","hasReveal":true}];

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function cardHTML(q) {
  const ans = (q.answers || []).map(a =>

}

    </div>
    <span class="placeholder-tag">Placeholder avatar &amp; prose, v2 Harmon Circle — not locked content</span>
    <div class="story">${storyHTML || '<p>(story not yet written for this scene)</p>'}</div>
    <div id="qzone"></div>`;

  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      openIdx = (openIdx === idx) ? null : idx;
      paintChips();
      paintQZone();
    };
  });
  paintChips();
  paintQZone();

  document.getElementById('progress').textContent = 'Scene ' + (si + 1) + ' / ' + SCENES.length;
  document.getElementById('prev').disabled = si === 0;
  document.getElementById('next').disabled = si >= SCENES.length - 1;
  document.getElementById('next').textContent = si >= SCENES.length - 1 ? 'Done' : 'Next scene →';
}

function paintChips() {
  document.querySelectorAll('.chip').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.idx, 10) === openIdx);
  });
}

function paintQZone() {
  const zone = document.getElementById('qzone');
  if (!zone) return;
  if (openIdx == null) { zone.innerHTML = ''; return; }
  const q = SCENES[si].find(q => q.indexInScene === openIdx);
  zone.innerHTML = q ? cardHTML(q) : '';
}

document.getElementById('prev').onclick = () => {
  if (si > 0) { si--; openIdx = null; render(); window.scrollTo(0,0); }
};
document.getElementById('next').onclick = () => {
  if (si < SCENES.length - 1) { si++; openIdx = null; render(); window.scrollTo(0,0); }
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'n') document.getElementById('next').click();
  if (e.key === 'ArrowLeft' || e.key === 'p') document.getElementById('prev').click();
});
render();
</script>
</body>
</html>
