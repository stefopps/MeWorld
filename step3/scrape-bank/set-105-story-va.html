g sugar-sweetened beverages that drive hepatic lipogenesis, and (3) increasing dietary fiber to 25-30 g/day. These changes improve insulin sensitivity through multiple mechanisms: fiber slows glucose absorption and promotes beneficial gut microbiota changes, while modest weight loss reduces visceral adiposity and improves both hepatic and skeletal muscle insulin signaling. This evidence-based approach directly addresses the patient's modifiable risk factors. (Choice C) Metformin should be initiated immediately as first-line therapy because lifestyle modifications are consistently ineffective in preventing diabetes progression The DPP demonstrated that lifestyle intervention was more effective than metformin alone in preventing diabetes progression (58% vs. 31% risk reduction). Guidelines recommend lifestyle modification, including dietary changes targeting 5–7% weight loss and 150 minutes of weekly physical activity, as first-line therapy for prediabetes. Metformin may be added for high-risk patients, such as those with BMI ≥35 or age <60, but this patient has expressed a preference for lifestyle therapy and has no contraindications to pursuing it first. (Choice D) Replacing white rice with whole grains provides no metabolic benefit because all carbohydrates produce identical glycemic responses regardless of processing or fiber content This statement is incorrect. The glycemic index reflects the rate of glucose absorption from specific carbohydrate foods; white rice and other refined grains have a high glycemic index that produces rapid postprandial glucose spikes and exaggerated insulin responses, worsening beta-cell stress and insulin resistance over time. Whole grains have a lower glycemic index due to their fiber content and food matrix structure, producing slower glucose absorption and lower postprandial glucose and insulin excursions. Substituting low-GI whole grains for refined grains is a core recommendation in evidence-based dietary interventions for predia
