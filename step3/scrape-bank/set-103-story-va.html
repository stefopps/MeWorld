ection to the humeral metaphysis This is the classic mechanism for pediatric acute osteomyelitis, where bacteria from a distant site seed the metaphysis due to its rich vascular supply and sluggish blood flow, leading to localized infection.",

ggests infection with gram-negative pathogens or antibiotic-resistant organisms that vancomycin cannot adequately treat. (Choice E) Add a third-generation cephalosporin such as ceftriaxone Persistent symptoms after vancomycin suggest infection with gram-negative organisms, requiring broadened coverage with a third-generation cephalosporin like ceftriaxone.",

ry failure. However, fat embolism syndrome is a sterile inflammatory process caused by fat globules and does not require antibiotic therapy.",

ors regardless of individual performance. (Choice E) E. Instituting mandatory double-checks by two healthcare providers for all opioid infusions Double-checks create an illusion of safety but can fail when both providers make the same error, experience confirmation bias, or feel time pressure. Research shows that redundant human verification is less effective than automated systems that prevent the error from occurring in the first place.",

 500 mL or if there is high aspiration risk, though this patient's aspiration pneumonia resulted from Parkinson's-related dysphagia rather than a contraindication to gastric feeding. Hyperglycemia from EN should be managed with insulin infusion targeting glucose 140–180 mg/dL in the ICU. (Choice E) Initiate trophic enteral nutrition at 10–20 mL/hour for the duration of the ICU stay to maintain gut mucosal integrity without providing meaningful calories While trophic enteral nutrition at low rates may be appropriate in the early resuscitation phase of hemodynamic instability (first 24–48 hours), maintaining trophic feeds indefinitely in a hemodynamically stable patient fails to meet caloric and protein targets. Current guidelines recommend advancing to target enteral nutrition rates (25–30 kcal/kg/day and 1.2–2.0 g protein/kg/day) over 48–72 hours once hemodynamic stability is confirmed. Prolonged trophic feeding in a stable ICU patient constitutes underfeeding and is associated with increased muscle catabolism and worse outcomes.",

ions with reliable access to clean water and commercial formulas While inadequate access to clean water and formula preparation resources amplifies the mortality benefits of breastfeeding in low-income settings, the immunological and developmental benefits of breastfeeding are clinically significant and well-documented in high-income countries including the United States. Reduced otitis media, respiratory infections, gastroenteritis, and SIDS risk, along with neurodevelopmental advantages, are demonstrated in studies conducted in high-income countries with high formula safety standards. The benefits of breastfeeding are not limited to resource-limited settings.",

nosed — occurring during fetal development and early infancy — and CFTR modulator therapy cannot regenerate destroyed acinar cells. This patient's fecal elastase of 68 mcg/g on Trikafta confirms that she remains severely pancreatic-insufficient despite modulator therapy. PERT and fat-soluble vitamin supplementation remain essential regardless of CFTR modulator use. (Choice C) Cystic fibrosis causes fat malabsorption through pancreatic exocrine insufficiency impairing micellar solubilization of fat-soluble vitamins; vitamin A deficiency is the most immediately threatening finding given her corneal changes, requiring immediate high-dose water-miscible vitamin A supplementation to prevent irreversible corneal ulceration and blindness Cystic fibrosis (CF) produces fat-soluble vitamin deficiency through a well-characterized mechanism rooted in pancreatic exocrine insufficiency. The CFTR protein dysfunction causes thick, inspissated secretions that obstruct pancreatic ducts, destroying acinar cells and reducing secretion of lipase, colipase, and phospholipase A2. Without adequate pancreatic lipase, dietary triglycerides cannot be hydrolyzed to fatty acids and monoglycerides — the amphipathic molecules required for bile salt micelle formation. Fat-soluble vitamins (A, D, E, and K) require micellar solubilization for incorporation into mixed micelles that can be absorbed by intestinal enterocytes via passive diffusion. Without functional micelles, fat-soluble vitamins pass through the intestinal lumen unabsorbed, causing progressive depletion despite apparently adequate dietary intake. This patient's fecal elastase of 68 mcg/g confirms severe pancreatic exocrine insufficiency. Despite PERT use, her persistent steatorrhea (greasy stools) indicates incomplete fat digestion, maintaining ongoing fat-soluble vitamin malabsorption. Prioritizing vitamin deficiencies: Vitamin A deficiency is the most immediately threatening finding. Her clinical presentation of night blindness (impaired rhodopsin synthesis from 11-cis retinal deficiency), Bitot spots (keratinized metaplastic conjunctival epithelium from squamous metaplasia), and corneal haziness represents progressive xerophthalmia. Without prompt intervention, this will progress to corneal ulceration, keratomalacia, and irreversible blindness — the leading preventable cause of childhood blindness globally. Vitamin A 50,000–100,000 IU of water-miscible retinol should be administered immediately. Water-miscible formulations of all fat-soluble vitamins are essential in CF — standard oil-based preparations require functional micellar solubilization for absorption and are poorly absorbed in fat malabsorption states. The elevated INR (1.8) and prolonged prothrombin time reflect vitamin K deficiency impairing synthesis of clotting factors II, VII, IX, and X — a bleeding risk requiring vitamin K supplementation. Vitamin D at 14 ng/mL requires high-dose supplementation (50,000 IU weekly or 2,000–4,000 IU daily). The Cystic Fibrosis Foundation recommends routine water-miscible supplementation of all four fat-soluble vitamins in pancreatic-insufficient CF patients with regular monitoring. (Choice D) Standard oil-based fat-soluble vitamin supplements are preferred over water-miscible formulations because they provide better absorption when combined with adequate PERT dosing Standard oil-based fat-soluble vitamin preparations require functional micellar solubilization for intestinal absorption — the same process that is impaired in pancreatic exocrine insufficiency. In CF patients with fat malabsorption, oil-based vitamin supplements have significantly lower bioavailability than water-miscible formulations, which are absorbed through mechanisms that partially bypass the requirement for bile salt micelles. The Cystic Fibrosis Foundation specifically recommends water-miscible formulations of vitamins A, D, E, and K for all pancreatic-insufficient CF patients. Cost should not justify prescribing a less bioavailable formulation to a patient with active vitamin A deficiency-related corneal disease. (Choice E) Vitamin D deficiency at 14 ng/mL represents the most clinically significant finding requiring immediate high-dose supplementation; other abnormalities are mild and can be monitored This response fails to recognize the clinical urgency of vitamin A deficiency presenting with corneal changes. Corneal involvement in xerophthalmia represents stage X2 of the WHO xerophthalmia classification and is a pre-blindness emergency requiring immediate high-dose vitamin A. Additionally, vitamin K deficiency with INR 1.8 represents a clinically significant coagulopathy. All four fat-soluble vitamin deficiencies documented in this patient require targeted supplementation — not just vitamin D. Vitamin D at 14 ng/mL is indeed deficient and requires supplementation, but it is not the only significant finding.",

racterized by irreversible anterograde and retrograde amnesia with confabulation. Oral thiamine is inadequate in acute presentations due to impaired intestinal absorption in alcoholic patients. Prompt thiamine repletion can reverse the ophthalmoplegia and ataxia, though cognitive deficits may persist if treatment is delayed. (Choice C) Administer intravenous dextrose 50% before thiamine administration Although hypoglycemia can cause altered mental status, the glucose level here is normal at 94 mg/dL. More critically, administering glucose before thiamine in a thiamine-depleted patient can precipitate or worsen Wernicke encephalopathy by rapidly consuming the remaining thiamine stores through increased glucose metabolism. The pentose phosphate pathway and Krebs cycle both require thiamine cofactors, so glucose administration without prior thiamine repletion can cause acute neurological deterioration. Always give thiamine before glucose in suspected thiamine deficiency. (Choice D) Start lactulose 30 mL orally every 2 hours for hepatic encephalopathy Hepatic encephalopathy is associated with elevated ammonia, asterixis, and stigmata of chronic liver disease, none of which are present here; ammonia is normal and there is no asterixis. The clinical triad of confusion, ophthalmoplegia, and ataxia with characteristic MRI findings strongly points to Wernicke encephalopathy rather than hepatic encephalopathy. Lactulose would not address the underlying thiamine deficiency. (Choice E) Administer intravenous haloperidol for acute agitation While this patient appears confused, haloperidol addresses only the behavioral symptoms without treating the underlying metabolic cause. Antipsychotics can also lower the seizure threshold and potentially worsen confusion in metabolically compromised patients. The patient's presentation with the classic Wernicke triad and characteristic MRI findings indicates thiamine deficiency as the primary problem requiring immediate correction. Delaying
