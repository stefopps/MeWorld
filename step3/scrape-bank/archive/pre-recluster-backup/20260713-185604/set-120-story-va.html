 a systematic review of weight history, dietary intake changes, GI symptoms, functional capacity, and physical examination findings including subcutaneous fat and muscle mass. SGA has strong inter-rater reliability and correlates with postoperative complications, length of hospital stay, and clinical outcomes. In this patient with significant preoperative weight loss, low albumin, and low prealbumin, SGA is the most appropriate tool to comprehensively characterize the degree of malnutrition and guide decisions about preoperative nutritional optimization, such as 7-10 days of enteral or parenteral nutrition before surgery if severe malnutrition is identified. (Choice D) Malnutrition Universal Screening Tool MUST is designed for community-based nutritional screening in general adult populations. While it can be applied in various settings, it is a brief screening tool and is not the validated standard for comprehensive preoperative nutritional assessment in surgical patients. It does not provide sufficient detail about body composition changes or functional status needed for surgical planning. (Choice E) Mini Nutritional Assessment MNA is validated specifically for adults aged 65 and older and incorporates geriatric-specific domains such as cognitive status, psychological stress, and mobility assessments that are particularly relevant to elderly patients. This 58-year-old patient does not meet the age criteria for which MNA was designed and validated, making it inappropriate for preoperative nutritional assessment in this younger surgical patient population.",

t. (Choice E) Since the patient was well-nourished at baseline, standard protein intake of 0.8 g/kg/day is adequate and higher targets may cause unnecessary metabolic stress This reasoning is incorrect and potentially harmful. Pre-illness nutritional status does not protect against the catabolic demands of critical illness. The hypermetabolic response to major trauma and surgery dramatically increases protein turnover, and the standard RDA of 0.8 g/kg/day is grossly insufficient in this context. There is no clinical evidence that protein intakes of 1.5–2.0 g/kg/day in critically ill patients without pre-existing severe renal failure cause clinically significant nitrogen toxicity.",

ith macrocytic red blood cells and hypersegmented neutrophils. While glossitis can occur with folate deficiency, it typically presents as a smooth, beefy-red tongue rather than the magenta discoloration seen here. The angular cheilitis and corneal vascularization are not features of folate deficiency, and the normocytic anemia makes folate deficiency unlikely. (Choice D) Pyridoxine deficiency Vitamin B6 deficiency can cause angular cheilitis and glossitis, but these findings overlap with many B-vitamin deficiencies. The key distinguishing feature is that B6 deficiency does not cause corneal vascularization, which is nearly pathognomonic for riboflavin deficiency. Additionally, B6 deficiency characteristically produces peripheral sensory neuropathy and sideroblastic anemia (microcytic with increased iron stores), neither of which is present in this case. (Choice E) Niacin deficiency Niacin deficiency causes pellagra with the classic '4 Ds': dermatitis (symmetric photosensitive rash in sun-exposed areas), diarrhea, dementia, and death if untreated. The dermatitis is the most prominent feature, appearing as a symmetric, hyperpigmented rash on sun-exposed areas. Angular cheilitis and corneal vascularization are not characteristic of pellagra, making this diagnosis inconsistent with the patient's presentation.",

ious concern in bariatric patients, particularly perioperatively and postoperatively with prolonged vomiting, poor oral intake, or rapid weight loss. However, normal preoperative thiamine levels indicate adequate current stores, and routine postoperative supplementation protocols will address future needs. (Choice C) Refer for psychiatric evaluation before proceeding with nutritional counseling Psychiatric evaluation is an important component of the preoperative bariatric workup, but this patient explicitly denies depressive symptoms and his case does not describe any psychiatric red flags requiring urgent evaluation. More importantly, psychiatric clearance and nutrition education are not mutually exclusive — both can and should proceed in parallel during the preoperative period. Delaying nutrition counseling pending psychiatric evaluation would be inappropriate when the patient has a surgery date 8 weeks away. (Choice D) Provide structured education on postoperative dietary stages and initiate vitamin D supplementation This patient's most pressing preoperative gaps are his lack of dietary knowledge and his vitamin D insufficiency (25-hydroxyvitamin D 18 ng/mL; deficiency defined as <20 ng/mL, insufficiency 20–29 ng/mL). Structured preoperative nutrition education covering the postoperative dietary progression — clear liquids for 1–2 weeks, full liquids, pureed foods, soft foods, and then regular-textured foods over 4–8 weeks — is a cornerstone of bariatric preoperative preparation. Patients who understand and practice this progression preoperatively have significantly better early postoperative outcomes, fewer episodes of vomiting and maladaptive eating behaviors, and improved long-term weight loss. His admission that he has \"no idea\" what he will eat postoperatively signals a critical knowledge deficit that must be addressed before surgery. ASMBS guidelines recommend that all bariatric candidates receive comprehensive nutrition counseling preoperatively, including education on protein prioritization (goal ≥60–80 g/day postoperatively), hydration strategies, and avoidance of calorie-dense liquids. Simultaneously, his vitamin D level of 18 ng/mL meets criteria for deficiency and should be corrected with high-dose vitamin D3 (typically 3,000–6,000 IU/day or a loading dose) before surgery to prevent accelerating bone resorption and secondary hyperparathyroidism postoperatively. His thiamine, iron, and hemoglobin are all within normal limits, making those less urgent priorities. (Choice E) Begin oral iron supplementation given the risk of postoperative iron malabsorption This patient's ferritin of 95 ng/mL and hemoglobin of 15.1 g/dL indicate no current iron deficiency; preemptive iron supplementation is not indicated preoperatively in a patient without deficiency. While iron malabsorption can occur after bariatric surgery (particularly with gastric bypass procedures that bypass the duodenum where iron is primarily absorbed), sleeve gastrectomy has less risk of iron malabsorption since it preserves the duodenum. Initiating iron therapy without a deficiency state is not evidence-based and may cause unnecessary gastrointestinal side effects. Iron monitoring and supplementation should be guided by postoperative laboratory values.",

dence that exclusive IV amino acid delivery is superior for managing encephalopathy or sarcopenia in this clinical setting. (Choice D) Restrict protein to 0.8 g/kg/day indefinitely to prevent recurrence of encephalopathy While 0.8 g/kg/day meets basic protein requirements for healthy individuals, it falls well below the 1.2–1.5 g/kg/day recommended for patients with cirrhosis. This inadequate intake fails to prevent or reverse sarcopenia, which is both a consequence and driver of poor outcomes in cirrhosis. Sarcopenia independently predicts encephalopathy recurrence, longer hospitalizations, and increased mortality. The fear of precipitating encephalopathy through adequate protein intake is unfounded when appropriate protein sources are chosen. (Choice E) Maintain protein intake at 1.2–1.5 g/kg/day with preference for branched-chain amino acid and vegetable protein sources Current EASL and AASLD guidelines recommend that patients with cirrhosis, including those with hepatic encephalopathy, receive 1.2–1.5 g/kg/day of protein. The historical practice of protein restriction was based on the rationale that dietary protein generates ammonia; however, this approach is now recognized to worsen sarcopenia, which itself increases ammonia production from skeletal muscle and impairs the muscle's role as an extrahepatic ammonia detoxifier. Branched-chain amino acids (BCAAs) — leucine, isoleucine, and valine — are preferentially metabolized in skeletal muscle rather than the liver and do not generate significant ammonia loads, making them well tolerated in encephalopathy. Vegetable protein sources are similarly preferred because plant-based proteins have higher fiber content, which reduces colonic ammonia absorption, and have a more favorable amino acid profile with lower aromatic amino acid content. Adequate protein intake is essential to reverse or prevent sarcopenia, which is associated with increased mortality, longer hospitalizations, and higher rates of encephalopathy rec e training data, and the absence of human oversight may delay identification of clinically harmful errors at scale. This is the most critical limitation for population-level deployment of AI-driven nutrition tools. AI algorithms learn from training datasets, and if those datasets overrepresent certain demographic groups (e.g., young, educated, White, high-income populations — as is common in precision nutrition research cohorts), the resulting models may perform poorly or generate inequitable recommendations for underrepresented groups such as racial and ethnic minorities, elderly patients, low-literacy populations, or those with food insecurity. At the population level, even small systematic biases are amplified across thousands of patients. Additionally, AI platforms operating with limited human oversight can propagate errors at scale before they are detected — a risk that is lower in one-on-one dietitian encounters where clinical judgment provides a safety check. Regulatory frameworks for AI-driven health platforms (e.g., FDA's Software as a Medical Device guidance) require evaluation of algorithmic fairness, validation across diverse populations, and transparency about training data. The medical director must critically assess whether the training data is representative of the prediabetic population across her 15 clinics and what safeguards exist for error detection and human escalation. Failure to address these issues risks worsening health disparities rather than reducing them. (Choice D) Digital nutrition counseling platforms are ineffective in prediabetic populations because the majority of these patients lack sufficient health literacy and smartphone proficiency to engage meaningfully with AI-driven dietary recommendations. This presents an overgeneralization about prediabetic populations and digital health literacy. While health literacy considerations are important in any population health intervention, they should inform inclusive design rather than prec nt, pertinent history, examination findings, assessment, and plan for each patient, even though the encounter occurs in a group setting. The SMA model has been shown to improve patient engagement, dietary adherence, and clinical outcomes while increasing practice efficiency by allowing one physician-RDN team to serve multiple patients in the same time block. Payers vary in their SMA coverage policies, so verifying insurer-specific requirements prior to implementation is strongly recommended.",
