ntibiotics may worsen outcomes in STEC infections by increasing toxin release through bacterial lysis. (Choice C) Production of a toxin that inhibits protein synthesis in renal endothelial cells via ribosomal inactivation E. coli O157:H7 produces Shiga toxin (specifically Stx2), which is absorbed from the inflamed colon into the systemic circulation following initial bloody diarrhea. Shiga toxin binds to the globotriaosylceramide (Gb3) receptor, which is highly expressed on renal glomerular endothelial cells, podocytes, and mesangial cells. Once internalized, the toxin's A subunit is cleaved and inhibits the 28S ribosomal RNA of the 60S ribosomal subunit, halting protein synthesis and inducing endothelial cell death. The resulting endothelial injury triggers a prothrombotic microangiopathy with platelet-fibrin thrombi in small vessels, leading to the classic triad of HUS: microangiopathic hemolytic anemia (schistocytes), thrombocytopenia, and acute kidney injury. Antibiotics are contraindicated in suspected STEC infection because bacterial lysis releases additional Shiga toxin, increasing the risk of HUS by up to 17-fold according to meta-analyses. Supportive care with careful fluid management and dialysis when needed is the standard approach. (Choice D) Elaboration of a pore-forming toxin causing direct osmotic lysis of erythrocytes Pore-forming toxins such as alpha-hemolysin (Staphylococcus aureus) and streptolysin O (Streptococcus pyogenes) create transmembrane pores that cause direct cell membrane disruption and osmotic lysis. This is not the mechanism of Shiga toxin, which works through ribosomal inactivation rather than membrane disruption. The hemolysis in HUS is microangiopathic - red blood cells are mechanically fragmented as they pass through fibrin-occluded microvasculature damaged by Shiga toxin-induced endothelial injury. The presence of schistocytes on blood smear confirms this mechanical fragmentation rather than direct hemolysis. (Choice E) Cytokine- rt vitamin D optimization as an important adjunctive strategy. In this patient with a 25(OH)D of 14 ng/mL — well below the recommended threshold of 40 ng/mL for MS patients — supplementation with cholecalciferol (vitamin D3) at doses of 2,000–5,000 IU/day is appropriate, with periodic monitoring of 25(OH)D and calcium levels. This intervention is safe, inexpensive, and complementary to her natalizumab therapy. Patients with MS who have limited sun exposure and low dietary vitamin D intake, as in this case, are at particularly high risk for deficiency and should be screened routinely. (Choice C) Since large randomized trials have not proven a relapse benefit, vitamin D supplementation should be withheld until definitive evidence emerges While definitive RCT evidence for MS relapse reduction continues to emerge, withholding supplementation in documented deficiency is inappropriate. Vitamin D deficiency has established consequences for bone health and immune function beyond MS. The excellent safety profile of standard supplementation doses makes correction reasonable even pending definitive efficacy data for MS outcomes. (Choice D) Dietary modification with increased fatty fish and fortified dairy products is sufficient to correct vitamin D deficiency without requiring supplementation Dietary sources of vitamin D are generally insufficient to correct significant deficiency, particularly in individuals with limited sun exposure. Fatty fish (salmon, mackerel) provides approximately 400–600 IU per serving, and achieving therapeutic levels through diet alone in a deficient patient would require impractically large food quantities. Cholecalciferol (vitamin D3) supplementation is the recommended approach for correcting documented deficiency. (Choice E) High-dose vitamin D supplementation (≥ 40,000 IU daily) should be initiated to maximize immunosuppression and prevent MS relapses Very high-dose vitamin D regimens (e.g., Coimbra protocol at 40,000 IU/day or more) are experime e — rather than changing doses — is the appropriate first step when this interaction is identified. After adjusting the schedule, TSH should be rechecked in 6-8 weeks to confirm normalization. (Choice C) Switch from calcium carbonate to calcium citrate and continue taking all medications together at the same time Both calcium carbonate and calcium citrate interact with levothyroxine and can reduce its absorption when taken simultaneously. The interaction is a class effect of calcium supplementation on levothyroxine bioavailability, not specific to the carbonate salt form. Switching calcium formulations without addressing timing of administration will not reliably correct the elevated TSH. (Choice D) Order thyroid ultrasonography to evaluate for a new thyroid nodule causing suppressed hormone production The clinical scenario provides a clear pharmacokinetic explanation for the elevated TSH — simultaneous ingestion of calcium with levothyroxine — making a structural thyroid etiology highly unlikely. The patient has established hypothyroidism that was previously well-controlled on the same levothyroxine dose, and the TSH elevation coincided with starting calcium supplementation. Thyroid ultrasound evaluates for nodules or structural disease but would not explain this sudden change in a previously stable patient. The timing correlation with supplement initiation makes drug-supplement interaction the most likely explanation, and addressing this interaction is the appropriate first step before pursuing unnecessary imaging studies. (Choice E) Discontinue calcium supplementation permanently, as calcium cannot be safely used with levothyroxine Calcium supplementation is not contraindicated with levothyroxine; the interaction is a pharmacokinetic one related to timing of co-administration, not an absolute contraindication. Calcium is an important supplement for osteoporosis prevention in this patient and should not be discontinued. Simply separating the doses by 4 or more hou ns with sodium ~90 mEq/L and near-isotonic osmolarity are specifically designed to exploit sodium-glucose co-transport, promoting net fluid and electrolyte absorption. This is in contrast to patients with colon-in-continuity, who have greater absorptive capacity and more flexibility in fluid intake. Recommending this solution, sipped slowly throughout the day rather than consumed as boluses, is the cornerstone of oral hydration management in jejunostomy-dependent short bowel syndrome. Clinical trials and guidelines from ESPEN and ASPEN support its use as a first-line oral strategy to reduce intravenous fluid requirements. (Choice D) Hypotonic sports drinks Commercial sports drinks contain far too little sodium (approximately 18–25 mEq/L) to meet the threshold for net jejunal absorption. Consuming these solutions in a patient with a high-output jejunostomy can paradoxically increase stoma losses by drawing sodium and water into the intestinal lumen down osmotic and concentration gradients. (Choice E) High-volume hypotonic fluid intake to compensate for stoma losses Increasing intake of hypotonic, low-sodium fluids in a jejunostomy patient is a common but dangerous misconception. Because the jejunum passively equilibrates luminal contents with plasma osmolality, ingesting large volumes of hypotonic fluid draws sodium from the bloodstream into the gut lumen, paradoxically increasing stoma output and worsening hyponatremia and dehydration. This phenomenon occurs because the jejunal epithelium acts as a 'leaky' membrane that follows osmotic gradients.",

estriction is used in conditions such as urea cycle disorders or certain organic acidemias where protein catabolism generates toxic metabolites. In GSD type III, protein restriction would be actively harmful because amino acids are a primary gluconeogenic substrate when glycogen mobilization is impaired. Reducing protein intake in this patient would worsen hypoglycemia risk and deprive muscles of necessary building blocks, exacerbating the myopathy. (Choice D) High-protein diet with frequent meals and avoidance of prolonged fasting GSD type III (Cori/Forbes disease) is caused by deficiency of the amylo-1,6-glucosidase debranching enzyme, which is required to remove branch points during glycogenolysis. As a result, glycogen degradation stalls at branch points, producing abnormal limit dextrin glycogen that accumulates in the liver and muscle. Unlike GSD type Ia, gluconeogenesis is intact in GSD type III, meaning amino acids can serve as effective gluconeogenic substrates to maintain euglycemia. A high-protein diet (3-4 g/kg/day in children) supports gluconeogenesis, provides substrate for hepatic glucose export, and may also benefit the myopathy by supporting muscle protein synthesis and serving as a direct energy substrate via oxidative pathways. Frequent meals — including a high-protein snack before bed — help bridge fasting intervals and prevent hypoglycemia. Uncooked cornstarch can also be used adjunctively. This combined approach addresses both the hepatic phenotype (hypoglycemia, transaminase elevation) and the skeletal muscle phenotype (weakness, elevated CK) characteristic of GSD III. (Choice E) Continuous nocturnal intravenous glucose infusion without targeted daytime dietary modifications Continuous nocturnal glucose infusion may be necessary in infants with severe GSD, but it is not the standard long-term management in an adolescent with GSD type III and mild-to-moderate hypoglycemia. This approach also fails to address the myopathic component, does not le l therapy until protein goals are met Delaying mobilization until nutritional targets are achieved is counterproductive and contradicts evidence-based practice. Physical therapy and early mobilization work synergistically with nutrition to stimulate muscle protein synthesis and prevent disuse atrophy. Current guidelines from ESPEN and SCCM emphasize that both early mobilization and optimized nutrition should be initiated simultaneously as soon as the patient is clinically stable, as withholding either component significantly impairs recovery outcomes. (Choice D) Switch from enteral to parenteral nutrition to bypass gastrointestinal limitations There is no indication to switch to parenteral nutrition (PN) in a patient with a functional gastrointestinal tract who is already tolerating enteral nutrition. Enteral nutrition is preferred over PN because it maintains gut mucosal integrity, reduces infection risk, and is associated with fewer complications. The appropriate intervention is to optimize the enteral formula composition and rate rather than changing the route of delivery. (Choice E) Increase protein to 74–124 g/day and increase total calories to adequately spare protein from catabolism This patient is currently receiving only 52 g of protein per day, which equates to approximately 0.84 g/kg/day — well below the recommended 1.2–2.0 g/kg/day (74–124 g/day for her 62 kg body weight) needed to support muscle protein synthesis after traumatic injury. Equally important, her caloric intake of 1,400 kcal/day may be insufficient to meet her total energy expenditure, causing dietary protein to be catabolized for gluconeogenesis rather than used for anabolism — a phenomenon known as protein-sparing failure. Adequate carbohydrate provision (typically 50–60% of non-protein calories) is essential to suppress gluconeogenesis and allow ingested protein to be directed toward tissue repair and muscle synthesis. Increasing both protein and total calories, combined with active phys
