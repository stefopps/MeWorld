vailability Refined carbohydrates are rapidly digested and absorbed, causing sharp postprandial glucose peaks and compensatory insulin surges. The subsequent fall in blood glucose contributes to the energy \"crash\" experienced after high-carbohydrate meals. Dietary fats (9 kcal/g) and proteins (4 kcal/g) are digested more slowly and stimulate incretin hormones that moderate gastric emptying, resulting in more gradual glucose absorption and sustained energy availability. Complex carbohydrates with higher fiber content attenuate this effect compared to refined carbohydrates. (Choice E) Protein is the body's preferred energy substrate during the fed state and is metabolized before carbohydrates or fats when available Protein is not the primary energy substrate in the fed state. During fed conditions, carbohydrates are preferentially oxidized first due to their rapid absorption and insulin's effect on promoting glucose utilization. Fats serve as the secondary energy substrate. Protein serves primarily structural, enzymatic, hormonal, and immunological roles. Significant protein catabolism for energy occurs only during starvation, prolonged fasting, or severe metabolic stress when glycogen stores are depleted.",

mation from transplacental iodine deficiency Skeletal dysplasia and impaired long bone formation result from deficiencies in calcium, phosphorus, or vitamin D, not iodine. While thyroid hormones do influence bone metabolism and growth, and severe hypothyroidism can cause delayed skeletal maturation, this occurs postnatally rather than as fetal skeletal dysplasia. The most critical and time-sensitive fetal consequence of maternal iodine deficiency is irreversible neurological damage during the critical windows of brain development. (Choice D) Fetal wound healing impairment and immune deficiency from transplacental zinc depletion secondary to maternal iodine deficiency Impaired fetal wound healing and immune deficiency are consequences of fetal zinc deficiency, not iodine deficiency. These are distinct mineral deficiency states with separate mechanisms and clinical consequences. Iodine deficiency specifically impairs thyroid hormone synthesis, and the most serious fetal consequence is irreversible cretinism from inadequate thyroid hormone during critical neurodevelopmental windows. (Choice E) Fetal dilated cardiomyopathy from transplacental selenium deficiency secondary to iodine malabsorption Dilated cardiomyopathy from mineral deficiency is the hallmark of selenium deficiency (Keshan disease), not iodine deficiency. While severe hypothyroidism can affect cardiac function, the primary mechanism of cardiomyopathy from nutritional deficiency involves selenium's role in antioxidant enzyme function. The most serious fetal consequence of maternal iodine deficiency is irreversible neurological damage from inadequate thyroid hormone during critical brain development.",

ectly worsening glycemic control. Studies show food-insecure diabetic patients are significantly more likely to skip or reduce insulin doses. Fourth, chronic financial stress and food insecurity activate the hypothalamic-pituitary-adrenal axis, raising circulating cortisol, which stimulates hepatic gluconeogenesis, promotes visceral adiposity, and causes peripheral insulin resistance. The appropriate clinical response includes screening for food insecurity using validated tools, warm referral to SNAP, WIC, food banks, and produce prescription programs, and adjusting the diabetes management plan to account for the feast-famine cycle pattern. (Choice B) Food insecurity worsens glycemic control because food-insecure patients have lower health literacy and therefore cannot effectively understand or implement diabetes self-management strategies While health literacy is an important social determinant that can affect diabetes self-management, attributing food insecurity's impact on glycemic control to health literacy conflates two distinct social determinants. Food insecurity independently worsens glycemic control through structural and physiological mechanisms — erratic food access, dietary quality constraints, medication cost trade-offs, and chronic stress — that operate regardless of health literacy level. Many food-insecure patients have excellent diabetes knowledge but cannot act on it due to material resource constraints. Blaming poor outcomes on health literacy without addressing food access barriers is an inadequate clinical response. (Choice C) Food insecurity has no direct physiological effect on glycemic control, and the elevated HbA1c is primarily due to medication nonadherence that should be addressed through enhanced patient education Food insecurity has well-documented, direct, and multimechanistic effects on glycemic control that go far beyond medication nonadherence. Addressing poor glycemic control in food-insecure patients with intensified patient education without screening for and addressing food insecurity misses the primary structural barrier to diabetes management. This approach places the burden of a systemic social problem on the individual patient and is both clinically ineffective and ethically problematic. The appropriate response is food insecurity screening, resource referral, and adaptation of the clinical management plan to the patient's actual circumstances. (Choice D) Food insecurity contributes to poor glycemic control primarily through micronutrient deficiencies from low dietary diversity, which impair insulin receptor function at the cellular level While micronutrient deficiencies including zinc and chromium can theoretically impair insulin signaling, these are not the primary established mechanisms by which food insecurity worsens glycemic control in clinical practice. The dominant mechanisms are the behavioral and physiological consequences of erratic food access — feast-famine cycles, forced reliance on high-glycemic foods, medication rationing, and chronic stress-mediated cortisol elevation — rather than specific micronutrient deficiencies in insulin signaling pathways. (Choice E) Food insecurity causes poor glycemic control exclusively through obesity from excess caloric intake of low-cost processed foods, and glycemic control improves automatically once weight loss is achieved While food insecurity is associated with obesity through forced reliance on cheap calorie-dense foods, the relationship between food insecurity and poor glycemic control is not mediated solely through obesity or excess caloric intake. Many food-insecure patients experience periods of frank caloric insufficiency, not excess. The mechanisms include erratic feast-famine cycles, medication rationing, chronic stress-mediated cortisol elevation, and nutrient-poor dietary quality — none of which are addressed by caloric restriction alone. This oversimplified explanation fails to capture the complex bidirectional relationshi  or abuse is an inappropriate, harmful, and potentially traumatizing response that erodes trust in the healthcare system and deters future care-seeking. The appropriate response is food assistance referral, social work involvement, and coordinated support. (Choice C) The child's recurrent gastroenteritis suggests an underlying immunodeficiency disorder that requires workup; food insecurity is an incidental finding that does not need immediate intervention While recurrent infections in a young child do warrant consideration of immunodeficiency, the clinical context strongly suggests food insecurity as the primary issue. The combination of documented food insecurity (positive Hunger Vital Sign), growth faltering (weight dropping from 40th to 10th percentile), and iron deficiency anemia (Hgb 10.1, MCV 68) indicates nutritional compromise that directly contributes to immune dysfunction. Iron deficiency impairs neutrophil function and T-cell proliferation, increasing infection susceptibility. Addressing the identified and modifiable social determinant of food insecurity should be the first priority before pursuing costly immunodeficiency workups. (Choice D) Food-insecure families disproportionately use the emergency department as their primary healthcare contact point due to barriers to primary care access, making the ED a critical and often only opportunity to identify food insecurity and initiate resource connection The emergency department is a disproportionately important site for food insecurity screening because food insecurity and healthcare utilization patterns are deeply interconnected. Food-insecure families face multiple structural barriers to primary care access including inability to afford copays and premiums, lack of transportation, inability to take time off work for appointments, and limited availability of evening or weekend primary care appointments. As a result, food-insecure families — particularly those with young children — are significantly more likely to use the emergency department as their de facto primary care access point. This child's three ED visits in four months is a classic utilization pattern of a family without reliable primary care access. The ED therefore represents a high-yield, high-need population touchpoint for food insecurity identification. Failing to screen and refer in the ED because \"it's the primary care provider's job\" is a system failure that leaves vulnerable families without connection to life-improving resources at the moment they are most accessible to the healthcare system. Emergency department-based food insecurity screening programs combined with on-site social work, food pantry partnerships, and SNAP enrollment assistance have demonstrated significant reductions in return ED visits, hospitalizations, and diet-related illness. This child's growth faltering (weight dropping from 40th to 10th percentile) and iron deficiency anemia (hemoglobin 10.1, MCV 68) are direct nutritional consequences of food insecurity that will continue to worsen without intervention. Referral to WIC (which provides food vouchers for children under five and their mothers), SNAP, and a food bank, combined with close primary care follow-up, constitutes the appropriate comprehensive response. (Choice E) Food insecurity screening falls outside the scope of emergency medicine practice and should be deferred to primary care providers and social workers Limiting ED clinical responsibility to the acute presenting complaint without addressing identified social determinants of health represents an outdated and increasingly discredited model of emergency care. Professional organizations including the American College of Emergency Physicians and the Society for Academic Emergency Medicine recognize food insecurity screening and resource referral as within the scope of emergency medicine practice, particularly for pediatric patients with recurrent presentations consistent with social vulnerability. Delegating ent elease from repeated purging stimulation rather than pancreatic amylase from pancreatitis. Acute pancreatitis is an uncommon complication of binge eating and would present with severe abdominal pain, lipase elevation, and imaging findings. Salivary amylase isoform elevation is a recognized laboratory finding in bulimia nervosa but does not represent the direct metabolic consequence of purging — the hypokalemic hypochloremic metabolic alkalosis is the pathognomonic and clinically most important laboratory finding. (Choice D) Hypernatremia from fluid loss during vomiting episodes causing concentration of serum electrolytes This patient's sodium is 138 mEq/L, which is normal — not hypernatremia. While vomiting does cause fluid loss, the predominant electrolyte abnormalities from purging are hypokalemia and hypochloremia from loss of gastric HCl, not hypernatremia. The body's osmotic regulation systems maintain sodium concentration within a narrow range. Hypernatremia is not a recognized characteristic laboratory finding of bulimia nervosa. (Choice E) Metabolic alkalosis with hypokalemia, and hypochloremia from chronic loss of hydrochloric acid and volume depletion-mediated aldosterone activation Chronic self-induced vomiting causes a predictable and pathognomonic metabolic derangement through direct loss of gastric secretions. Gastric juice is highly acidic, containing hydrochloric acid (HCl) at concentrations of approximately 0.1 mol/L. Each episode of vomiting expels large quantities of hydrogen ions (H⁺) and chloride ions (Cl⁻) from the stomach. Loss of H⁺ directly raises serum pH (alkalosis), and the kidney responds to this alkalosis by excreting bicarbonate — however, in the setting of concurrent volume depletion from repeated vomiting, the kidney prioritizes sodium and volume conservation over bicarbonate excretion, perpetuating the alkalosis (a phenomenon called \"contraction alkalosis\" and \"chloride-responsive alkalosis\"). Volume depletion also activates the ature of AN and may paradoxically reinforce the disorder by activating the anxiety and control-seeking behaviors that drive food restriction. Patients with AN are often already aware of medical risks at an intellectual level but are unable to act on this knowledge due to the ego-syntonic nature of the disorder. Empathetic motivational interviewing focused on the patient's own values and goals is far more likely to achieve treatment engagement than fear-based education.",
