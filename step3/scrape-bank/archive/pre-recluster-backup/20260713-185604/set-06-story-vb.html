acilli smear and culture.\n(Choice A)\nObtain a CT scan of the chest\nCT chest would provide more detailed imaging and could reveal cavitary lesions typical of tuberculosis, but it delays the most urgent need for respiratory isolation. In suspected TB cases, isolation must precede further diagnostic imaging to prevent nosocomial transmission.\n(Choice B)\nAdminister intravenous ceftriaxone and azithromycin for community-acquired pneumonia\nThis antibiotic combination would be appropriate for community-acquired pneumonia, but the constellation of symptoms (hemoptysis, night sweats, weight loss), occupational exposure, and upper lobe infiltrates create high suspicion for tuberculosis. Immediate isolation takes priority over empiric antibiotics to prevent transmission.\n(Choice C)\nStart empiric antifungal therapy with voriconazole\nAntifungal therapy might be considered for fungal infections like aspergillosis, but the presentation is more consistent with tuberculosis, and isolation is the priority before specific treatment.\n(Choice D)\nPlace the patient in respiratory isolation\nGiven the high clinical suspicion for pulmonary tuberculosis based on symptoms, exposure history, and imaging, immediate respiratory isolation is essential to prevent spread of infection prior to confirmatory testing.\n(Choice E)\nPerform urgent bronchoscopy with bronchoalveolar lavage\nBronchoscopy could obtain specimens for acid-fast bacilli testing and rule out other causes of hemoptysis, but performing this procedure without prior isolation would risk exposing healthcare workers to aerosolized TB organisms. Isolation must be established first.","likely":"D.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":8,"sceneSize":8,"globalIndex":24,"id":"4682","sceneScore":13,"question":"A 55-year-old man with a history of alcohol abuse is admitted to the intensive care unit for acute pancreatitis. On hospital day 3, he develops fever, tachycardia, and hypotension, with blood cultures positive for gram-negative rods. He is started on broad-spectrum antibiotics and intravenous fluids. Over the next 24 hours, he develops rapidly worsening shortness of breath, tachypnea, and hypoxemia requiring mechanical ventilation. Physical examination reveals diffuse bilateral crackles.Laboratory results and arterial blood gas analysis are shown below. Chest radiography demonstrates diffuse bilateral alveolar infiltrates. Echocardiography shows normal left ventricular function with no evidence of heart failure. Which of the following is the most likely diagnosis?\n\n\n\nWhite Blood Cell Count (WBC)\t14.5×109/L\nRed Blood Cell Count (RBC)\t4.80×1012/L\nHemoglobin (Hgb)\t14.2 g/dL\nHematocrit (Hct)\t42.0 %\nPlatelet Count\t210×109/L\npH (Arterial)\t7.32\nPaCO2​ (Arterial)\t48 mm Hg\nPaO2​ (Arterial)\t55 mm Hg\nFiO2​\t100 %\nPaO2​/FiO2​ Ratio\t55\t(normal:>400)\nBicarbonate (HCO3−​)\t24 mEq/L","answers":[{"label":"A","text":"Community-acquired pneumonia\n(6.94%)"},{"label":"B","text":"Acute respiratory distress syndrome\n(75%)"},{"label":"C","text":"Aspiration pneumonia\n(5.56%)"},{"label":"D","text":"Cardiogenic pulmonary edema\n(4.17%)"},{"label":"E","text":"Pancreatic pleural effusion\n(8.33%)"}],"explanation":"Explanation\nThis 55-year-old man with acute pancreatitis develops sepsis leading to acute respiratory distress syndrome (ARDS), characterized by acute onset of respiratory distress, severe hypoxemia (PaO2/FiO2 < 300), bilateral alveolar infiltrates on imaging, and absence of cardiogenic cause. Sepsis from pancreatitis is a common trigger for ARDS, involving increased pulmonary vascular permeability and noncardiogenic pulmonary edema.\n(Choice A)\nCommunity-acquired pneumonia\nThis is incorrect because while sepsis is present, the respiratory failure is due to ARDS secondary to sepsis rather than primary pneumonia, and imaging shows diffuse infiltrates rather than lobar consolidation.\n(Choice B)\nAcute respiratory distress syndrome\nThis is the correct diagnosis, as the patient meets Berlin criteria for ARDS: acute onset, severe hypoxemia (PaO2/FiO2 ≤ 100 indicates severe ARDS), bilateral infiltrates, and no evidence of cardiac failure.\n(Choice C)\nAspiration pneumonia\nThis is incorrect as there is no history of witnessed aspiration or risk factors such as altered mental status during the onset. Additionally, aspiration pneumonia typically causes unilateral or focal consolidation rather than the diffuse bilateral infiltrates characteristic of ARDS.\n(Choice D)\nCardiogenic pulmonary edema\nThis is incorrect because echocardiography demonstrates normal left ventricular function with no evidence of heart failure. Additionally, cardiogenic pulmonary edema typically presents with elevated pulmonary capillary wedge pressure and responds to diuretics, unlike this case.\n(Choice E)\nPancreatic pleural effusion\nThis is incorrect because pancreatic pleural effusions typically present as left-sided pleural effusions with high amylase levels, not diffuse bilateral alveolar infiltrates. The severe hypoxemia and bilateral infiltrates are characteristic of ARDS, not pleural effusion.","likely":"B.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":1,"sceneSize":8,"globalIndex":25,"id":"4861","sceneScore":11,"question":"A 32-year-old woman is brought to the emergency department after collapsing at home. She reports heavy vaginal bleeding for the past 24 hours following a recent miscarriage. On examination, she is pale, with a blood pressure of 85/55 mm Hg, heart rate of 130 beats/min, cool and clammy extremities, and flat neck veins. Laboratory studies are shown below. She is suspected to have hypovolemic shock due to postpartum hemorrhage. A bedside echocardiogram is performed to assess her cardiac function. Which of the following echocardiographic findings is most likely in this patient?\n\n\n\nWhite blood cell count\t6.8x10^3/µL\nNeutrophils\t60%\nLymphocytes\t30%\nMonocytes\t7%\nEosinophils\t2%\nBasophils\t1%\nRed blood cell count\t2.4x10^6/µL\nHemoglobin\t7 g/dL\nHematocrit\t21%\nMean corpuscular volume\t88 fL\nMean corpuscular hemoglobin\t29 pg\nMean corpuscular hemoglobin concentration\t33 g/dL\nRed cell distribution width\t14.5%\nPlatelet count\t250x10^3/µL\nMean platelet volume\t9.5 fL","answers":[{"label":"A","text":"Pericardial effusion with right atrial collapse\n(2.6%)"},{"label":"B","text":"Dilated left ventricle with reduced ejection fraction of 30%\n(12.99%)"},{"label":"C","text":"Hyperdynamic left ventricle with ejection fraction of 80% and normal cavity size\n(45.45%)"},{"label":"D","text":"Right ventricular dilation with McConnell's sign\n(0%)"},{"label":"E","text":"Small left ventricular cavity volume with ejection fraction of 75%\n(38.96%)"}],"explanation":"Explanation\nThe patient's presentation with hypotension, tachycardia, cool extremities, flat neck veins, and history of heavy vaginal bleeding following miscarriage is most consistent with hypovolemic shock due to hemorrhagic blood loss. In hypovolemic shock, echocardiographic findings typically include a small left ventricular cavity volume due to decreased preload, with a compensatory increase in ejection fraction to maintain cardiac output. This differentiates it from cardiogenic shock (dilated ventricle with low ejection fraction), obstructive shock like cardiac tamponade (pericardial effusion with chamber collapse), massive pulmonary embolism (right ventricular dilation and strain), and distributive shock (hyperdynamic function with normal or increased cardiac output but low systemic vascular resistance, often without cold extremities).\n(Choice A)\nPericardial effusion with right atrial collapse\nThis suggests cardiac tamponade, a form of obstructive shock where pericardial fluid compresses the heart and impairs ventricular filling. However, the patient lacks the classic Beck's triad findings (elevated JVP, muffled heart sounds, hypotension with pulsus paradoxus), has flat neck veins indicating low preload rather than impaired filling, and her clinical history clearly points to hemorrhagic rather than pericardial pathology.\n(Choice B)\nDilated left ventricle with reduced ejection fraction of 30%\nThis is characteristic of cardiogenic shock, where pump failure leads to low cardiac output and high filling pressures, but the patient has no signs of heart failure and has flat neck veins indicating low preload.\n(Choice C)\nHyperdynamic left ventricle with ejection fraction of 80% and normal cavity size\nThis hyperdynamic pattern is characteristic of distributive shock (such as sepsis or anaphylaxis), where systemic vascular resistance is severely reduced, leading to compensatory increased cardiac output and warm, vasodilated extremities. However, this patient presents with cold, clammy extremities indicating vasoconstriction (not vasodilation) and has a clear hemorrhagic etiology rather than inflammatory or allergic triggers.\n(Choice D)\nRight ventricular dilation with McConnell's sign\nThis is seen in massive pulmonary embolism causing obstructive shock, with right heart strain, but the patient has no risk factors for thromboembolism, respiratory symptoms, or evidence of right heart overload.\n(Choice E)\nSmall left ventricular cavity volume with ejection fraction ","likely":"A.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":2,"sceneSize":8,"globalIndex":26,"id":"2038","sceneScore":11,"question":"A 62-year-old man with a history of type 2 diabetes mellitus, hypertension, and a 30-pack-year smoking history presents to the clinic with complaints of exertional chest tightness that occurs when climbing stairs and resolves with rest. He denies syncope, orthopnea, or lower extremity edema. Physical examination reveals a blood pressure of 148/88 mm Hg, heart rate of 82 beats per minute, and a grade 2/6 systolic murmur heard best at the right upper sternal border, radiating to the carotids. An electrocardiogram shows nonspecific ST-segment changes. Transthoracic echocardiography demonstrates a calcified aortic valve with an estimated valve area of 1.6 cm², a mean transvalvular gradient of 15 mm Hg, and preserved left ventricular ejection fraction of 60%. What is the most likely underlying cause of this patient's chest tightness?","answers":[{"label":"A","text":"Hypertrophic cardiomyopathy\n(2.65%)"},{"label":"B","text":"Pulmonary arterial hypertension\n(1.77%)"},{"label":"C","text":"Coronary artery disease\n(35.4%)"},{"label":"D","text":"Anemia\n(1.77%)"},{"label":"E","text":"Aortic stenosis\n(58.41%)"}],"explanation":"Explanation\nThe patient's exertional chest tightness is consistent with angina. Although echocardiography reveals aortic stenosis, the valve area of 1.6 cm² and low mean gradient indicate mild disease, which is unlikely to cause symptoms. Given his multiple risk factors for atherosclerosis (diabetes, hypertension, smoking), the symptoms are most likely due to obstructive coronary artery disease. Other causes like hypertrophic cardiomyopathy or pulmonary hypertension are less likely without supporting clinical or echocardiographic evidence.\n(Choice A)\nHypertrophic cardiomyopathy\nHypertrophic cardiomyopathy typically causes exertional chest pain due to dynamic left ventricular outflow tract obstruction and increased myocardial oxygen demand. However, the echocardiogram shows preserved ejection fraction without mention of septal hypertrophy, systolic anterior motion of the mitral valve, or outflow tract obstruction that would be characteristic of this condition.\n(Choice B)\nPulmonary arterial hypertension\nPulmonary arterial hypertension can cause exertional chest pain and dyspnea due to right heart strain and reduced cardiac output. However, this typically presents with signs of right heart failure such as elevated jugular venous pressure, peripheral edema, or tricuspid regurgitation murmur. The echocardiogram would show elevated estimated pulmonary artery systolic pressure and right ventricular dysfunction, which are not described.\n(Choice C)\nCoronary artery disease\nThis patient's risk factors (diabetes, hypertension, smoking) and classic exertional angina symptoms, combined with mild aortic stenosis unlikely to be symptomatic, make obstructive coronary artery disease the most likely cause.\n(Choice D)\nAnemia\nAnemia can cause exertional chest pain due to reduced oxygen-carrying capacity, leading to tissue hypoxia and compensatory tachycardia. However, there are no clinical clues suggesting anemia such as pallor, fatigue, or laboratory values. Additionally, this patient's multiple cardiovascular risk factors make coronary artery disease a much more likely explanation for his exertional angina.\n(Choice E)\nAortic stenosis\nWhile aortic stenosis can cause angina in severe cases due to increased myocardial oxygen demand from left ventricular hypertrophy and reduced coronary perfusion during diastole, this patient's valve area of 1.6 cm² indicates mild stenosis (normal >2.0 cm², severe <1.0 cm²). The mean gradient of 15 mm Hg is also consistent with mild disease (sev","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":3,"sceneSize":8,"globalIndex":27,"id":"4088","sceneScore":11,"question":"A 32-year-old G4P3 woman is brought to the emergency department 4 hours after a precipitous delivery in a rural clinic. She experienced heavy vaginal bleeding during and after delivery, requiring multiple blood transfusions. On arrival, she is pale, tachycardic, and hypotensive. Physical examination reveals diffuse petechiae, ecchymoses, and oozing from venipuncture sites. Suddenly, she develops severe chest pain, dyspnea, and hypoxia. Electrocardiogram shows sinus tachycardia with right heart strain, and ventilation-perfusion scan is consistent with pulmonary embolism. Laboratory results are shown below. What is the most likely underlying condition responsible for this patient's presentation?\n\n\n\nWBC\t10.8x10^3/µL\nRBC\t4.0x10^6/µL\nHemoglobin\t12.1g/dL\nHematocrit\t36.5%\nMCV\t91fL\nMCH\t30.3pg\nMCHC\t33.1g/dL\nRDW\t14.8%\nPlatelets\t62x10^3/µL0\nNeutrophils\t70%\nLymphocytes\t20%\nMonocytes\t7%\nEosinophils\t2%\nBasophils\t1%\nProthrombin Time (PT)\t19.5sec\nINR\t1.8\nActivated Partial Thromboplastin Time (aPTT)\t48sec\nFibrinogen\t110mg/dL\t(normal:200-400mg/dL)\nD-Dimer\t3.2mg/L FEU","answers":[{"label":"A","text":"Venous thromboembolism\n(2.86%)"},{"label":"B","text":"Disseminated intravascular coagulation\n(84.29%)"},{"label":"C","text":"Hemorrhagic shock\n(0%)"},{"label":"D","text":"Amniotic fluid embolism\n(10%)"},{"label":"E","text":"Thrombotic thrombocytopenic purpura\n(2.86%)"}],"explanation":"Explanation\nThis acutely decompensating patient most likely developed disseminated intravascular coagulation (DIC) due to significant obstetric bleeding from postpartum hemorrhage, leading to both bleeding and thrombotic complications such as acute pulmonary embolism.\n(Choice A)\nVenous thromboembolism\nWhile postpartum patients are at increased risk for VTE due to hypercoagulability, this diagnosis alone cannot explain the constellation of bleeding manifestations (petechiae, ecchymoses, oozing), thrombocytopenia, prolonged coagulation times, low fibrinogen, and elevated D-dimer - findings characteristic of consumptive coagulopathy rather than isolated thrombosis.\n(Choice B)\nDisseminated intravascular coagulation\nSignificant postpartum hemorrhage can trigger DIC, leading to consumptive coagulopathy with bleeding (petechiae, ecchymoses, oozing) and thrombosis (pulmonary embolism), as evidenced by the laboratory abnormalities.\n(Choice C)\nHemorrhagic shock\nHemorrhagic shock explains the hemodynamic instability (hypotension, tachycardia) from blood loss but does not account for the consumptive coagulopathy evidenced by thrombocytopenia, prolonged PT/aPTT, low fibrinogen, and elevated D-dimer. These laboratory findings, combined with both bleeding and thrombotic manifestations, indicate an underlying coagulopathy rather than simple blood loss.\n(Choice D)\nAmniotic fluid embolism\nAmniotic fluid embolism can cause sudden cardiovascular collapse, respiratory distress, and DIC, but it typically presents during labor or immediately postpartum with biphasic hemodynamic instability. While it can cause coagulopathy, the clinical picture here of massive hemorrhage followed by consumptive coagulopathy is more consistent with hemorrhage-induced DIC.\n(Choice E)\nThrombotic thrombocytopenic purpura\nTTP involves microangiopathic hemolytic anemia with schistocytes, severe thrombocytopenia, neurologic symptoms, and organ dysfunction. This patient lacks evidence of hemolysis (normal hemoglobin, no schistocytes mentioned) and has coagulation abnormalities (prolonged PT/aPTT, low fibrinogen) that are not typical of TTP, which usually has normal coagulation studies.","likely":"B.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":4,"sceneSize":8,"globalIndex":28,"id":"2026","sceneScore":11,"question":"A 58-year-old man with a history of ischemic cardiomyopathy and recurrent ventricular arrhythmias undergoes implantation of a dual-chamber implantable cardioverter-defibrillator (ICD). The procedure is uncomplicated, and he is discharged home. Eight months later, he presents to the clinic with progressive fatigue, exertional dyspnea, and swelling in his lower extremities. Physical examination reveals elevated jugular venous pressure with prominent v waves, a holosystolic murmur heard best at the lower left sternal border that increases with inspiration, tender hepatomegaly, and bilateral pitting edema up to the knees. Laboratory studies are shown below. What is the most likely diagnosis?\n\n\n\nALT\t65\tU/L\nAST\t58\tU/L\nAlkaline Phosphatase\t140\tU/L\nTotal Bilirubin\t1.2\tmg/dL\nAlbumin\t4.0\tg/dL","answers":[{"label":"A","text":"Acute pulmonary embolism\n(1.18%)"},{"label":"B","text":"Tricuspid regurgitation\n(72.94%)"},{"label":"C","text":"Cor pulmonale\n(14.12%)"},{"label":"D","text":"Constrictive pericarditis\n(7.06%)"},{"label":"E","text":"Mitral regurgitation\n(4.71%)"}],"explanation":"Explanation\nThis patient likely has severe tricuspid regurgitation (TR) as a complication of his ICD lead placement. The transvenous lead can damage the tricuspid valve leaflets or interfere with coaptation, leading to chronic severe TR and right-sided heart failure manifestations such as elevated JVP, hepatomegaly, and edema. Diagnosis is supported by clinical findings and would be confirmed by echocardiography. Other options are less consistent with the subacute presentation, absence of left-sided failure signs, and history of recent ICD placement.\n(Choice A)\nAcute pulmonary embolism\nThis is incorrect. While pulmonary embolism can cause acute right heart strain and elevated JVP, it typically presents with acute onset chest pain, dyspnea, and hypoxia rather than the subacute progressive symptoms described. Additionally, PE would not cause a holosystolic murmur that increases with inspiration.\n(Choice B)\nTricuspid regurgitation\nThis is the correct diagnosis. The ICD lead has likely caused mechanical damage to the tricuspid valve, resulting in severe regurgitation and right-sided heart failure symptoms.\n(Choice C)\nCor pulmonale\nThis is incorrect. Cor pulmonale develops from chronic pulmonary disease causing pulmonary hypertension and subsequent right heart failure. This patient lacks a history of chronic lung disease, and the temporal relationship between symptom onset and recent ICD placement strongly suggests a device-related complication rather than primary pulmonary pathology.\n(Choice D)\nConstrictive pericarditis\nThis is incorrect. Constrictive pericarditis presents with equalization of right and left heart diastolic pressures, a pericardial knock on examination, and Kussmaul's sign. It would not cause a holosystolic murmur that increases with inspiration, and there is no clear temporal relationship to recent ICD placement as seen with lead-induced tricuspid regurgitation.\n(Choice E)\nMitral regurgitation\nThis is incorrect. Mitral regurgitation would primarily cause left-sided heart failure with pulmonary congestion, not isolated right-sided signs like hepatomegaly and edema without lung findings.","likely":"B.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":5,"sceneSize":8,"globalIndex":29,"id":"1088","sceneScore":11,"question":"A 28-year-old female presents with a four-week history of progressive fatigue, shortness of breath on exertion, and occasional palpitations. Her personal history reveals a recent fall from a ladder resulting in a severe contusion on the left leg. She has smoked for 15 years and reports social alcohol use. Her father passed away from a heart attack at age 50. On examination, she is tachycardic with a heart rate of 110/min and her blood pressure reads 150/50 mmHg. Her skin feels warm upon palpation with visible pulsations in the neck. There is a noticeable apex beat displaced laterally, accompanied by a low-grade continuous murmur heard loudest at the left sternal border, which does not vary with inspiration or expiration. What is the most probable underlying cause of her symptoms?","answers":[{"label":"A","text":"Cardiomyopathy with systolic dysfunction\n(21.53%)"},{"label":"B","text":"Low cardiac output\n(14.58%)"},{"label":"C","text":"Elevated cardiac preload\n(28.47%)"},{"label":"D","text":"Pulmonary embolism\n(11.81%)"},{"label":"E","text":"Left ventricular outflow obstruction\n(23.61%)"}],"explanation":"Explanation\nThis patient's presentation is consistent with a traumatic arteriovenous fistula following her leg injury. The continuous murmur, wide pulse pressure (150/50), warm extremities, and displaced cardiac apex indicate high-output heart failure. AV fistulas create abnormal communication between arteries and veins, bypassing normal capillary resistance and increasing venous return (preload). Over time, this leads to volume overload and compensatory cardiac changes including left ventricular dilatation and hypertrophy.\n(Choice A)\nCardiomyopathy with systolic dysfunction\nCardiomyopathy with systolic dysfunction typically presents with cool extremities, narrow pulse pressure, and signs of low cardiac output. This patient has warm skin, wide pulse pressure (150/50), and a continuous murmur, suggesting high-output heart failure rather than systolic dysfunction.\n(Choice B)\nLow cardiac output\nLow cardiac output typically presents with cool extremities, weak peripheral pulses, and narrow pulse pressure. This patient has warm skin, visible neck pulsations, and wide pulse pressure (150/50), indicating high cardiac output rather than low output.\n(Choice C)\nElevated cardiac preload\nTraumatic arteriovenous malformations increase cardiac preload by shunting blood and imply high output cardiac failure. This leads to warm extremities, widened pulse pressure, and brisk peripheral pulses with potential left ventricular hypertrophy.\n(Choice D)\nPulmonary embolism\nPulmonary embolism typically presents with acute onset chest pain, dyspnea, and signs of right heart strain. This patient has a gradual onset over four weeks with warm extremities and a continuous murmur, which are not characteristic of PE.\n(Choice E)\nLeft ventricular outflow obstruction\nLeft ventricular outflow obstruction (such as aortic stenosis or hypertrophic cardiomyopathy) typically produces systolic murmurs that vary with maneuvers affecting preload. This patient has a continuous murmur that doesn't change with respiration, which is characteristic of arteriovenous communication.","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":6,"sceneSize":8,"globalIndex":30,"id":"1997","sceneScore":11,"question":"A 58-year-old man with a history of systemic lupus erythematosus presents to the emergency department with worsening shortness of breath during physical activity and persistent fatigue for the past three weeks. He reports no chest pain but notes occasional palpitations. On physical examination, his blood pressure is 130/80 mm Hg, heart rate is 92 bpm, and respiratory rate is 20/min. Jugular venous pressure is elevated, and there are bibasilar crackles on lung auscultation. Cardiac examination reveals a soft S1, a blowing holosystolic murmur loudest at the apex with radiation to the left axilla, and a displaced apical impulse. An electrocardiogram shows sinus rhythm with left atrial enlargement. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Tricuspid regurgitation\n(3.55%)"},{"label":"B","text":"Mitral stenosis\n(2.03%)"},{"label":"C","text":"Mitral regurgitation\n(93.4%)"},{"label":"D","text":"Aortic stenosis\n(1.02%)"}],"explanation":"Explanation\nThis patient's presentation with exertional dyspnea, fatigue, elevated jugular venous pressure, bibasilar crackles, and a blowing holosystolic murmur at the apex radiating to the left axilla is characteristic of severe mitral regurgitation, likely related to his underlying systemic lupus erythematosus affecting the mitral valve. Severe mitral regurgitation leads to left ventricular volume overload, pulmonary congestion, and symptoms of heart failure.\n(Choice A)\nTricuspid regurgitation\nTricuspid regurgitation produces a holosystolic murmur best heard at the left lower sternal border that increases with inspiration (Carvallo's sign). It typically causes right-sided heart failure with peripheral edema and hepatomegaly. This patient's murmur location at the apex with radiation to the left axilla, along with left-sided heart failure signs, is inconsistent with tricuspid regurgitation.\n(Choice B)\nMitral stenosis\nMitral stenosis produces a low-pitched, diastolic rumble at the apex, often preceded by an opening snap. Patients typically present with symptoms of pulmonary hypertension and right heart strain rather than left heart failure. This patient's holosystolic murmur excludes mitral stenosis, which would not produce a systolic murmur.\n(Choice C)\nMitral regurgitation\nThe blowing holosystolic murmur at the apex radiating to the left axilla, along with symptoms of exertional dyspnea, fatigue, and signs of heart failure such as elevated JVP and bibasilar crackles, are classic for severe mitral regurgitation, which can occur in patients with systemic lupus erythematosus due to Libman-Sacks endocarditis affecting the mitral valve.\n(Choice D)\nAortic stenosis\nAortic stenosis typically presents with a harsh, crescendo-decrescendo systolic murmur best heard at the right upper sternal border with radiation to the carotids. The classic triad includes angina, syncope, and heart failure. This patient's holosystolic murmur at the apex with radiation to the axilla is inconsistent with aortic stenosis.","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":7,"sceneSize":8,"globalIndex":31,"id":"1811","sceneScore":11,"question":"A 68-year-old man is brought to the emergency department with a 20-hour history of substernal chest pain and sweating. The pain started yesterday afternoon and continued overnight, easing somewhat by morning, but his wife urged him to seek care. He has hypertension, hyperlipidemia, and smokes one pack of cigarettes daily but is noncompliant with his medications. ECG reveals sinus rhythm with ST-segment elevation in leads II, III, and aVF. Cardiac catheterization demonstrates complete occlusion of the mid-right coronary artery; revascularization is not pursued due to late presentation. On hospital day 4, he abruptly experiences profound dyspnea and low blood pressure. Examination shows diaphoresis, rapid breathing, bilateral lung crackles, and a faint systolic murmur at the cardiac apex. Which of the following is the most likely etiology of this patient's acute deterioration?","answers":[{"label":"A","text":"Pulmonary thromboembolism\n(1.36%)"},{"label":"B","text":"Cardiac tamponade\n(0.68%)"},{"label":"C","text":"Papillary muscle rupture\n(84.35%)"},{"label":"D","text":"Ventricular free wall rupture\n(13.61%)"},{"label":"E","text":"Spontaneous coronary dissection\n(0%)"}],"explanation":"Explanation\nThis patient's presentation of inferior myocardial infarction with late arrival, followed by sudden hypotension, respiratory distress, lung congestion, and a subtle systolic murmur on day 4, points to acute mitral regurgitation from rupture of the posteromedial papillary muscle, a critical post-MI complication typically seen 3-5 days post-infarct.\n(Choice A)\nPulmonary thromboembolism\nPulmonary embolism can cause acute dyspnea, hypotension, and right heart strain, particularly in immobilized post-MI patients. However, it would not cause an apical systolic murmur or the bilateral pulmonary edema pattern seen in this patient, which indicates left heart failure.\n(Choice B)\nCardiac tamponade\nCardiac tamponade presents with hypotension, elevated jugular venous pressure, and muffled heart sounds (Beck's triad). Unlike this patient's presentation, tamponade does not typically cause systolic murmurs or bilateral pulmonary edema, as venous return is impaired rather than forward flow being compromised.\n(Choice C)\nPapillary muscle rupture\nThis severe complication arises 3-5 days post-MI, resulting in acute mitral regurgitation with pulmonary edema, a new systolic murmur (potentially soft or inaudible if severe), and shock. Echocardiography confirms the diagnosis.\n(Choice D)\nVentricular free wall rupture\nVentricular free wall rupture is a catastrophic post-MI complication that causes cardiac tamponade with hypotension, elevated jugular venous pressure, and muffled heart sounds, typically progressing rapidly to cardiac arrest. It does not cause pulmonary edema or systolic murmurs, and occurs more commonly after anterior wall MIs.\n(Choice E)\nSpontaneous coronary dissection\nSpontaneous coronary dissection is an uncommon cause of myocardial infarction that would present with acute chest pain. However, it would not explain the delayed onset of symptoms on day 4 or the new apical systolic murmur with pulmonary edema.","likely":"C.","hasReveal":true},{"sceneId":4,"sceneBeat":"turning point","sceneTitle":"Clot vs fluid","sceneHook":"PE vs decompensated HF: when CT-PA is wrong and when it is mandatory","indexInScene":8,"sceneSize":8,"globalIndex":32,"id":"1384","sceneScore":11,"question":"A 55-year-old female arrives at the emergency department after suddenly experiencing difficulty breathing while cleaning her house. She mentions she felt a sharp pain in her chest before becoming breathless. Her medical history includes deep vein thrombosis. Her vital signs reveal a temperature of 36.9°C, blood pressure of 85/55 mm Hg, heart rate of 110/min, and respiratory rate of 25/min with oxygen saturation at 88% on room air. Auscultation reveals clear lungs, and her skin is cool and clammy. An immediate right heart catheterization provides the following values: \n Right atrial pressure: 16 mmHg \n Pulmonary artery pressure: 38/22 mmHg \n Pulmonary capillary wedge pressure: 10 mmHg \n \n What is the most likely diagnosis?","answers":[{"label":"A","text":"Heart failure exacerbation\n(5.92%)"},{"label":"B","text":"Pulmonary embolism\n(69.74%)"},{"label":"C","text":"Distributive shock\n(6.58%)"},{"label":"D","text":"Cardiogenic shock\n(17.76%)"},{"label":"E","text":"Pneumonia\n(0%)"}],"explanation":"Explanation\nThis patient presents with massive pulmonary embolism causing obstructive shock. The key hemodynamic findings include elevated right atrial pressure (16 mmHg) and pulmonary artery pressure (38/22 mmHg) with normal pulmonary capillary wedge pressure (10 mmHg), indicating isolated right heart strain. Combined with the history of DVT, acute onset of chest pain and dyspnea, and hemodynamic instability, these findings are pathognomonic for massive PE with right heart failure.\n(Choice A)\nHeart failure exacerbation\nHeart failure exacerbation would typically show elevated pulmonary capillary wedge pressure (>18 mmHg) reflecting left heart dysfunction. The normal PCWP of 10 mmHg with isolated right heart strain suggests a different etiology.\n(Choice B)\nPulmonary embolism\nThe patient's right heart catheterization results indicate pulmonary hypertension, which coincides with a sudden acute pulmonary event like a pulmonary embolism (PE). Cool extremities, hypotension, and tachycardia align with PE-induced shock.\n(Choice C)\nDistributive shock\nDistributive shock (septic, anaphylactic, neurogenic) typically presents with warm, vasodilated extremities due to peripheral vasodilation and low systemic vascular resistance. This patient has cool, clammy skin consistent with obstructive shock from massive PE.\n(Choice D)\nCardiogenic shock\nCardiogenic shock from causes other than PE would typically show different hemodynamic patterns, such as elevated PCWP in left heart failure or different pressure relationships. The isolated right heart strain pattern is more specific for acute pulmonary vascular obstruction.\n(Choice E)\nPneumonia\nPneumonia typically presents with fever, productive cough, and pulmonary infiltrates on examination. The hemodynamic profile shows isolated right heart strain without pulmonary congestion, which is inconsistent with pneumonia.","likely":"B.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":1,"sceneSize":8,"globalIndex":33,"id":"3239","sceneScore":14,"question":"A 32-year-old man presents to the emergency department with complaints of persistent headaches, nausea, dizziness, and fatigue over the past two weeks. He works as a night-shift security guard in a small, enclosed booth near a busy parking garage and reports that his symptoms improve when he is away from work. Physical examination is unremarkable, but laboratory studies are shown below. Which of the following is the most likely diagnosis?\n\n\n\nParameter\tResult\nHemoglobin\t17.5 g/dL\nHematocrit\t52 %\nRed Blood Cell Count\t6.0 ×10^6/μL\nMean Corpuscular Volume (MCV)\t90 fL\nMean Corpuscular Hemoglobin (MCH)\t30 pg\nMean Corpuscular Hemoglobin Concentration (MCHC)\t34 g/dL\nWhite Blood Cell Count (WBC)\t7.2 ×10^9/L\nNeutrophils\t60 %\nLymphocytes\t30 %\nMonocytes\t6 %\nEosinophils\t3 %\nBasophils\t1 %\nPlatelet Count\t250 ×10^9/L\nABG - pH\t7.40\nABG - PaCO2\t40 mmHg\nABG - PaO2\t95 mmHg\nABG - HCO3-\t24 mmol/L\nABG - Oxygen Saturation\t88 %\nABG - Base Excess\t0 mmol/L\nABG - Lactate\t1.2 mmol/L","answers":[{"label":"A","text":"Cluster headache\n(0%)"},{"label":"B","text":"Methemoglobinemia\n(18%)"},{"label":"C","text":"Iron deficiency anemia\n(0%)"},{"label":"D","text":"Viral gastroenteritis\n(0%)"},{"label":"E","text":"Carboxyhemoglobinemia\n(82%)"}],"explanation":"Explanation\nThis patient, exposed to vehicle exhaust in an enclosed booth, presents with headaches, nausea, dizziness, fatigue, and secondary polycythemia, consistent with chronic carbon monoxide poisoning. Carbon monoxide binds to hemoglobin with extremely high affinity (200-250 times greater than oxygen), forming carboxyhemoglobin and impairing oxygen delivery to tissues. The resulting tissue hypoxia stimulates erythropoietin production, leading to secondary polycythemia.\n(Choice A)\nCluster headache\nCluster headaches are severe, unilateral, episodic headaches often accompanied by autonomic symptoms like lacrimation and nasal congestion. They are not associated with laboratory abnormalities, polycythemia, or improvement when away from specific environmental exposures like vehicle exhaust.\n(Choice B)\nMethemoglobinemia\nMethemoglobinemia typically presents with cyanosis despite normal PaO2, chocolate-brown blood color, and is usually caused by oxidizing agents (nitrites, certain medications). Unlike this case, methemoglobinemia does not cause polycythemia and symptoms are not environmentally related to vehicle exhaust exposure.\n(Choice C)\nIron deficiency anemia\nIron deficiency anemia would present with low hemoglobin and hematocrit, microcytic red blood cells (low MCV), and does not improve with environmental changes. This patient has polycythemia (elevated hemoglobin, hematocrit, and RBC count) which is opposite of what occurs in iron deficiency.\n(Choice D)\nViral gastroenteritis\nViral gastroenteritis causes acute nausea, vomiting, and diarrhea, not chronic headaches, dizziness, polycythemia, or symptoms tied to a specific enclosed environment.\n(Choice E)\nCarboxyhemoglobinemia\nChronic exposure to carbon monoxide from vehicle exhaust in an enclosed space leads to carboxyhemoglobin formation, causing tissue hypoxia despite normal PaO2. Pulse oximetry shows falsely normal oxygen saturation because it cannot distinguish carboxyhemoglobin from oxyhemoglobin. The tissue hypoxia stimulates erythropoietin production, causing secondary polycythemia.","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":2,"sceneSize":8,"globalIndex":34,"id":"1434","sceneScore":14,"question":"A 38-year-old woman visits the clinic with frequent morning headaches, episodes of dizziness, and occasional confusion. She works in a bakery located downstairs with minimal ventilation. She doesn't smoke or drink alcohol, but mentions feeling unusually tired lately. Physical examination reveals normal heart sounds and a benign abdominal exam. \n\nInitial laboratory findings: \nHematocrit 61%\nWhite Blood Cell count 6,800/mm³\nPlatelets 210,000/mm³. \n\nWhat is the most plausible cause of her increased hematocrit?","answers":[{"label":"A","text":"Dehydration\n(0.81%)"},{"label":"B","text":"High altitude exposure\n(0%)"},{"label":"C","text":"Renal artery stenosis\n(1.63%)"},{"label":"D","text":"Carbon monoxide exposure\n(96.75%)"},{"label":"E","text":"Chronic obstructive pulmonary disease\n(0.81%)"}],"explanation":"Explanation\nThe patient's work environment in a poorly ventilated bakery suggests potential carbon monoxide exposure, which could explain her neurological symptoms (headaches, dizziness, confusion, fatigue). However, CO exposure does not cause polycythemia. The elevated hematocrit requires further investigation for other causes of secondary polycythemia (such as sleep apnea, chronic lung disease) or primary polycythemia vera.\n(Choice A)\nDehydration\nDehydration causes hemoconcentration, which can elevate hematocrit by reducing plasma volume rather than increasing RBC mass. However, the patient lacks typical signs of dehydration such as altered mental status, poor skin turgor, or orthostatic hypotension.\n(Choice B)\nHigh altitude exposure\nChronic exposure to high altitude (>2500m) stimulates erythropoietin production due to reduced atmospheric oxygen, leading to secondary polycythemia. This patient has no history of high altitude residence or recent travel to mountainous regions.\n(Choice C)\nRenal artery stenosis\nRenal artery stenosis can cause increased erythropoietin production via renal hypoxia, but this condition is rare and remains unsupported by the patient's particulars.\n(Choice D)\nCarbon monoxide exposure\nCarbon monoxide exposure causes carboxyhemoglobin formation, which reduces oxygen-carrying capacity but does not cause polycythemia or elevated hematocrit. CO poisoning typically presents with normal hematocrit levels. The symptoms described could be from CO exposure, but this would not explain the elevated hematocrit.\n(Choice E)\nChronic obstructive pulmonary disease\nWhile COPD can induce compensatory polycythemia due to chronic hypoxia, this is highly unlikely as the patient shows no respiratory symptoms typically associated with COPD.","likely":"D.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":3,"sceneSize":8,"globalIndex":35,"id":"3271","sceneScore":12,"question":"A 28-year-old woman with a history of HIV infection is on dapsone for Pneumocystis jirovecii pneumonia prophylaxis. She presents to the emergency department with sudden-onset headache, dizziness, and shortness of breath after taking her medication. Her skin appears bluish-gray, but she is not in respiratory distress. Vital signs show a pulse oximetry reading of 86% on room air. An arterial blood gas analysis is shown below. Lung examination is normal, and chest X-ray is shown below. Which of the following best explains the discrepancy between the pulse oximetry and arterial blood gas oxygen saturation readings?\n\n\n\npH\t7.42\t(range: 7.35–7.45)\nPaCO2\t36 mm Hg\t(range: 35–45 mm Hg)\nPaO2\t98 mm Hg\t(range: 80–100 mm Hg)\nSaO2\t99 %\t(range: 95–100 %)\nHCO3\t23 mmol/L\t(range: 22–28 mmol/L)\nBase Excess\t0 mmol/L\t(range: −2 to +2 mmol/L)","answers":[{"label":"A","text":"Altered state of hemoglobin\n(91.78%)"},{"label":"B","text":"Pulmonary edema\n(4.11%)"},{"label":"C","text":"Diaphragmatic paralysis\n(1.37%)"},{"label":"D","text":"Pneumonia\n(1.37%)"},{"label":"E","text":"Atelectasis\n(1.37%)"}],"explanation":"Explanation\nThe patient exhibits hypoxia on pulse oximetry with a significant oxygen saturation gap compared to arterial blood gas analysis, suggestive of acquired methemoglobinemia induced by dapsone. Methemoglobinemia causes oxidation of hemoglobin iron, impairing oxygen binding and leading to a characteristic pulse oximetry reading around 85% despite normal PaO2. Other conditions like anaphylaxis, atelectasis, pulmonary edema, diaphragmatic paralysis, hepatopulmonary syndrome, pneumonia, or carbon monoxide poisoning do not typically produce this specific saturation gap or match the clinical presentation.\n(Choice A)\nAltered state of hemoglobin\nDapsone can cause acquired methemoglobinemia by oxidizing the iron in hemoglobin from ferrous to ferric state, preventing effective oxygen binding and transport. This leads to cyanosis, a pulse oximetry reading around 85%, and a large saturation gap with normal PaO2 on ABG, as seen in this patient.\n(Choice B)\nPulmonary edema\nPulmonary edema causes true hypoxemia through impaired alveolar gas exchange, presenting with crackles on examination, pulmonary vascular congestion on chest X-ray, and decreased PaO2 on ABG. This would not produce the characteristic saturation gap seen in methemoglobinemia.\n(Choice C)\nDiaphragmatic paralysis\nDiaphragmatic paralysis causes hypoventilation leading to hypercapnia (elevated PaCO2) and hypoxemia (low PaO2) on ABG. This patient has normal ABG values with a saturation gap, which is characteristic of methemoglobinemia, not respiratory failure from diaphragmatic dysfunction.\n(Choice D)\nPneumonia\nPneumonia causes hypoxemia through consolidation and ventilation-perfusion mismatch, presenting with fever, productive cough, abnormal lung sounds, infiltrates on chest X-ray, and decreased PaO2 on ABG. The normal chest X-ray and ABG findings with isolated low pulse oximetry point to methemoglobinemia instead.\n(Choice E)\nAtelectasis\nAtelectasis causes true hypoxemia through ventilation-perfusion mismatch, which would result in decreased PaO2 on ABG and visible changes on chest X-ray. This condition would not explain the saturation gap where pulse oximetry reads low (85%) while ABG oxygen saturation remains normal (99%).","likely":"A.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":4,"sceneSize":8,"globalIndex":36,"id":"4206","sceneScore":12,"question":"A 35-year-old man is brought to the emergency department after being found unresponsive in a tent while camping. His friends report that they were using a portable propane stove inside the tent for warmth during a cold night. On arrival, he is confused, has a severe headache, nausea, and cherry-red skin coloration. Vital signs show tachycardia and normal blood pressure. Arterial blood gas Laboratory results are shown below . Which of the following is the most appropriate initial management?\n\n\n\nWhite Blood Cell Count\t7.9 x10³/µL\nNeutrophils\t60%\nLymphocytes\t30%\nMonocytes\t6%\nEosinophils\t3%\nBasophils\t1%\nRed Blood Cell Count\t4.6 x10^6/µL\nHemoglobin\t14.0 g/dL\nHematocrit\t42%\nMean Corpuscular Volume (MCV)\t91 fL\nMean Corpuscular Hemoglobin (MCH)\t30 pg\nMean Corpuscular Hemoglobin Concentration (MCHC)\t33 g/dL\nRed Cell Distribution Width (RDW)\t13%\nPlatelet Count\t275 x10³/µL\nMPV\t9.5 fL\nArterial PaO2\t95 mmHg\nCarboxyhemoglobin\t18%\t(range < 5–10%)","answers":[{"label":"A","text":"Give intravenous naloxone\n(0%)"},{"label":"B","text":"Administer intravenous methylene blue\n(7.78%)"},{"label":"C","text":"Administer 100% oxygen via nonrebreather facemask\n(67.78%)"},{"label":"D","text":"Initiate hyperbaric oxygen therapy immediately\n(20%)"},{"label":"E","text":"Perform endotracheal intubation and mechanical ventilation\n(4.44%)"}],"explanation":"Explanation\nThe patient presents with classic carbon monoxide poisoning from propane stove use in an enclosed tent. Key findings include carboxyhemoglobin level of 18%, cherry-red skin, neurologic symptoms (confusion, headache), and nausea. The initial treatment is 100% oxygen via nonrebreather facemask, which reduces the half-life of carboxyhemoglobin from 4-6 hours on room air to approximately 1 hour.\n(Choice A)\nGive intravenous naloxone\nNaloxone is for opioid overdose, which does not fit this clinical scenario of CO exposure.\n(Choice B)\nAdminister intravenous methylene blue\nMethylene blue is the antidote for methemoglobinemia, not carbon monoxide poisoning. While both conditions can cause altered oxygen-carrying capacity, they have different mechanisms: CO binds to hemoglobin with high affinity, while methemoglobinemia involves oxidized iron in hemoglobin that cannot carry oxygen.\n(Choice C)\nAdminister 100% oxygen via nonrebreather facemask\nThis is the correct initial management for carbon monoxide poisoning, as it displaces CO from hemoglobin and shortens its half-life from about 4 hours on room air to 1 hour on 100% oxygen.\n(Choice D)\nInitiate hyperbaric oxygen therapy immediately\nHyperbaric oxygen therapy is indicated for severe CO poisoning (carboxyhemoglobin >25%, neurologic symptoms, cardiovascular compromise, or pregnancy) but is not first-line treatment. Initial management should always begin with 100% normobaric oxygen, and hyperbaric therapy can be considered after stabilization if indicated.\n(Choice E)\nPerform endotracheal intubation and mechanical ventilation\nEndotracheal intubation and mechanical ventilation are not indicated unless the patient has respiratory failure, cannot protect their airway, or requires hyperbaric oxygen therapy. This patient has adequate oxygenation (PaO2 95 mmHg) and can be managed with high-flow oxygen via nonrebreather mask.","likely":"C.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":5,"sceneSize":8,"globalIndex":37,"id":"4229","sceneScore":12,"question":"A 28-year-old female artist presents to the emergency department with sudden onset of cyanosis, shortness of breath, and headache after accidentally ingesting a small amount of aniline-based dye while working on a textile project. She appears anxious and tachypneic, with oxygen saturation of 85% on room air that does not improve significantly with supplemental oxygen. Arterial blood drawn for gas analysis appears chocolate-brown in color. Laboratory results are shown below . What is the most appropriate initial pharmacologic treatment for this patient's condition?\n\n\n\nWhite Blood Cell Count\t8.9 x10^3/µL\nNeutrophils\t62%\nLymphocytes\t28%\nMonocytes\t6%\nEosinophils\t3%\nBasophils\t1%\nRed Blood Cell Count\t4.6 x10^6/µL\nHemoglobin\t14.2 g/dL\nHematocrit\t42%\nMean Corpuscular Volume (MCV)\t91 fL\nMean Corpuscular Hemoglobin (MCH)\t31 pg\nMean Corpuscular Hemoglobin Concentration (MCHC)\t34 g/dL\nRed Cell Distribution Width (RDW)\t13.6%\nPlatelet Count\t265 x10^3/µL\nMPV\t9.5 fL\nMethemoglobin\t35%\t(Normal: < 1% of total hemoglobin)","answers":[{"label":"A","text":"Exchange transfusion\n(0%)"},{"label":"B","text":"Methylene blue\n(96.83%)"},{"label":"C","text":"N-acetylcysteine\n(0%)"},{"label":"D","text":"High-flow oxygen\n(0%)"},{"label":"E","text":"Ascorbic acid\n(3.17%)"}],"explanation":"Explanation\nThe patient has acquired methemoglobinemia from aniline dye ingestion, evident from the chocolate-brown blood color and elevated methemoglobin level (35%). Methylene blue is the first-line antidote, acting as an electron acceptor in the NADPH-methemoglobin reductase pathway to reduce methemoglobin back to functional hemoglobin. Ascorbic acid may be used as an alternative when methylene blue is contraindicated (such as in G6PD deficiency) or unavailable, though it works more slowly.\n(Choice A)\nExchange transfusion\nExchange transfusion is a last-resort option for very severe methemoglobinemia unresponsive to methylene blue, not the initial treatment.\n(Choice B)\nMethylene blue\nMethylene blue is the first-line antidote for symptomatic methemoglobinemia, acting as an electron acceptor to reduce methemoglobin back to hemoglobin.\n(Choice C)\nN-acetylcysteine\nN-acetylcysteine is used for acetaminophen overdose but has no role in treating methemoglobinemia.\n(Choice D)\nHigh-flow oxygen\nHigh-flow oxygen is supportive but does not address the underlying problem. In methemoglobinemia, hemoglobin is oxidized to methemoglobin which cannot carry oxygen effectively, so supplemental oxygen alone cannot correct the impaired oxygen delivery.\n(Choice E)\nAscorbic acid\nAscorbic acid (vitamin C) can slowly reduce methemoglobin to hemoglobin but works much more slowly than methylene blue. It is typically reserved for cases where methylene blue is contraindicated (such as in G6PD deficiency) or unavailable.","likely":"B.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":6,"sceneSize":8,"globalIndex":38,"id":"5567","sceneScore":10,"question":"A 32-year-old woman presents to her primary care physician with a four-month history of fatigue, exertional dyspnea, difficulty concentrating, and cold intolerance. She has regular menstrual cycles lasting six to seven days with heavy flow requiring pad changes every two hours on her heaviest days. She has been a lacto-vegetarian for eight years, eating dairy but no meat, poultry, or seafood. She takes no supplements. On examination, she appears pale with koilonychia and angular cheilitis. Her heart rate is 96/min and she has a soft systolic flow murmur. Laboratory studies show hemoglobin 8.6 g/dL, MCV 69 fL, serum iron 22 mcg/dL, TIBC 498 mcg/dL, transferrin saturation 4%, ferritin 4 ng/mL, and TSH 1.8 mIU/L. Which of the following best explains why premenopausal women have substantially higher iron requirements than men of the same age, and what dietary strategies would best address this patient's deficiency?","answers":[{"label":"A","text":"Vegetarian diets cannot provide adequate bioavailable iron for premenopausal women and require lifelong parenteral iron replacement therapy in all cases\n(0%)"},{"label":"B","text":"Premenopausal women require more iron than men due to estrogen-mediated enhancement of erythropoiesis, which increases iron turnover for red blood cell production independent of menstrual losses\n(0%)"},{"label":"C","text":"The elevated TIBC reflects hepatic synthesis of acute-phase reactants due to underlying inflammatory iron sequestration, contraindicating iron supplementation until inflammation resolves\n(0%)"},{"label":"D","text":"Premenopausal women require 18 mg iron daily due to mandatory menstrual losses averaging 0.5–1.0 mg/day, compounded in this patient by heavy menstrual bleeding and exclusive reliance on poorly bioavailable non-heme iron from a vegetarian diet; treatment includes oral iron supplementation and dietary optimization with vitamin C to enhance non-heme iron absorption\n(100%)"},{"label":"E","text":"Cold intolerance in this patient reflects hypothyroidism as the primary diagnosis, and TSH should be rechecked before attributing her symptoms to iron deficiency\n(0%)"}],"explanation":"Explanation\nPremenopausal women require 18 mg of iron daily compared to 8 mg for adult men, reflecting mandatory menstrual iron losses of approximately 0.5–1.0 mg/day on average (significantly more with heavy menstrual bleeding). Vegetarian diets provide only non-heme iron with substantially lower bioavailability than heme iron. Combining iron supplementation with vitamin C-rich foods and separating from calcium and tea optimizes absorption.\n(Choice A)\nVegetarian diets cannot provide adequate bioavailable iron for premenopausal women and require lifelong parenteral iron replacement therapy in all cases\nWell-planned vegetarian diets can provide adequate iron, though they require intentional dietary strategies to maximize non-heme iron absorption. The Dietary Reference Intake for vegetarians is 1.8 times higher than for omnivores (32 mg/day for vegetarian premenopausal women) to account for lower non-heme iron bioavailability. With careful dietary planning — including vitamin C with iron-rich meals, avoidance of absorption inhibitors, and consumption of iron-fortified foods — vegetarian women can maintain adequate iron status. Oral iron supplementation is appropriate for this patient given established severe deficiency, but parenteral iron is reserved for patients who cannot tolerate or absorb oral iron.\n(Choice B)\nPremenopausal women require more iron than men due to estrogen-mediated enhancement of erythropoiesis, which increases iron turnover for red blood cell production independent of menstrual losses\nWhile estrogen has modest effects on erythropoiesis, the primary reason premenopausal women require substantially more dietary iron than men (18 mg versus 8 mg daily) is obligatory menstrual iron losses, not hormonal stimulation of red cell production. Testosterone is actually the more potent erythropoietic stimulus, explaining why men typically have higher baseline hemoglobin levels than premenopausal women. The dramatic difference in iron requirements is almost entirely attributable to menstrual blood loss, which is why postmenopausal women return to the same 8 mg daily requirement as age-matched men.\n(Choice C)\nThe elevated TIBC reflects hepatic synthesis of acute-phase reactants due to underlying inflammatory iron sequestration, contraindicating iron supplementation until inflammation resolves\nElevated TIBC is a marker of iron deficiency, not iron overload or hepatic inflammation. When iron stores are depleted, the liver increases transferrin productio","likely":"D.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":7,"sceneSize":8,"globalIndex":39,"id":"5659","sceneScore":10,"question":"A 3-year-old girl is brought to the emergency department by her parents approximately 45 minutes after they found her playing next to an open bottle of adult multivitamins. They estimate she ingested 20–30 tablets. Each tablet contains 18 mg of elemental iron (as ferrous sulfate). She initially vomited twice at home. In the ED, she appears pale and anxious; temperature 37.2°C, heart rate 138 bpm, blood pressure 88/54 mmHg, respiratory rate 26/min. Abdominal examination reveals diffuse tenderness. Hemoccult testing of her stool is positive. Her serum iron level drawn 2 hours post-ingestion is 420 mcg/dL (normal 50–120), and her anion gap is 20 mEq/L with a serum bicarbonate of 14 mEq/L. Which of the following best describes the initial pathophysiology underlying this child's clinical presentation, and what is the most appropriate next step in management?","answers":[{"label":"A","text":"Hepatic phase iron toxicity causing fulminant liver failure; emergent liver transplantation evaluation\n(0%)"},{"label":"B","text":"Methemoglobin formation from iron oxidation causing tissue hypoxia; administer intravenous methylene blue\n(0%)"},{"label":"C","text":"Osmotic diarrhea from iron-induced intestinal malabsorption; administer oral activated charcoal to prevent further absorption\n(0%)"},{"label":"D","text":"Inhibition of vitamin K-dependent clotting factors causing gastrointestinal hemorrhage; administer intravenous fresh frozen plasma\n(0%)"},{"label":"E","text":"Direct corrosive GI mucosal injury and free radical generation causing hemorrhagic gastroenteritis and high anion gap metabolic acidosis; initiate IV fluid resuscitation and administer intravenous deferoxamine\n(100%)"}],"explanation":"Explanation\nAcute iron toxicity causes direct corrosive injury to the gastrointestinal mucosa manifesting as hemorrhagic gastroenteritis, followed by systemic toxicity from free iron catalyzing free radical generation and mitochondrial dysfunction, resulting in metabolic acidosis and multiorgan failure. A serum iron level above 350–500 mcg/dL with systemic signs is an indication for chelation therapy with intravenous deferoxamine. Immediate stabilization with IV fluids and prompt chelation are the cornerstones of management in severe pediatric iron poisoning.\n(Choice A)\nHepatic phase iron toxicity causing fulminant liver failure; emergent liver transplantation evaluation\nHepatotoxicity is a recognized late complication of iron poisoning, typically occurring 18–48 hours post-ingestion during the third phase of iron toxicity, often following an apparent clinical improvement period. This child presents only 45 minutes post-ingestion with early-phase gastrointestinal and hemodynamic toxicity from direct corrosive injury and free radical generation. The immediate priorities are hemodynamic stabilization and chelation therapy to prevent progression to hepatic failure, not liver transplantation evaluation.\n(Choice B)\nMethemoglobin formation from iron oxidation causing tissue hypoxia; administer intravenous methylene blue\nMethemoglobinemia is caused by agents that oxidize hemoglobin iron from the ferrous (Fe2+) to the ferric (Fe3+) state, such as dapsone, nitrates, and benzocaine — not by ingested elemental iron. Methylene blue is the antidote for symptomatic methemoglobinemia and has no role in acute iron poisoning. This patient's pallor and tachycardia are attributable to hemorrhagic volume loss and early cardiovascular toxicity, not methemoglobinemia.\n(Choice C)\nOsmotic diarrhea from iron-induced intestinal malabsorption; administer oral activated charcoal to prevent further absorption\nActivated charcoal does not effectively bind iron and is contraindicated in iron poisoning. The mechanism of GI toxicity in iron overdose is direct corrosive mucosal injury and free radical generation, not osmotic diarrhea from malabsorption. Additionally, activated charcoal may obscure visualization during endoscopy if emergent evaluation becomes necessary and provides no meaningful reduction in iron absorption.\n(Choice D)\nInhibition of vitamin K-dependent clotting factors causing gastrointestinal hemorrhage; administer intravenous fresh frozen plasma\nIron does not inhibit vitam","likely":"E.","hasReveal":true},{"sceneId":5,"sceneBeat":"resolution","sceneTitle":"Blood too thin to carry","sceneHook":"Anemia vs hypoxia causes of dyspnea: when oxygen will not fix the story","indexInScene":8,"sceneSize":8,"globalIndex":40,"id":"6242","sceneScore":10,"question":"A 58-year-old homeless man is brought to the emergency department by a shelter worker who noticed he was limping and had unusual skin changes. He reports pain and swelling in both knees for the past 3 weeks and says his gums bleed every time he tries to eat. He has a history of alcohol use disorder and has been surviving primarily on bread and canned soup for the past several months. On examination, temperature is 37.1°C, blood pressure is 118/74 mmHg, pulse is 88/min. His gingiva are swollen and hemorrhagic around the teeth. Both knees have moderate effusions. Skin examination of the lower extremities reveals numerous perifollicular hemorrhages and tightly coiled, fragmented hairs. Laboratory studies show: hemoglobin 10.2 g/dL, MCV 78 fL, platelets 224,000/µL, PT 12.1 sec (INR 1.0), aPTT 29 sec, BMP within normal limits. Which of the following best explains the pathophysiology of the musculoskeletal and skin findings in this patient?","answers":[{"label":"A","text":"Von Willebrand factor deficiency impairing primary hemostasis at sites of vascular injury\n(0%)"},{"label":"B","text":"Impaired platelet aggregation due to zinc deficiency affecting thromboxane A2 synthesis\n(0%)"},{"label":"C","text":"Deficiency of vitamin K leading to impaired synthesis of clotting factors II, VII, IX, and X\n(33.33%)"},{"label":"D","text":"Deficient hydroxylation of proline and lysine residues in collagen precursors due to lack of vitamin C\n(66.67%)"},{"label":"E","text":"Platelet dysfunction caused by chronic alcohol-induced bone marrow suppression leading to impaired hemostasis\n(0%)"}],"explanation":"Explanation\nScurvy results from vitamin C deficiency causing impaired hydroxylation of proline and lysine residues, which are essential for collagen cross-linking and stabilization. This leads to the classic triad of perifollicular hemorrhages with corkscrew hairs, gingival swelling and bleeding, and hemarthrosis. Coagulation studies (PT, aPTT, platelets) are characteristically normal, distinguishing scurvy from primary bleeding disorders.\n(Choice A)\nVon Willebrand factor deficiency impairing primary hemostasis at sites of vascular injury\nVon Willebrand disease causes mucocutaneous bleeding such as epistaxis, gingival bleeding, and menorrhagia, and can cause hemarthrosis in severe (type 3) disease, but it does not produce the characteristic dermatologic findings of perifollicular hemorrhages and corkscrew hairs. Von Willebrand disease is a congenital or acquired disorder unrelated to nutritional status, and the dietary history and clinical constellation here strongly favor a nutritional etiology.\n(Choice B)\nImpaired platelet aggregation due to zinc deficiency affecting thromboxane A2 synthesis\nZinc deficiency affects immune function, wound healing, and taste/smell, but does not specifically impair thromboxane A2 synthesis or cause the characteristic skin and joint findings seen here. Thromboxane A2 is derived from arachidonic acid via cyclooxygenase, a pathway not dependent on zinc. The clinical picture of corkscrew hairs, perifollicular hemorrhages, gingival disease, and hemarthrosis with normal coagulation studies is diagnostic of scurvy, not zinc deficiency.\n(Choice C)\nDeficiency of vitamin K leading to impaired synthesis of clotting factors II, VII, IX, and X\nVitamin K deficiency causes coagulopathy with prolonged PT (and later aPTT) due to impaired gamma-carboxylation of vitamin K-dependent clotting factors (II, VII, IX, X). This patient's normal PT and aPTT exclude vitamin K deficiency. Additionally, vitamin K deficiency does not cause the pathognomonic skin findings of scurvy: perifollicular hemorrhages and corkscrew hairs, which result from defective collagen synthesis rather than coagulopathy.\n(Choice D)\nDeficient hydroxylation of proline and lysine residues in collagen precursors due to lack of vitamin C\nVitamin C (ascorbic acid) is an essential cofactor for prolyl hydroxylase and lysyl hydroxylase, the enzymes responsible for hydroxylating proline and lysine residues during collagen biosynthesis. Without these hydroxylations, collagen triple hel","likely":"D.","hasReveal":true}];

let si = 0;       // current scene index, 0-4
let openIdx = null; // which question (1-8) is currently expanded, if any

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function cardHTML(q) {
  const ans = (q.answers || []).map(a =>
    '<li><strong>' + esc(a.label) + '.</strong> ' + esc(a.text) + '</li>'
  ).join('');
  return `
    <div class="card">
      <div class="meta">
        <span>QID <strong>${esc(q.id)}</strong></span>
        <span>Scene Q <strong>${q.indexInScene}/${q.sceneSize}</strong></span>
        <span>Global <strong>${q.globalIndex}/${ITEMS.length}</strong></span>
        <span>${q.hasReveal ? 'Reveal ✓' : 'No reveal'}</span>
      </div>
      <div class="stem">${esc(q.question)}</div>
      <ul class="answers">${ans}</ul>
      ${q.likely ? '<div class="likely">Likely correct (this scrape): ' + esc(q.likely) + '</div>' : ''}
      <details class="explain"><summary>Explanation / reveal text</summary>
        <pre>${esc(q.explanation || '(none captured)')}</pre>
      </details>
    </div>`;
}

function chipify(html) {
  return html.replace(/\[\[(\d)\]\]/g, (m, n) =>
    `<button class="chip" data-idx="${n}" type="button">${n}</button>`);
}

function render() {
  const el = document.getElementById('app');
  if (!SCENES.length || !SCENES[si] || !SCENES[si].length) {
    el.innerHTML = '<p class="empty">No matching questions found for this spine.</p>';
    return;
  }
  const scene = SCENES[si];
  const first = scene[0];
  const steps = STORY_STEPS[first.sceneId] || [];
  const storyHTML = steps.map(s =>
    s.stage
      ? `<div class="story-beat"><span class="stage-tag">${esc(s.stage)}</span><p>${chipify(s.text)}</p></div>`
      : `<div class="story-beat"><p>${chipify(s.text)}</p></div>`
  ).join('');

  el.innerHTML = `
    <div class="scene-bar">
      <div class="beat">Scene ${first.sceneId}/5 · ${esc(first.sceneBeat)}</div>
      <h2>${esc(first.sceneTitle)}</h2>
      <p class="hook">${esc(first.sceneHook)}</p>
    </div>
    <span class="placeholder-tag">Placeholder avatar &amp; prose, v2 Harmon Circle — not locked content</span>
    <div class="story">${storyHTML || '<p>(story not yet written for this scene)</p>'}</div>
    <div id="qzone"></div>`;

  el.querySelectorAll('.chip').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx, 10);
      openIdx = (openIdx === idx) ? null : idx;
      paintChips();
      paintQZone();
    };
  });
  paintChips();
  paintQZone();

  document.getElementById('progress').textContent = 'Scene ' + (si + 1) + ' / ' + SCENES.length;
  document.getElementById('prev').disabled = si === 0;
  document.getElementById('next').disabled = si >= SCENES.length - 1;
  document.getElementById('next').textContent = si >= SCENES.length - 1 ? 'Done' : 'Next scene →';
}

function paintChips() {
  document.querySelectorAll('.chip').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.idx, 10) === openIdx);
  });
}

function paintQZone() {
  const zone = document.getElementById('qzone');
  if (!zone) return;
  if (openIdx == null) { zone.innerHTML = ''; return; }
  const q = SCENES[si].find(q => q.indexInScene === openIdx);
  zone.innerHTML = q ? cardHTML(q) : '';
}

document.getElementById('prev').onclick = () => {
  if (si > 0) { si--; openIdx = null; render(); window.scrollTo(0,0); }
};
document.getElementById('next').onclick = () => {
  if (si < SCENES.length - 1) { si++; openIdx = null; render(); window.scrollTo(0,0); }
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'n') document.getElementById('next').click();
  if (e.key === 'ArrowLeft' || e.key === 'p') document.getElementById('prev').click();
});
render();
</script>
