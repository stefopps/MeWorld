<script>
const ITEMS = [{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":1,"sceneSize":8,"globalIndex":1,"id":"2016","sceneScore":18,"question":"A 68-year-old woman with a history of long-standing hypertension and type 2 diabetes mellitus presents to the clinic with a 3-month history of worsening exertional dyspnea, orthopnea, and bilateral leg swelling. She denies chest pain, cough, or hemoptysis. Physical examination reveals elevated jugular venous pressure, bibasilar crackles, and 2+ pitting edema in the lower extremities. An echocardiogram demonstrates a left ventricular ejection fraction of 35%, moderate mitral regurgitation, and an estimated pulmonary artery systolic pressure of 55 mmHg. Right ventricular size and function are normal, and there is no evidence of intracardiac shunt or valvular stenosis. A chest radiograph and lab values shown below. What is the most appropriate initial management for this patient's pulmonary hypertension?\n\n\n\nGlucose\t100\tmg/dL\nCalcium\t9.5\tmg/dL\nSodium\t140\tmmol/L\nPotassium\t4.0\tmmol/L\nChloride\t100\tmmol/L\nCarbon Dioxide (CO2)\t25\tmmol/L\nBlood Urea Nitrogen (BUN)\t15\tmg/dL\nCreatinine\t1.0\tmg/dL\nTotal Protein\t7.0\tg/dL\nAlbumin\t4.5\tg/dL\nTotal Bilirubin\t0.5\tmg/dL\nAlkaline Phosphatase (ALP)\t50\tU/L\nAspartate Aminotransferase (AST)\t20\tU/L\nAlanine Aminotransferase (ALT)\t25\tU/L\nBrain natriuretic peptide\t450\tpg/mL","answers":[{"label":"A","text":"Supplemental oxygen\n(10.98%)"},{"label":"B","text":"Inhaled bronchodilators\n(0%)"},{"label":"C","text":"Warfarin anticoagulation\n(0%)"},{"label":"D","text":"Endothelin receptor antagonist\n(18.29%)"},{"label":"E","text":"Diuretic and ACE inhibitor\n(70.73%)"}],"explanation":"Explanation\nThis patient presents with Group 2 pulmonary hypertension (PH-LHD) secondary to heart failure with reduced ejection fraction (HFrEF). The elevated PA systolic pressure (55 mmHg) is due to increased left-sided filling pressures from systolic dysfunction. Initial management should target the underlying left heart disease with evidence-based HFrEF therapy: diuretics for volume overload and ACE inhibitors for afterload reduction and ventricular remodeling. Pulmonary arterial hypertension-specific therapies (sildenafil, endothelin receptor antagonists) are contraindicated in Group 2 PH as they may worsen pulmonary edema by increasing preload without addressing the fundamental problem of elevated left-sided pressures.\n(Choice A)\nSupplemental oxygen\nSupplemental oxygen is indicated for hypoxemic patients with pulmonary hypertension to maintain oxygen saturation >90%. However, this patient shows no evidence of hypoxemia, underlying lung disease, or right heart strain, making oxygen therapy unnecessary.\n(Choice B)\nInhaled bronchodilators\nBronchodilators are used for obstructive lung diseases like COPD, which is not present here; the pulmonary hypertension is cardiac in origin.\n(Choice C)\nWarfarin anticoagulation\nAnticoagulation is recommended for chronic thromboembolic pulmonary hypertension (Group 4), but there is no evidence of thromboembolic disease in this patient.\n(Choice D)\nEndothelin receptor antagonist\nEndothelin receptor antagonists like bosentan are specific for primary pulmonary arterial hypertension and are contraindicated in Group 2 pulmonary hypertension due to potential fluid retention and worsening heart failure.\n(Choice E)\nDiuretic and ACE inhibitor\nThis is the correct initial management, as it addresses volume overload and afterload reduction in heart failure with reduced ejection fraction, which is the underlying cause of the secondary pulmonary hypertension.","likely":"E.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":2,"sceneSize":8,"globalIndex":2,"id":"3029","sceneScore":15,"question":"A 52-year-old woman with a history of chronic pancreatitis secondary to long-term alcohol abuse presents to the emergency department with a 2-week history of progressive shortness of breath, nonproductive cough, and left-sided chest pain. She denies fever, hemoptysis, or recent trauma. Physical examination reveals decreased breath sounds and dullness to percussion over the left lung base. A chest X-ray and thoracentesis values are shown below. What is the most likely cause of this patient's pleural effusion?\n\n\n\nPleural Fluid Appearance\tSerous\nPleural Fluid pH\t7.4\nPleural Fluid Protein\t4.2 g/dL\nSerum Protein\t6.5 g/dL\nPleural Fluid LDH\t450 U/L\nSerum LDH\t200 U/L\nPleural Fluid Amylase\t12000 U/L\nSerum Amylase\t150 U/L","answers":[{"label":"A","text":"Esophageal perforation\n(0%)"},{"label":"B","text":"Pancreaticopleural fistula\n(94.74%)"},{"label":"C","text":"Congestive heart failure\n(5.26%)"},{"label":"D","text":"Pulmonary embolism\n(0%)"},{"label":"E","text":"Lung adenocarcinoma\n(0%)"}],"explanation":"Explanation\nThis patient has an amylase-rich, exudative pleural effusion in the context of chronic pancreatitis. The extremely high pleural fluid amylase level (12,000 U/L vs serum 150 U/L), meeting Light's criteria for exudative effusion (protein ratio 0.65, LDH ratio 2.25), and her history of chronic pancreatitis point to a pancreaticopleural fistula. In this condition, pancreatic secretions leak into the pleural space through disrupted pancreatic ducts, typically causing left-sided effusions. The normal pH (7.4) is consistent with sterile pancreatic fluid. Clinical presentation includes progressive dyspnea, cough, and chest pain.\n(Choice A)\nEsophageal perforation\nEsophageal perforation can cause pleural effusion with elevated amylase from salivary origin, but typically presents with severe chest pain, dysphagia, and subcutaneous emphysema. The pleural fluid pH would be much lower (<7.0) due to bacterial contamination and food particles, unlike the pH of 7.4 seen here.\n(Choice B)\nPancreaticopleural fistula\nThis is the correct diagnosis. In chronic pancreatitis, a fistula can form between the pancreas and pleural space, leading to an exudative effusion with markedly elevated amylase levels.\n(Choice C)\nCongestive heart failure\nCHF causes transudative effusions with low protein (<3.0 g/dL) and LDH ratios. This patient has an exudative effusion (protein ratio >0.5, LDH ratio >0.6) with markedly elevated amylase levels, which are inconsistent with heart failure.\n(Choice D)\nPulmonary embolism\nPulmonary embolism can cause pleural effusions that are typically small, bloody, or exudative, but amylase levels remain normal or only mildly elevated. This patient lacks typical PE risk factors (immobilization, malignancy, surgery) and the extremely high amylase level (>12,000 U/L) is not consistent with PE.\n(Choice E)\nLung adenocarcinoma\nMalignant pleural effusions are typically exudative but rarely have amylase levels this markedly elevated unless there is direct pancreatic involvement or metastases. The patient's history of chronic pancreatitis and extremely high pleural fluid amylase (>12,000 U/L) make pancreatic origin much more likely than primary lung adenocarcinoma.","likely":"B.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":3,"sceneSize":8,"globalIndex":3,"id":"1925","sceneScore":15,"question":"A 65-year-old man with a history of chronic obstructive pulmonary disease (COPD) presents with worsening dyspnea and fatigue over the past two weeks. He reports no recent exacerbations of COPD and has been compliant with his inhaled medications. Physical examination shows prolonged expiratory phase and decreased breath sounds bilaterally, but no adventitious sounds, normal jugular venous pressure, regular heart rhythm without extra sounds, and no peripheral edema. A chest x-ray shows hyperinflation but no infiltrates or effusion. Which of the following is the most sensitive finding for diagnosing concomitant congestive heart failure in this patient?","answers":[{"label":"A","text":"Third heart sound\n(24.39%)"},{"label":"B","text":"Positive hepatojugular reflux\n(17.07%)"},{"label":"C","text":"Elevated jugular venous pressure\n(4.88%)"},{"label":"D","text":"Elevated plasma brain natriuretic peptide level\n(50%)"},{"label":"E","text":"Laterally displaced apical impulse\n(3.66%)"}],"explanation":"Explanation\nBrain natriuretic peptide (BNP) and NT-proBNP have high sensitivity (>90%) for heart failure diagnosis, making them excellent screening tools to rule out the condition when levels are normal. In contrast, physical examination findings (bilateral crackles, elevated JVP, peripheral edema, S3 gallop, hepatojugular reflux, and displaced apical impulse) have high specificity but low sensitivity (typically 10-30%), meaning they are useful for confirming heart failure when present but cannot reliably exclude it when absent.\n(Choice A)\nThird heart sound\nA third heart sound (S3 gallop) is highly specific for heart failure when present but has low sensitivity (approximately 15-25%), particularly in patients with preserved ejection fraction or early disease. It requires significant ventricular dysfunction to be audible.\n(Choice B)\nPositive hepatojugular reflux\nPositive hepatojugular reflux (abdominojugular reflux) has moderate specificity but low sensitivity for heart failure. This maneuver may be negative in patients with early heart failure or those with adequate preload reduction from medications.\n(Choice C)\nElevated jugular venous pressure\nElevated jugular venous pressure has moderate specificity but low sensitivity (approximately 10-20%) for heart failure diagnosis. Many patients with early or well-compensated heart failure will have normal JVP, particularly when upright and compensated with medications.\n(Choice D)\nElevated plasma brain natriuretic peptide level\nElevated plasma brain natriuretic peptide levels have high sensitivity (>90%) for the diagnosis of congestive heart failure, making it the most sensitive indicator among the options for detecting the condition.\n(Choice E)\nLaterally displaced apical impulse\nA laterally displaced apical impulse indicates left ventricular enlargement and has high specificity for structural heart disease, but low sensitivity (approximately 20-30%) for heart failure diagnosis. It may be absent in heart failure with preserved ejection fraction or early disease.","likely":"D.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":4,"sceneSize":8,"globalIndex":4,"id":"1321","sceneScore":15,"question":"A 58-year-old African American female presents with persistent shortness of breath over several years, now worsening in severity. She admits to smoking one pack of cigarettes daily for the past 30 years. She finds it increasingly difficult to walk even short distances without resting. Her symptoms are aggravated at night, frequently waking her with fits of coughing and breathing difficulty, relieved somewhat by sitting up. The cough often brings up thick whitish sputum. She reports no fevers, chills, or chest pain. What is the most likely diagnosis?","answers":[{"label":"A","text":"Lung cancer\n(2.08%)"},{"label":"B","text":"Congestive heart failure\n(33.33%)"},{"label":"C","text":"Chronic bronchitis\n(63.19%)"},{"label":"D","text":"Pulmonary embolism\n(0%)"},{"label":"E","text":"Bronchial asthma\n(1.39%)"}],"explanation":"Explanation\nChronic bronchitis is diagnosed clinically by a productive cough for at least 3 months per year for 2 consecutive years in the absence of other causes. This COPD phenotype is strongly associated with smoking and presents with chronic mucus hypersecretion. Nocturnal symptoms occur due to mucus accumulation while supine, improved by upright positioning and expectoration. Pulmonary function tests showing airflow obstruction (FEV1/FVC < 0.70) would confirm COPD and assess severity.\n(Choice A)\nLung cancer\nWhile lung cancer is a significant risk in heavy smokers, it typically presents with constitutional symptoms (weight loss, fatigue), hemoptysis, or a new/changing cough pattern. The chronic stable pattern of productive cough over years is more consistent with chronic bronchitis than malignancy.\n(Choice B)\nCongestive heart failure\nHeart failure can cause orthopnea and paroxysmal nocturnal dyspnea, but typically presents with a dry cough or pink frothy sputum, not thick whitish sputum. The chronic productive cough in a long-term smoker points toward COPD rather than cardiac etiology.\n(Choice C)\nChronic bronchitis\nGiven the patient's long-term smoking habit and nightly dyspnea relieved by coughing up sputum, chronic bronchitis is the most plausible diagnosis. This condition is characterized by a chronic productive cough lasting at least three months annually over two consecutive years.\n(Choice D)\nPulmonary embolism\nA pulmonary embolism generally causes sudden onset of symptoms and is less likely to present with chronic productive cough, especially of whitish sputum.\n(Choice E)\nBronchial asthma\nWhile asthma can cause nocturnal dyspnea and cough, it typically presents with wheezing, variable symptoms, and non-productive cough. The chronic daily productive cough with thick sputum in a heavy smoker is characteristic of chronic bronchitis rather than asthma.","likely":"C.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":5,"sceneSize":8,"globalIndex":5,"id":"1593","sceneScore":15,"question":"A 72-year-old woman presents to the emergency department with worsening breathlessness over the past five days, along with a sharp chest pain that intensifies with deep breaths. She mentions having had flu-like symptoms a week ago. She has a history of chronic obstructive pulmonary disease (COPD), managed with inhalers. Her temperature is 38.5°C (101.3°F), blood pressure is 150/85 mm Hg, heart rate is 100 bpm, and respiratory rate is 28 breaths per minute. The auscultation of the lungs reveals diminished breath sounds on the left thoracic base. A chest CT scan is provided below.\n\nWhat is the most likely diagnosis for this patient considering her current symptoms?","answers":[{"label":"A","text":"Empyema\n(78.81%)"},{"label":"B","text":"Pleural effusion secondary to heart failure\n(7.28%)"},{"label":"C","text":"Pulmonary thromboembolism\n(9.93%)"},{"label":"D","text":"Tuberculosis pleuritis\n(0.66%)"},{"label":"E","text":"Bronchogenic carcinoma\n(3.31%)"}],"explanation":"Explanation\nThe clinical picture suggests empyema caused by bacterial superinfection following a viral respiratory illness. The combination of fever, pleuritic chest pain, diminished breath sounds, and pleural fluid collection on CT imaging is characteristic of empyema. Treatment requires both systemic antibiotics and pleural space drainage, often via chest tube or thoracentesis depending on fluid characteristics.\n(Choice A)\nEmpyema\nEmpyema refers to a collection of pus in the pleural space often following pneumonia. The pleuritic pain, fever, and restricted breath sounds suggest an empyema, likely with visible pleural opacity on imaging and loculated fluid.\n(Choice B)\nPleural effusion secondary to heart failure\nWhile pleural effusion can cause dyspnea, heart failure typically presents with bilateral effusions, lower extremity edema, and pulmonary vascular congestion on imaging. The acute febrile presentation and unilateral findings make this less likely.\n(Choice C)\nPulmonary thromboembolism\nPulmonary embolism can cause acute dyspnea and pleuritic chest pain, but fever is uncommon unless pulmonary infarction occurs. The CT findings of pleural fluid collection are not typical for uncomplicated PE.\n(Choice D)\nTuberculosis pleuritis\nTuberculous pleuritis can present similarly but typically follows a more indolent course with constitutional symptoms like night sweats, weight loss, and chronic cough. The acute presentation following flu-like illness favors bacterial empyema.\n(Choice E)\nBronchogenic carcinoma\nBronchogenic carcinoma can present with dyspnea and pleural effusion, but the acute onset with high fever and recent respiratory illness strongly suggests an infectious etiology rather than malignancy.","likely":"A.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":6,"sceneSize":8,"globalIndex":6,"id":"1525","sceneScore":15,"question":"A 28-year-old Hispanic female presents for evaluation after recent laboratory tests. She notes an intermittent dull backache that she manages with ibuprofen and mentions occasional stiffness in her hips upon waking. She is a non-smoker, consumes alcohol sporadically, and her erythrocyte sedimentation rate (ESR) is 52 mm/hr. Recent pulmonary function tests reveal:\n\nFEV1: 83% of predicted\nFEV1/FVC: 88%\nFRC: 115% of predicted\n\nBased on these pulmonary function test results and her symptoms, what is the most likely underlying condition?","answers":[{"label":"A","text":"Chronic bronchitis\n(0%)"},{"label":"B","text":"Sarcoidosis\n(10.53%)"},{"label":"C","text":"Ankylosing spondylitis causing chest wall restriction\n(88.72%)"},{"label":"D","text":"Heart failure with pulmonary edema\n(0%)"},{"label":"E","text":"Cystic fibrosis\n(0.75%)"}],"explanation":"Explanation\nGiven the patient's inflammatory back pain, hip stiffness, and elevated ESR in a young Hispanic female, ankylosing spondylitis is the most likely diagnosis. While the PFT findings don't clearly demonstrate a classic restrictive pattern (FEV1/FVC is normal at 88%), AS can affect chest wall mobility and respiratory function. The clinical presentation of axial symptoms with inflammatory markers supports this diagnosis.\n(Choice A)\nChronic bronchitis\nChronic bronchitis typically shows an obstructive pattern with FEV1/FVC <70%. The normal FEV1/FVC ratio (88%) rules out obstructive disease.\n(Choice B)\nSarcoidosis\nSarcoidosis typically causes a restrictive pattern with reduced lung volumes and normal or increased FEV1/FVC ratio. However, the normal FEV1/FVC (88%) and increased FRC don't clearly support restrictive disease.\n(Choice C)\nAnkylosing spondylitis causing chest wall restriction\nWhile AS can cause chest wall restriction, the PFT findings don't clearly demonstrate a restrictive pattern. The FEV1/FVC is normal (88%), and true restrictive disease typically shows reduced lung volumes, not just increased FRC.\n(Choice D)\nHeart failure with pulmonary edema\nHeart failure with pulmonary edema typically presents with dyspnea, orthopnea, and signs of fluid overload. The predominant back pain and hip stiffness with normal FEV1/FVC ratio are inconsistent with cardiac causes of pulmonary dysfunction.\n(Choice E)\nCystic fibrosis\nCystic fibrosis typically presents in childhood with chronic respiratory infections and shows an obstructive PFT pattern (FEV1/FVC <70%). The normal FEV1/FVC ratio (88%) and predominant musculoskeletal symptoms are inconsistent with CF.","likely":"C.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":7,"sceneSize":8,"globalIndex":7,"id":"2118","sceneScore":15,"question":"A 68-year-old man with a history of ischemic cardiomyopathy presents to the clinic with worsening fatigue and difficulty performing daily chores over the past six weeks. He reports needing to prop himself up with extra pillows at night to sleep comfortably but denies any cough or frothy sputum. Physical examination reveals an elevated jugular venous pressure of 12 cm H2O, clear lung fields on auscultation, and bilateral lower extremity pitting edema extending to the knees. Laboratory results and chest x-ray are shown below. What is the most likely diagnosis?\n\n\n\nWBC Count\t6800 /µL\nNeutrophils\t60 %\nLymphocytes\t30 %\nHemoglobin\t14.2 g/dL\nHematocrit\t42 %\nRBC Count\t4.8 million/µL\nPlatelet Count\t250000 /µL\nSodium\t140 mmol/L\nPotassium\t4.2 mmol/L\nChloride\t103 mmol/L\nBicarbonate (HCO3-)\t24 mmol/L\nBlood Urea Nitrogen\t14 mg/dL\nSerum Creatinine\t1.0 mg/dL\nGlucose\t95 mg/dL\nCalcium\t9.2 mg/dL\nMagnesium\t1.9 mg/dL\nAlbumin\t4.2 g/dL\nAST\t28 U/L\nALT\t30 U/L\nBNP\t480 pg/mL","answers":[{"label":"A","text":"Nephrotic syndrome\n(0%)"},{"label":"B","text":"Chronic obstructive pulmonary disease exacerbation\n(14.78%)"},{"label":"C","text":"Cirrhosis\n(0%)"},{"label":"D","text":"Acute pulmonary embolism\n(0%)"},{"label":"E","text":"Heart failure\n(85.22%)"}],"explanation":"Explanation\nThis patient with orthopnea and progressive fatigue has signs of volume overload (eg, elevated jugular venous pressure, peripheral edema) consistent with decompensated heart failure. The absence of pulmonary edema on imaging is common in slowly progressive decompensation due to enhanced lymphatic drainage.\n(Choice A)\nNephrotic syndrome\nNephrotic syndrome causes edema due to hypoalbuminemia and proteinuria. However, this patient has normal albumin (4.2 g/dL) and lacks the typical findings of hypoproteinemia. The elevated JVP and orthopnea point to cardiac rather than renal etiology.\n(Choice B)\nChronic obstructive pulmonary disease exacerbation\nCOPD exacerbation typically presents with increased cough, sputum production, and wheezing. While it can cause right heart failure with edema, the clear lung fields and elevated BNP without respiratory symptoms make primary cardiac etiology more likely.\n(Choice C)\nCirrhosis\nCirrhosis can cause fluid retention through portal hypertension and hypoalbuminemia, but this patient has normal albumin (4.2 g/dL) and liver enzymes (AST 28, ALT 30). The elevated JVP and orthopnea are not typical of hepatic causes of edema.\n(Choice D)\nAcute pulmonary embolism\nPulmonary embolism usually presents acutely with pleuritic chest pain, tachycardia, and hypoxia, rather than gradual onset with signs of chronic volume overload and clear lung fields.\n(Choice E)\nHeart failure\nThe patient's symptoms of orthopnea, fatigue, and signs of volume overload (elevated jugular venous pressure, edema) with clear lungs and absence of pulmonary edema on x-ray are characteristic of slowly progressive decompensated heart failure.","likely":"E.","hasReveal":true},{"sceneId":1,"sceneBeat":"entry","sceneTitle":"Short of breath at rest","sceneHook":"CHF vs COPD exacerbation vs PE: wet vs dry lungs and BNP traps","indexInScene":8,"sceneSize":8,"globalIndex":8,"id":"1549","sceneScore":15,"question":"A 72-year-old Caucasian female presents to the clinic with increasing difficulty in breathlessness during her routine morning walks. She has been a cigarette smoker for 35 years but quit 5 years ago. Her occupation was in an automobile factory with significant exposure to dust particles. On examination, heart sounds are unremarkable, but breath sounds are notably diminished bilaterally with no wheezes detected. A chest X-ray reveals overinflated lung fields and flattened diaphragms. An arterial blood gas (ABG) on room air presents with a pH of 7.45 (normal: 7.35-7.45), PaCO2 of 38 mm Hg (normal: 35-45 mm Hg), and PaO2 of 74 mm Hg. Given this presentation, what is the most probable diagnosis?","answers":[{"label":"A","text":"Chronic heart failure with preserved ejection fraction\n(1.24%)"},{"label":"B","text":"Pneumonia\n(0%)"},{"label":"C","text":"Emphysema\n(98.14%)"},{"label":"D","text":"Acute pulmonary embolism\n(0.62%)"}],"explanation":"Explanation\nThe patient's symptoms are classic for emphysema, a type of COPD, characterized by long-term smoking history, occupational dust exposure, overinflated lung fields on chest X-ray, and diminished breath sounds bilaterally. The ABG shows normal pH with mild hypoxemia, consistent with early-stage COPD.\n(Choice A)\nChronic heart failure with preserved ejection fraction\nHeart failure typically presents with bilateral crackles on auscultation, cardiomegaly on chest X-ray, and often peripheral edema. The hyperinflated lung fields and absence of cardiac findings make CHF unlikely.\n(Choice B)\nPneumonia\nPneumonia typically presents acutely with fever, productive cough, and consolidation or infiltrates on chest X-ray. The chronic nature of symptoms, hyperinflated lung fields, and absence of acute inflammatory signs make pneumonia unlikely.\n(Choice C)\nEmphysema\nEmphysema in COPD patients presents with signs of lung hyperinflation and reduced breath sounds. The ABG shows normal pH with mild hypoxemia, which is consistent with early-stage COPD. Advanced COPD typically shows CO2 retention (respiratory acidosis), but this patient's values suggest compensated or early disease.\n(Choice D)\nAcute pulmonary embolism\nPulmonary embolism typically presents with acute-onset dyspnea, pleuritic chest pain, and tachycardia. The gradual onset of exertional dyspnea over time, along with hyperinflated lung fields, is inconsistent with PE.","likely":"C.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":1,"sceneSize":8,"globalIndex":9,"id":"4113","sceneScore":15,"question":"A 35-year-old woman, gravida 1, at 28 weeks' gestation presents to her obstetrician with complaints of increased shortness of breath, wheezing, and nighttime awakenings due to coughing over the past month. She has a history of mild persistent asthma diagnosed in adolescence, which has been well controlled for the last 5 years on a daily inhaled corticosteroid and as-needed short-acting beta-agonist. She reports no recent infections, changes in environment, or new allergens, but mentions she has been under stress due to work demands as a librarian. Her vital signs are normal, and physical examination reveals mild expiratory wheezing. Spirometry shows a forced expiratory volume in 1 second (FEV1) of 75% predicted, down from 90% at her last visit 6 months ago. Which of the following is the most appropriate initial response by the physician?","answers":[{"label":"A","text":"\"It seems like your asthma is worsening due to pregnancy changes; we should switch to oral medications since inhalers may not be safe for the baby.\"\n(4.62%)"},{"label":"B","text":"\"Your symptoms are likely stress-related from work; I recommend reducing work hours and temporarily stopping your inhalers until after delivery to avoid any medication risks.\"\n(0%)"},{"label":"C","text":"\"Your asthma control has worsened; can you walk me through how and when you use your daily inhaler?\"\n(83.08%)"},{"label":"D","text":"\"Pregnancy can exacerbate asthma; let's increase your corticosteroid dose immediately to prevent complications.\"\n(12.31%)"}],"explanation":"Explanation\nIn a pregnant patient with longstanding well-controlled asthma presenting with worsening symptoms, nonadherence to controller medications due to fears of fetal harm is a common issue. Most asthma medications are safe in pregnancy and should be continued. The initial approach should involve a nonjudgmental discussion about medication usage patterns to identify and address potential nonadherence.\n(Choice A)\n\"It seems like your asthma is worsening due to pregnancy changes; we should switch to oral medications since inhalers may not be safe for the baby.\"\nThis is incorrect because it perpetuates the dangerous misconception that inhaled corticosteroids and bronchodilators are unsafe in pregnancy. In fact, most inhaled asthma medications (including inhaled corticosteroids and short-acting beta-agonists) are safe and preferred over oral medications in pregnancy. Uncontrolled asthma poses far greater risks to both mother and fetus than properly used inhaled medications.\n(Choice B)\n\"Your symptoms are likely stress-related from work; I recommend reducing work hours and temporarily stopping your inhalers until after delivery to avoid any medication risks.\"\nThis is incorrect because it attributes worsening asthma solely to psychological stress without investigating the more likely cause of medication nonadherence. Additionally, discontinuing controller medications would be dangerous and could lead to severe asthma exacerbations that pose significant risks to both mother and fetus. Stress may contribute to asthma symptoms but should not be the primary focus without first ensuring proper medication use.\n(Choice C)\n\"Your asthma control has worsened; can you walk me through how and when you use your daily inhaler?\"\nThis is correct as it initiates a nonjudgmental inquiry into medication adherence, which is likely the cause given the history of good control, and reinforces that medications should be continued.\n(Choice D)\n\"Pregnancy can exacerbate asthma; let's increase your corticosteroid dose immediately to prevent complications.\"\nThis is incorrect because it assumes pregnancy is directly causing asthma worsening and jumps immediately to medication intensification without first assessing current medication adherence. While pregnancy can affect asthma control (with roughly equal proportions of patients experiencing improvement, worsening, or no change), the most common cause of deteriorating control in previously well-controlled patients is medication nonadheren","likely":"C.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":2,"sceneSize":8,"globalIndex":10,"id":"4912","sceneScore":15,"question":"A 62-year-old non-smoking woman presents with episodes of dyspnea, chest tightness, and dry cough over the past year, often triggered by cold air or exercise. She has a history of allergic rhinitis but no prior respiratory issues. Pulmonary function tests reveal an FEV1 of 65% predicted, FEV1/FVC ratio of 0.60, and diffusing capacity for carbon monoxide (DLCO) within normal limits. After administration of a short-acting beta-agonist, her FEV1 increases to 80% predicted (a 23% improvement), and the FEV1/FVC ratio improves to 0.68. Which of the following is the most likely pathophysiologic mechanism underlying this patient's condition?","answers":[{"label":"A","text":"Bradykinin accumulation leading to airway edema\n(7.53%)"},{"label":"B","text":"Protease-mediated alveolar wall destruction\n(4.3%)"},{"label":"C","text":"Gastroesophageal reflux-induced vagal stimulation\n(0%)"},{"label":"D","text":"Leukocyte-induced bronchoconstriction\n(84.95%)"},{"label":"E","text":"Pulmonary vascular endothelial cell proliferation\n(3.23%)"}],"explanation":"Explanation\nThis patient, a non-smoker with episodic symptoms triggered by cold air and exercise, demonstrates reversible airflow obstruction on spirometry with a significant bronchodilator response (≥12% increase in FEV1), consistent with asthma. In late adult-onset asthma, greater airway remodeling prevents full normalization of the FEV1/FVC ratio. The hallmark mechanism is leukocyte-induced bronchoconstriction. COPD typically features reduced DLCO from protease-induced alveolar destruction. GERD may cause cough but not this obstructive pattern with bronchodilator response. Pulmonary arterial hypertension involves vascular changes without airflow obstruction. Bradykinin accumulation (e.g., from ACE inhibitors) causes angioedema but not reversible obstruction.\n(Choice A)\nBradykinin accumulation leading to airway edema\nBradykinin accumulation, classically seen with ACE inhibitor therapy, causes angioedema and dry cough but does not produce the reversible airflow obstruction, episodic wheezing pattern, or significant bronchodilator response characteristic of asthma.\n(Choice B)\nProtease-mediated alveolar wall destruction\nThis describes the pathophysiology of emphysema in COPD, where elastase and other proteases destroy alveolar walls leading to reduced DLCO. However, this patient has normal DLCO and demonstrates significant bronchodilator reversibility (23% FEV1 improvement), which are inconsistent with COPD.\n(Choice C)\nGastroesophageal reflux-induced vagal stimulation\nWhile GERD can trigger respiratory symptoms through vagal stimulation causing cough or mild bronchospasm, it does not typically produce the consistent obstructive spirometry pattern with significant bronchodilator reversibility (≥12% FEV1 improvement) seen in this case.\n(Choice D)\nLeukocyte-induced bronchoconstriction\nThis is the correct mechanism, as the patient's presentation and pulmonary function tests (obstructive pattern with significant bronchodilator response but incomplete FEV1/FVC normalization) are diagnostic of late adult-onset asthma, characterized by inflammatory leukocyte-mediated airway constriction and remodeling.\n(Choice E)\nPulmonary vascular endothelial cell proliferation\nThis mechanism characterizes pulmonary arterial hypertension, which presents with exertional dyspnea but causes restrictive changes or normal spirometry, not the obstructive pattern with bronchodilator responsiveness demonstrated here.","likely":"D.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":3,"sceneSize":8,"globalIndex":11,"id":"4816","sceneScore":15,"question":"A 48-year-old man with a 15-pack-year smoking history presents to the clinic with a 6-month history of progressive shortness of breath on exertion and a dry cough. He reports that his symptoms worsen during pollen season and that he occasionally experiences wheezing after exposure to dust. His father had asthma, and the patient has a history of childhood eczema. He notes partial relief with over-the-counter albuterol inhaler use. Physical examination reveals scattered wheezes in both lung fields. Which of the following is the most appropriate next step to differentiate between asthma and chronic obstructive pulmonary disease in this patient?","answers":[{"label":"A","text":"Spirometry before and after an inhaled bronchodilator\n(96.43%)"},{"label":"B","text":"Serum IgE level\n(0%)"},{"label":"C","text":"Chest x-ray\n(0%)"},{"label":"D","text":"Trial of albuterol with subjective symptom assessment\n(3.57%)"},{"label":"E","text":"Serum alpha-1 antitrypsin level\n(0%)"}],"explanation":"Explanation\nAsthma and COPD can present with overlapping features such as wheezing, cough, and exertional dyspnea, especially in patients with smoking history and atopic backgrounds. The key distinction is the degree of reversibility of airflow obstruction. Spirometry performed before and after administration of a short-acting bronchodilator (typically albuterol 400 mcg) is the definitive test to differentiate them: asthma typically shows significant reversibility (≥12% and ≥200 mL improvement in FEV1 or FVC), while COPD shows limited reversibility (<12% improvement). Other diagnostic tests like chest imaging, genetic testing, or inflammatory markers have specific roles in pulmonary evaluation but do not reliably assess the functional reversibility that distinguishes these conditions. Subjective response to bronchodilators, while supportive, does not provide the objective measurement needed for definitive differentiation.\n(Choice A)\nSpirometry before and after an inhaled bronchodilator\nThis test measures the reversibility of airflow obstruction, which is typically significant in asthma (>12% improvement in FEV1) but minimal in COPD, providing the key distinction.\n(Choice B)\nSerum IgE level\nWhile elevated total IgE levels may support an atopic background more common in asthma, IgE levels can be elevated in various conditions and do not assess the functional characteristic (reversibility) that distinguishes asthma from COPD.\n(Choice C)\nChest x-ray\nWhile chest x-ray can show hyperinflation in advanced COPD and help rule out other conditions like pneumonia or lung masses, it cannot assess the reversibility of airflow obstruction that is the key distinguishing feature between asthma and COPD.\n(Choice D)\nTrial of albuterol with subjective symptom assessment\nSubjective relief from albuterol can occur in both conditions and does not correlate reliably with spirometric reversibility, making it inadequate for differentiation.\n(Choice E)\nSerum alpha-1 antitrypsin level\nAlpha-1 antitrypsin deficiency testing is indicated when COPD occurs in young patients (<45 years) or those with minimal smoking history, but this test identifies a specific genetic cause of COPD rather than differentiating asthma from COPD based on reversibility.","likely":"A.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":4,"sceneSize":8,"globalIndex":12,"id":"4844","sceneScore":15,"question":"A 42-year-old man with a history of mild persistent asthma presents to his primary care physician with worsening respiratory symptoms over the past 3 months. He reports increased frequency of wheezing and shortness of breath, particularly occurring at night and shortly after consuming large or spicy meals. Additionally, he describes frequent heartburn, a bitter taste in his mouth upon waking, and occasional episodes of regurgitation. His current regimen includes an inhaled corticosteroid/long-acting beta-agonist combination and albuterol as needed, but he notes needing the rescue inhaler more often. Spirometry reveals an FEV1 of 72% predicted, with significant improvement post-bronchodilator. Physical examination is normal, and he has no history of smoking. Which of the following is the most appropriate next step in management?","answers":[{"label":"A","text":"Add esomeprazole\n(73.85%)"},{"label":"B","text":"Add oral prednisone\n(0%)"},{"label":"C","text":"Add montelukast\n(10.77%)"},{"label":"D","text":"Recommend dietary modifications only\n(12.31%)"},{"label":"E","text":"Perform esophageal manometry\n(3.08%)"}],"explanation":"Explanation\nComorbid gastroesophageal reflux disease (GERD) is common in patients with asthma and can exacerbate asthma symptoms through microaspiration, increasing vagal tone and bronchial reactivity. This patient has several clues suggesting GERD, including heartburn, regurgitation, bitter taste in the mouth, nocturnal worsening of symptoms, and postprandial exacerbations. Proton-pump inhibitor (PPI) therapy, such as esomeprazole, should be initiated to improve both asthma symptoms and peak expiratory flow rate in patients with asthma and evidence of comorbid GERD.\n(Choice A)\nAdd esomeprazole\nEsomeprazole, a proton-pump inhibitor, addresses the underlying GERD, which is likely exacerbating this patient's asthma symptoms through microaspiration and vagal stimulation, leading to improved asthma control.\n(Choice B)\nAdd oral prednisone\nOral prednisone is reserved for acute asthma exacerbations or severe persistent asthma that is poorly controlled despite optimal therapy. This patient has mild persistent asthma with a clear GERD trigger pattern, making systemic corticosteroids inappropriate and potentially harmful given their side effect profile.\n(Choice C)\nAdd montelukast\nWhile montelukast is an appropriate add-on therapy for mild persistent asthma and could provide additional bronchodilation, it does not address the underlying GERD that is clearly contributing to this patient's worsening symptoms based on his heartburn, regurgitation, and postprandial/nocturnal pattern.\n(Choice D)\nRecommend dietary modifications only\nWhile dietary modifications (avoiding large meals, spicy foods, eating 3 hours before bedtime) are important adjunctive measures for GERD management, this patient has clear symptomatic GERD that warrants pharmacologic intervention with a PPI for optimal asthma control. Lifestyle changes alone would be insufficient.\n(Choice E)\nPerform esophageal manometry\nEsophageal manometry is a specialized test used to evaluate esophageal motility disorders and is typically reserved for patients with dysphagia or when considering anti-reflux surgery. This patient has classic GERD symptoms that warrant empiric PPI therapy as the initial approach, with further testing only if symptoms fail to respond to treatment.","likely":"A.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":5,"sceneSize":8,"globalIndex":13,"id":"1387","sceneScore":15,"question":"A 55-year-old Hispanic woman arrives at your clinic complaining of a persistent hacking cough, breathlessness that worsens during physical activity, and sporadic wheezing episodes over the past year. Her family medical background is notable for asthma in both parents. She has a 25-year history of smoking one pack of cigarettes daily and consumes alcohol moderately. Current medications include antihypertensives. On physical examination, there are diffuse expiratory wheezes in both lung fields. Which diagnostic test is most useful in distinguishing between asthma and chronic bronchitis in this case?","answers":[{"label":"A","text":"Carboxyhemoglobin level measurement\n(0%)"},{"label":"B","text":"Spirometry before and after a bronchodilator\n(68.39%)"},{"label":"C","text":"High-resolution computed tomography of the chest\n(2.58%)"},{"label":"D","text":"Methacholine challenge test\n(29.03%)"},{"label":"E","text":"Arterial blood gas analysis\n(0%)"}],"explanation":"Explanation\nBoth asthma and chronic bronchitis are obstructive airway diseases often confused due to overlapping symptoms. Spirometry with bronchodilator plays a key role in differentiating between the two by revealing reversible airflow obstruction in asthma, as opposed to the typically irreversible obstruction observed in chronic bronchitis.\n(Choice A)\nCarboxyhemoglobin level measurement\nThis test detects carbon monoxide exposure. It's irrelevant for differentiating asthma from chronic bronchitis and more associated with smoke inhalation or CO poisoning.\n(Choice B)\nSpirometry before and after a bronchodilator\nThis test assesses the reversibility of airway obstruction. A marked improvement in FEV1 following bronchodilator administration (typically an increase of 12% and 200 mL or more) points towards asthma due to reversible bronchoconstriction.\n(Choice C)\nHigh-resolution computed tomography of the chest\nHRCT is valuable for identifying structural lung changes such as emphysema, bronchiectasis, or bronchial wall thickening. While it can support a diagnosis of COPD when emphysematous changes are present, it is not the primary test for distinguishing asthma from chronic bronchitis, as both conditions may show similar or minimal changes on HRCT.\n(Choice D)\nMethacholine challenge test\nMethacholine challenge test measures airway hyperresponsiveness by inducing bronchoconstriction with inhaled methacholine. A positive test (≥20% drop in FEV1) indicates airway hyperreactivity, which is characteristic of asthma. However, this test is typically used when spirometry is normal or borderline, and the clinical presentation already suggests asthma. It's not the first-line test for differentiating asthma from chronic bronchitis when both conditions may show airway obstruction.\n(Choice E)\nArterial blood gas analysis\nABG analysis assesses oxygenation, ventilation, and acid-base status. It may show hypoxemia and/or hypercapnia in severe COPD or during exacerbations, but these findings can also occur in severe asthma. ABG results reflect disease severity rather than help distinguish between asthma and chronic bronchitis, making it unsuitable for differential diagnosis between these conditions.","likely":"B.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":6,"sceneSize":8,"globalIndex":14,"id":"5011","sceneScore":15,"question":"A 62-year-old woman presents to her primary care physician with progressive shortness of breath over the past year. She reports dyspnea when climbing one flight of stairs or walking briskly on level ground, which has limited her ability to participate in community activities. She has a 30-pack-year smoking history but quit 5 years ago. She denies cough, wheeze, or recent respiratory infections, and has never been hospitalized for breathing issues. Physical examination reveals decreased breath sounds bilaterally without crackles or wheezing. Spirometry shows an FEV1/FVC ratio of 0.62 and FEV1 of 58% predicted, with no significant bronchodilator response. She is diagnosed with chronic obstructive pulmonary disease (COPD). What is the most appropriate initial pharmacotherapy for this patient's stable COPD?","answers":[{"label":"A","text":"Inhaled corticosteroid monotherapy\n(0%)"},{"label":"B","text":"Oral theophylline\n(1.75%)"},{"label":"C","text":"Inhaled long-acting muscarinic antagonist\n(75.44%)"},{"label":"D","text":"Short-acting beta-agonist as needed\n(22.81%)"},{"label":"E","text":"Leukotriene receptor antagonist\n(0%)"}],"explanation":"Explanation\nThis patient has stable COPD with high symptom burden (dyspnea limiting daily activities) but low disease risk (no history of exacerbations or hospitalizations), classifying her as GOLD group B. The recommended initial therapy is a long-acting muscarinic antagonist (LAMA) to improve symptoms and quality of life. Inhaled corticosteroids are not first-line for group B; leukotriene antagonists are not indicated in COPD; short-acting beta-agonists are for as-needed use, not maintenance; and oral theophylline is not preferred due to side effects and limited efficacy.\n(Choice A)\nInhaled corticosteroid monotherapy\nInhaled corticosteroids as monotherapy are not recommended as initial treatment for stable COPD. They are reserved for patients with frequent exacerbations (≥2 moderate or ≥1 severe per year) or those with blood eosinophilia ≥300 cells/μL, typically in GOLD group C or D patients.\n(Choice B)\nOral theophylline\nOral theophylline has limited bronchodilator efficacy, requires frequent monitoring due to its narrow therapeutic window, and carries significant risk of cardiovascular and neurologic side effects. It is considered third-line therapy only after inhaled bronchodilators have been optimized.\n(Choice C)\nInhaled long-acting muscarinic antagonist\nThis is the preferred initial monotherapy for patients with stable COPD in GOLD group B, who have high symptom burden but low exacerbation risk, as it provides sustained bronchodilation and symptom relief.\n(Choice D)\nShort-acting beta-agonist as needed\nShort-acting beta-agonists (SABAs) provide rapid bronchodilation for acute symptom relief but are inadequate as sole maintenance therapy for patients with persistent daily symptoms. This patient's functional limitations require long-acting maintenance bronchodilation.\n(Choice E)\nLeukotriene receptor antagonist\nLeukotriene receptor antagonists (such as montelukast) are anti-inflammatory agents used in asthma management but have no proven efficacy or established role in COPD treatment according to current guidelines.","likely":"C.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":7,"sceneSize":8,"globalIndex":15,"id":"4789","sceneScore":15,"question":"A 45-year-old male construction worker falls from a ladder and sustains multiple rib fractures on the left side. He presents to the emergency department with severe chest pain and difficulty breathing deeply. Chest X-ray confirms fractures of the 5th to 8th ribs without evidence of pneumothorax or hemothorax. Vital signs are stable, and there are no other injuries. Which of the following is the most appropriate initial management to prevent pulmonary complications such as atelectasis and pneumonia?","answers":[{"label":"A","text":"Adequate pain control with multimodal analgesia\n(89.04%)"},{"label":"B","text":"Non-invasive positive pressure ventilation\n(4.11%)"},{"label":"C","text":"Incentive spirometry alone\n(4.11%)"},{"label":"D","text":"Immediate surgical rib fixation\n(2.74%)"},{"label":"E","text":"Nebulized bronchodilators\n(0%)"}],"explanation":"Explanation\nRib fractures can lead to shallow breathing due to pain, resulting in atelectasis and increased risk of pneumonia. The cornerstone of management is adequate pain control using multimodal analgesia (NSAIDs, acetaminophen, regional blocks when appropriate) to promote deep breathing, effective coughing, and lung expansion. This is often combined with incentive spirometry and early mobilization. Other interventions like prophylactic antibiotics, bronchodilators, surgical fixation, and non-invasive ventilation may have specific indications but are not the primary focus in uncomplicated, stable cases.\n(Choice A)\nAdequate pain control with multimodal analgesia\nThis is correct. Effective pain management allows for deeper breathing and coughing, reducing the risk of atelectasis and pneumonia.\n(Choice B)\nNon-invasive positive pressure ventilation\nThis is incorrect. This may be used in respiratory failure but is not the initial mainstay for preventing complications in stable patients.\n(Choice C)\nIncentive spirometry alone\nThis is incorrect. While incentive spirometry is beneficial for preventing atelectasis, it cannot be performed effectively when patients have severe pain that limits deep inspiration. Pain control must be achieved first to make incentive spirometry feasible and effective.\n(Choice D)\nImmediate surgical rib fixation\nThis is incorrect. Surgical rib fixation (SSRF) is reserved for flail chest (≥3 consecutive ribs fractured in ≥2 places), severe chest wall instability, or failure of conservative management. Simple rib fractures are managed conservatively with pain control and pulmonary hygiene.\n(Choice E)\nNebulized bronchodilators\nThis is incorrect. Nebulized bronchodilators are indicated for bronchospasm or obstructive airway disease, not for the mechanical restriction of chest wall movement caused by rib fracture pain. The primary issue here is pain-limited ventilation, not airway obstruction.","likely":"A.","hasReveal":true},{"sceneId":2,"sceneBeat":"complication","sceneTitle":"Wheeze and air trap","sceneHook":"Asthma vs COPD vs cardiac asthma: spirometry and steroid/response forks","indexInScene":8,"sceneSize":8,"globalIndex":16,"id":"4886","sceneScore":15,"question":"A 58-year-old woman who has never smoked presents to the clinic with a 5-year history of progressive dyspnea on exertion and a chronic dry cough. She reports long-term exposure to indoor wood smoke from cooking in a poorly ventilated home in a rural area. Physical examination reveals increased anteroposterior chest diameter, hyperresonance to percussion, and diminished breath sounds with occasional wheezes. Spirometry shows an FEV1/FVC ratio of 0.55 and FEV1 of 45% predicted, with minimal bronchodilator response. Chest radiograph is shown below. What is the pharmacologic class of the mainstay therapy for managing her chronic symptoms?","answers":[{"label":"A","text":"Xanthine derivative\n(1.64%)"},{"label":"B","text":"Corticosteroid\n(21.31%)"},{"label":"C","text":"Leukotriene receptor antagonist\n(0%)"},{"label":"D","text":"Phosphodiesterase inhibitor\n(14.75%)"},{"label":"E","text":"Muscarinic antagonist\n(62.3%)"}],"explanation":"Explanation\nThis patient has clinical features consistent with chronic obstructive pulmonary disease (COPD) likely due to biomass fuel exposure, including progressive dyspnea, cough, barrel chest, and obstructive pattern on spirometry. The primary treatment for symptom relief in COPD involves long-acting inhaled bronchodilators, with long-acting antimuscarinic agents (LAMAs) like tiotropium being preferred for maintenance therapy, often combined with long-acting beta-agonists for enhanced effect. Other options like corticosteroids or leukotriene modifiers are not the mainstay for routine symptom management.\n(Choice A)\nXanthine derivative\nXanthine derivatives like aminophylline are not recommended as mainstay therapy in COPD due to side effects and inferior efficacy to anticholinergics and beta-agonists.\n(Choice B)\nCorticosteroid\nInhaled corticosteroids are used in COPD primarily for patients with frequent exacerbations or eosinophilic phenotype, typically in combination with long-acting bronchodilators, but are not the mainstay for routine symptom management in stable COPD.\n(Choice C)\nLeukotriene receptor antagonist\nLeukotriene receptor antagonists like montelukast are primarily used in asthma management and have no established role in COPD symptom relief or management.\n(Choice D)\nPhosphodiesterase inhibitor\nOral phosphodiesterase-4 inhibitors like roflumilast are used in severe COPD with chronic bronchitis and frequent exacerbations, but are not first-line therapy due to gastrointestinal side effects and limited role compared to inhaled bronchodilators.\n(Choice E)\nMuscarinic antagonist\nLong-acting muscarinic antagonists (LAMAs) like tiotropium are the cornerstone of bronchodilator therapy in COPD, providing sustained symptom relief by blocking acetylcholine-mediated bronchoconstriction. They are preferred over short-acting agents for maintenance therapy.","likely":"E.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":1,"sceneSize":8,"globalIndex":17,"id":"4812","sceneScore":17,"question":"A 68-year-old woman with a history of advanced Parkinson's disease is brought to the emergency department by her caregiver due to a 2-week history of fever, productive cough with foul-smelling sputum, and progressive lethargy. She has experienced recurrent episodes of dysphagia and choking during meals. On examination, she is febrile (38.5°C), tachypneic, and has decreased breath sounds over the right lower lung field with egophony. Laboratory studies and a chest x-ray are shown below. What is the most likely diagnosis?\n\n\n\nWhite blood cell count\t18500/mm3\nNeutrophils\t82%\nBand neutrophils\t10%\nLymphocytes\t6%\nMonocytes\t2%\nEosinophils\t0%\nBasophils\t0%\nRed blood cell count\t4.1x10^6/µL\nHemoglobin\t12.6 g/dL\nHematocrit\t38%\nPlatelet count\t320000/µL\nMean platelet volume\t10.2 fL\nSputum culture\tMixed anaerobic flora detected","answers":[{"label":"A","text":"Aspiration pneumonitis\n(47.06%)"},{"label":"B","text":"Lung abscess\n(52.94%)"},{"label":"C","text":"Lung cancer\n(0%)"},{"label":"D","text":"Pulmonary tuberculosis\n(0%)"},{"label":"E","text":"Community-acquired pneumonia\n(0%)"}],"explanation":"Explanation\nLung abscess secondary to aspiration of oropharyngeal anaerobic bacteria, commonly seen in patients with dysphagia from neurological conditions like Parkinson's disease.\n(Choice A)\nAspiration pneumonitis\nAspiration pneumonitis represents the initial chemical injury from gastric acid and typically occurs within hours of aspiration. This patient's 2-week history with purulent, foul-smelling sputum and mixed anaerobic bacterial growth indicates progression to aspiration pneumonia with subsequent abscess formation, representing a more advanced infectious complication.\n(Choice B)\nLung abscess\nThis patient's clinical presentation, including risk factors for aspiration (dysphagia due to Parkinson's), foul-smelling sputum, cavitary lesion in a dependent lung segment, and growth of anaerobic bacteria, is classic for lung abscess caused by aspirated oropharyngeal anaerobes. Treatment involves prolonged antibiotics like clindamycin or amoxicillin-clavulanate, with drainage if necessary.\n(Choice C)\nLung cancer\nPrimary lung cancer can occasionally cavitate, but the acute presentation with fever, leukocytosis with left shift, foul-smelling purulent sputum, and growth of anaerobic bacteria indicates an infectious process rather than malignancy. Lung cancer would not produce anaerobic bacterial growth on sputum culture.\n(Choice D)\nPulmonary tuberculosis\nPulmonary tuberculosis can cause cavitary lesions and subacute presentation, but several features argue against this diagnosis: TB typically affects the upper lobes or superior segments of lower lobes, the sputum would not be foul-smelling from anaerobes, and sputum examination would reveal acid-fast bacilli rather than mixed anaerobic flora.\n(Choice E)\nCommunity-acquired pneumonia\nWhile community-acquired pneumonia can present with fever, cough, and consolidation, the presence of foul-smelling sputum, mixed anaerobic flora on culture, cavitary appearance on imaging, and clear aspiration risk factors (dysphagia from Parkinson's disease) are pathognomonic for lung abscess rather than typical bacterial pneumonia.","likely":"B.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":2,"sceneSize":8,"globalIndex":18,"id":"4811","sceneScore":14,"question":"A 28-year-old man with a history of intravenous opioid use presents to the clinic with a 2-week history of low-grade fever, night sweats, unintentional weight loss, and a productive cough with foul-smelling sputum. He reports an episode of opioid overdose 4 weeks ago, during which he was unconscious for approximately 12 hours and required naloxone reversal. He has poor oral hygiene and a 10-pack-year smoking history. Physical examination reveals diminished breath sounds and crackles at the right lung base. Laboratory studies and a chest X-ray are shown below. Which of the following is the most likely etiology of this patient's pulmonary condition?\n\n\n\nWhite blood cell count\t16500/mm3\nNeutrophils\t82%\nLymphocytes\t10%\nMonocytes\t6%\nEosinophils\t1%\nBasophils\t1%\nRed blood cell count\t4.6x10^6/µL\nHemoglobin\t13.8 g/dL\nHematocrit\t41%\nPlatelet count\t290000 /µL\nSodium\t138 mEq/L\nPotassium\t4.2 mEq/L\nChloride\t102 mEq/L\nGlucose\t96 mg/dL\nCalcium\t9.3 mg/dL\nAspartate aminotransferase AST\t26 U/L\nAlanine aminotransferase ALT\t28 U/L\nAlkaline phosphatase\t92 U/L","answers":[{"label":"A","text":"Anaerobic bacterial infection\n(77.42%)"},{"label":"B","text":"Squamous cell carcinoma\n(0%)"},{"label":"C","text":"Staphylococcus aureus infection\n(16.13%)"},{"label":"D","text":"Aspergillus fumigatus infection\n(0%)"},{"label":"E","text":"Mycobacterium tuberculosis infection\n(6.45%)"}],"explanation":"Explanation\nThis 28-year-old man with opioid abuse history has subacute symptoms of fever, night sweats, weight loss, and putrid sputum following an episode of impaired consciousness. Imaging shows a cavitary lesion with air-fluid level, consistent with lung abscess due to aspiration of oropharyngeal anaerobes.\n(Choice A)\nAnaerobic bacterial infection\nLung abscess in this patient is most likely due to aspiration of oropharyngeal anaerobic bacteria during his episode of impaired consciousness from opioid overdose. The subacute presentation, putrid sputum, poor dentition, and characteristic imaging findings support this diagnosis.\n(Choice B)\nSquamous cell carcinoma\nPrimary lung cancer can cavitate and mimic lung abscess, particularly squamous cell carcinoma in smokers. However, malignancy typically presents with gradual onset of symptoms over months, and cavitation occurs due to tumor necrosis rather than infection. The acute febrile illness with leukocytosis and putrid sputum following aspiration strongly favors infectious etiology.\n(Choice C)\nStaphylococcus aureus infection\nWhile S. aureus can cause necrotizing pneumonia and lung abscesses in IV drug users (often associated with tricuspid valve endocarditis), it typically presents more acutely with high fever and systemic toxicity. The subacute course with putrid sputum strongly suggests anaerobic organisms from aspiration rather than hematogenous S. aureus seeding.\n(Choice D)\nAspergillus fumigatus infection\nAspergillosis typically occurs in immunocompromised patients or those with underlying lung disease like COPD or prior TB cavities. Invasive aspergillosis presents acutely in neutropenic patients, while aspergilloma forms in pre-existing cavities and rarely causes acute symptoms. This patient's presentation with putrid sputum following aspiration is classic for anaerobic bacterial infection.\n(Choice E)\nMycobacterium tuberculosis infection\nAlthough tuberculosis can cause cavitary lung lesions and should be considered in IV drug users, it typically presents with a more indolent course over months. The acute onset following aspiration, putrid sputum production, and lack of constitutional symptoms like chronic cough or hemoptysis make TB less likely than aspiration pneumonia with anaerobic bacteria.","likely":"A.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":3,"sceneSize":8,"globalIndex":19,"id":"4929","sceneScore":14,"question":"A 35-year-old man with a history of poorly controlled epilepsy presents to the clinic with a 2-week history of cough productive of foul-smelling, purulent sputum, low-grade fever, malaise, and unintentional weight loss of 5 kg. He reports experiencing several generalized tonic-clonic seizures in the past month, during which he loses consciousness. His medications include phenytoin, but adherence has been inconsistent. Physical examination reveals poor oral hygiene and halitosis. Laboratory studies and a chest x-ray are shown below. What is the most likely mechanism underlying this patient's pulmonary condition?\n\n\n\nWhite blood cell count\t16500 /mm3\nNeutrophils\t82%\nLymphocytes\t12%\nMonocytes\t4%\nEosinophils\t1%\nBasophils\t1%\nRed blood cell count\t4.3x10^6/µL\nHemoglobin\t13.2 g/dL\nHematocrit\t40%\nMean corpuscular volume\t93 fL\nMean corpuscular hemoglobin\t30 pg\nMean corpuscular hemoglobin concentration\t32 g/dL\nRed cell distribution width\t13.5%\nPlatelet count\t310000/µL\nMean platelet volume\t9.6 fL","answers":[{"label":"A","text":"Direct extension from mediastinal lymph nodes\n(0%)"},{"label":"B","text":"Hematogenous spread from a distant infection\n(0%)"},{"label":"C","text":"Oropharyngeal aspiration\n(98.72%)"},{"label":"D","text":"Reactivation of latent infection\n(1.28%)"},{"label":"E","text":"Inhalation of fungal spores\n(0%)"}],"explanation":"Explanation\nThe patient's indolent productive cough with foul-smelling sputum, systemic symptoms (fever, malaise, weight loss), leukocytosis, poor oral hygiene, and cavitary lesion in a dependent lung segment (posterior upper lobe, common in supine aspiration) suggest lung abscess due to aspiration of oropharyngeal anaerobic bacteria. This is facilitated by periods of impaired consciousness during seizures in epilepsy.\n(Choice A)\nDirect extension from mediastinal lymph nodes\nDirect extension from mediastinal lymph nodes occurs in conditions like lymphoma or sarcoidosis but would not produce the characteristic foul-smelling sputum from anaerobic bacteria. Additionally, this mechanism would not explain the cavitary lesion in a dependent lung segment typical of aspiration pneumonia.\n(Choice B)\nHematogenous spread from a distant infection\nHematogenous spread typically causes multiple, peripheral septic emboli with acute presentation. While it can cause cavitary lesions, it does not produce the characteristic foul-smelling sputum from anaerobic bacteria or show the strong association with aspiration risk factors like seizure-related unconsciousness and poor oral hygiene.\n(Choice C)\nOropharyngeal aspiration\nOropharyngeal aspiration of anaerobic bacteria during periods of unconsciousness (eg, seizures) leads to lung abscess in dependent lung segments, presenting with indolent symptoms, foul-smelling sputum, and cavitary infiltrates on imaging.\n(Choice D)\nReactivation of latent infection\nPulmonary tuberculosis reactivation classically causes apical cavitary lesions with chronic cough, night sweats, and hemoptysis. However, TB sputum is typically not foul-smelling since it involves aerobic mycobacteria rather than anaerobic bacteria. The dependent lung location and aspiration risk factors (seizures, poor oral hygiene) point away from TB.\n(Choice E)\nInhalation of fungal spores\nFungal pneumonia (histoplasmosis, coccidioidomycosis) can cause cavitary lesions but typically presents more acutely in endemic areas. The key distinguishing feature is that fungal infections do not produce foul-smelling sputum, which is pathognomonic for anaerobic bacterial infection from aspiration.","likely":"C.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":4,"sceneSize":8,"globalIndex":20,"id":"3941","sceneScore":13,"question":"A 35-year-old G2P1 woman at 32 weeks' gestation with a twin pregnancy is admitted for management of preeclampsia with severe features, including blood pressure of 170/105 mmHg, Laboratory results are shown below .She has been receiving intravenous fluids and magnesium sulfate infusion. On hospital day 2, she suddenly develops severe shortness of breath, her oxygen saturation falls to 88% on room air, and lung examination reveals diffuse crackles bilaterally. She has no fever, cough, or chest pain. What is the most likely diagnosis for her acute respiratory distress?\n                     \n\n\nWhite blood cell count\t8.0 x10^9/L\nNeutrophils\t61 %\nLymphocytes\t29 %\nMonocytes\t6 %\nEosinophils\t3 %\nBasophils\t1 %\nRed blood cell count\t4.1 x10^12/L\nHemoglobin\t12.7 g/dL\nHematocrit\t38.6 %\nMCV\t92 fL\nMCH\t31 pg\nMCHC\t33 g/dL\nRDW\t13.2 %\nPlatelet count\t230 x10^9/L\nMPV\t9.6 fL\nUrine protein (dipstick)\t4+\nAST\t150 U/L\nALT\t165 U/L","answers":[{"label":"A","text":"Community-acquired pneumonia\n(0%)"},{"label":"B","text":"Pulmonary edema\n(46.43%)"},{"label":"C","text":"Amniotic fluid embolism\n(19.05%)"},{"label":"D","text":"Acute respiratory distress syndrome\n(19.05%)"},{"label":"E","text":"Pulmonary embolism\n(15.48%)"}],"explanation":"Explanation\nThis patient's acute dyspnea, hypoxia, and bilateral crackles are indicative of pulmonary edema, a serious complication of preeclampsia with severe features. The pathophysiology involves endothelial dysfunction causing increased vascular permeability, elevated systemic vascular resistance leading to increased pulmonary capillary wedge pressure, and decreased oncotic pressure from proteinuria and hypoalbuminemia. Twin gestation increases the risk due to higher circulating volume and greater placental mass. Intravenous fluid administration can precipitate or worsen pulmonary edema in these high-risk patients.\n(Choice A)\nCommunity-acquired pneumonia\nIncorrect. While pneumonia can cause dyspnea and crackles, the absence of fever, cough, productive sputum, and leukocytosis (WBC count is normal at 8.0) makes this diagnosis unlikely. The acute onset in the setting of preeclampsia with severe features points toward a cardiovascular rather than infectious etiology.\n(Choice B)\nPulmonary edema\nCorrect. The clinical presentation of acute dyspnea, hypoxia, and bilateral crackles in a patient with preeclampsia with severe features, especially with twin gestation and fluid administration, is classic for pulmonary edema due to increased vascular permeability, elevated hydrostatic pressure, and reduced oncotic pressure.\n(Choice C)\nAmniotic fluid embolism\nIncorrect. Amniotic fluid embolism is a rare obstetric emergency that typically occurs during active labor, delivery, or immediate postpartum period. It presents with sudden cardiovascular collapse, coagulopathy (DIC), and severe respiratory distress. This patient is stable at 32 weeks without signs of labor.\n(Choice D)\nAcute respiratory distress syndrome\nIncorrect. ARDS typically requires an inciting event such as sepsis, trauma, aspiration, or massive transfusion, none of which are present. While severe preeclampsia can cause capillary leak syndrome, the mechanism here is primarily cardiogenic (increased hydrostatic pressure) rather than the non-cardiogenic pulmonary edema seen in ARDS.\n(Choice E)\nPulmonary embolism\nIncorrect. Pulmonary embolism typically presents with pleuritic chest pain, tachycardia, and sometimes hemoptysis, which are absent here. While pregnancy increases thromboembolic risk, PE usually causes unilateral findings and would not typically produce the bilateral crackles seen in this patient.","likely":"B.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":5,"sceneSize":8,"globalIndex":21,"id":"5014","sceneScore":13,"question":"A 32-year-old construction worker presents to the emergency department with sudden-onset dyspnea and nonproductive cough that began 2 hours ago. He reports feeling extremely anxious earlier in the day and admits to smoking 'something to relax' provided by a coworker. On examination, he is tachypneic with oxygen saturation of 88% on room air, and lung auscultation reveals diffuse crackles. Chest radiograph is shown below. Urine toxicology screen is positive for cocaine metabolites. Bronchoscopy is performed, revealing progressively bloody lavage fluid. Which of the following is the most likely diagnosis?","answers":[{"label":"A","text":"Diffuse alveolar hemorrhage\n(70.91%)"},{"label":"B","text":"Community-acquired pneumonia\n(0%)"},{"label":"C","text":"Pulmonary edema\n(1.82%)"},{"label":"D","text":"Hypersensitivity pneumonitis\n(5.45%)"},{"label":"E","text":"Acute respiratory distress syndrome\n(21.82%)"}],"explanation":"Explanation\nRapid onset of hypoxemia with diffuse, bilateral alveolar infiltrates in the setting of recent cocaine inhalation suggests acute lung toxicity. The patient's occupational stress leading to drug use, absence of hemoptysis, imaging findings, and positive urine toxicology support cocaine-induced diffuse alveolar hemorrhage (DAH). Hemoptysis is absent in many cases, and diagnosis relies on clinical presentation, imaging, and confirmatory tests like bronchoalveolar lavage.\n(Choice A)\nDiffuse alveolar hemorrhage\nCocaine inhalation can cause DAH, leading to acute dyspnea, hypoxemia, and bilateral alveolar opacities without hemoptysis in up to half of cases; diagnosis is supported by clinical history, imaging, positive toxicology, and bloody bronchoalveolar lavage.\n(Choice B)\nCommunity-acquired pneumonia\nCommunity-acquired pneumonia typically presents with fever, productive cough, and unilateral or focal infiltrates rather than the acute bilateral diffuse pattern seen here. The temporal relationship to cocaine use and bloody bronchoalveolar lavage strongly favor DAH over infectious pneumonia.\n(Choice C)\nPulmonary edema\nCardiogenic pulmonary edema can present with acute dyspnea and bilateral infiltrates, but typically shows a perihilar 'bat-wing' pattern and responds to diuretics. Cocaine can cause both cardiogenic and non-cardiogenic pulmonary edema, but the bloody bronchoalveolar lavage specifically indicates alveolar hemorrhage rather than fluid accumulation.\n(Choice D)\nHypersensitivity pneumonitis\nHypersensitivity pneumonitis results from repeated exposure to organic antigens and typically presents subacutely or chronically with upper and mid-lobe predominant infiltrates. The acute onset immediately after cocaine use and bloody bronchoalveolar lavage are inconsistent with this diagnosis.\n(Choice E)\nAcute respiratory distress syndrome\nWhile ARDS presents with hypoxemia and bilateral infiltrates, it typically develops over 24-72 hours following a known insult like sepsis, trauma, or aspiration. The rapid onset within 2 hours of cocaine use, combined with bloody bronchoalveolar lavage, is more characteristic of cocaine-induced diffuse alveolar hemorrhage.","likely":"A.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":6,"sceneSize":8,"globalIndex":22,"id":"4987","sceneScore":13,"question":"A 28-year-old man with a history of moderate persistent asthma since childhood presents to the clinic with a 6-week history of progressive shortness of breath, productive cough with brownish sputum plugs, and low-grade fever. He has been treated with two courses of broad-spectrum antibiotics for suspected community-acquired pneumonia, but his symptoms have not improved. Physical examination reveals diffuse wheezing and crackles in the right upper lung field. Laboratory evaluation and chest x-ray are shown below.  What is the most likely diagnosis?\n\n\n\nWhite blood cell count\t9200/mm³\nNeutrophils\t55%\nLymphocytes\t25%\nMonocytes\t6%\nEosinophils\t12%\nBasophils\t2%\nRed blood cell count\t4.5x10^6/µL\nHemoglobin\t13.5 g/dL\nHematocrit\t40%\nPlatelet count\t255000/µL\nTotal serum IgE\t1200 IU/mL\nSputum culture\tAspergillus fumigatus detected\nBacterial sputum culture\tNo bacterial pathogens identified","answers":[{"label":"A","text":"Allergic bronchopulmonary aspergillosis\n(94.44%)"},{"label":"B","text":"Invasive pulmonary aspergillosis\n(5.56%)"},{"label":"C","text":"Aspiration pneumonia\n(0%)"},{"label":"D","text":"Chronic eosinophilic pneumonia\n(0%)"},{"label":"E","text":"Community-acquired bacterial pneumonia\n(0%)"}],"explanation":"Explanation\nThis patient with long-standing asthma has persistent respiratory symptoms despite antibiotic therapy, peripheral eosinophilia, elevated IgE, and sputum positive for Aspergillus fumigatus, consistent with allergic bronchopulmonary aspergillosis (ABPA). ABPA is a hypersensitivity reaction to Aspergillus colonization in patients with underlying airway diseases like asthma, leading to allergic inflammation rather than invasive infection.\n(Choice A)\nAllergic bronchopulmonary aspergillosis\nThis is the correct diagnosis. ABPA is a hypersensitivity reaction to Aspergillus in patients with asthma or cystic fibrosis, characterized by elevated IgE, eosinophilia, and persistent symptoms despite antibiotics due to allergic inflammation.\n(Choice B)\nInvasive pulmonary aspergillosis\nThis is incorrect. Invasive pulmonary aspergillosis occurs in severely immunocompromised patients (neutropenia, high-dose steroids, transplant recipients) and presents with tissue invasion and necrosis. This patient is immunocompetent with symptoms driven by allergic hypersensitivity, not fungal invasion.\n(Choice C)\nAspiration pneumonia\nThis is incorrect. Aspiration pneumonia typically presents acutely following witnessed or suspected aspiration events in patients with risk factors such as altered mental status, dysphagia, or impaired cough reflex. It would not cause peripheral eosinophilia, elevated IgE, or Aspergillus colonization.\n(Choice D)\nChronic eosinophilic pneumonia\nThis is incorrect. While chronic eosinophilic pneumonia does feature peripheral eosinophilia and pulmonary infiltrates, it lacks the specific association with Aspergillus colonization and the markedly elevated total IgE seen in ABPA. CEP typically shows peripheral eosinophilia >25% and responds well to corticosteroids alone.\n(Choice E)\nCommunity-acquired bacterial pneumonia\nThis is incorrect. Although initially suspected, the lack of response to antibiotics, absence of bacterial growth, and presence of eosinophilia and high IgE point away from a bacterial etiology.","likely":"A.","hasReveal":true},{"sceneId":3,"sceneBeat":"deepening","sceneTitle":"Infiltrate or not","sceneHook":"CAP vs aspiration vs TB vs sterile CHF infiltrate","indexInScene":7,"sceneSize":8,"globalIndex":23,"id":"4907","sceneScore":13,"question":"A 32-year-old woman who works as a nurse in a high-tuberculosis-prevalence clinic presents to the emergency department with a 2-week history of persistent cough, low-grade fever, night sweats, and recent onset of hemoptysis. She reports unintentional weight loss of 4 kg over the past month and has a history of negative PPD testing 6 months ago. Vital signs are temperature 37.8°C, blood pressure 118/76 mm Hg, pulse 88/min, and respirations 16/min. Lung examination reveals crackles in the left upper lobe. A chest x-ray is shown below. Which of the following is the most appropriate next step in management?","answers":[{"label":"A","text":"Obtain a CT scan of the chest\n(10.61%)"},{"label":"B","text":"Administer intravenous ceftriaxone and azithromycin for community-acquired pneumonia\n(1.52%)"},{"label":"C","text":"Start empiric antifungal therapy with voriconazole\n(1.52%)"},{"label":"D","text":"Place the patient in respiratory isolation\n(86.36%)"},{"label":"E","text":"Perform urgent bronchoscopy with bronchoalveolar lavage\n(0%)"}],"explanation":"Explanation\nThe patient's occupational exposure, symptoms of cough, fever, night sweats, weight loss, and hemoptysis, along with upper-lobe infiltrates on chest x-ray, raise high suspicion for pulmonary tuberculosis. As she is stable, the immediate next step is to place her in respiratory isolation to prevent transmission, followed by confirmatory tests such as sputum acid-fast b
