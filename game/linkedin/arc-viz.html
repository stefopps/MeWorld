<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeWorld · Content Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  :root { --fs-reader: 17px; }

  :root {
    --bg: #ffffff; --bg-subtle: #f5f5f7; --bg-surface: #fafafa;
    --border: #e5e5e5; --border-hi: #d1d1d6;
    --text: #1d1d1f; --text-soft: #6e6e73; --text-muted: #aeaeb2;
    --accent: #0071e3; --accent-bg: #e8f0fe;
    --dot-draft: #aeaeb2; --dot-ready: #f5a623; --dot-posted: #34c759;
    --ready-bg: #fef9e7; --ready-text: #7d5e00;
    --posted-bg: #e8f8ee; --posted-text: #1a5e2a;
    --shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.06);
  }

  [data-theme="dark"] {
    --bg: #000000; --bg-subtle: #1c1c1e; --bg-surface: #111111;
    --border: #2c2c2e; --border-hi: #3a3a3c;
    --text: #f5f5f7; --text-soft: #98989d; --text-muted: #636366;
    --accent: #2997ff; --accent-bg: #1a2d4a;
    --dot-draft: #636366; --dot-ready: #f5a623; --dot-posted: #30d158;
    --ready-bg: #2d2410; --ready-text: #f5a623;
    --posted-bg: #11291a; --posted-text: #30d158;
    --shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 2px 8px rgba(0,0,0,0.3);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; user-select: none;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 28px 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { display: flex; align-items: center; margin-bottom: 10px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-left h1 { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; margin: 0; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--bg-surface); font-size: 12px; font-weight: 450; color: var(--text-soft); cursor: pointer; font-family: inherit; letter-spacing: -0.01em; transition: all 0.15s; }
  .chip:hover { border-color: var(--border-hi); color: var(--text); }
  .chip.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .chip svg { width: 14px; height: 14px; stroke: currentColor; }

  /* FLOATING SIDE PANEL (Story + Takes tabs) */
  .side-panel {
    position: fixed; z-index: 1000;
    top: 80px; left: 24px;
    width: 340px; height: 70vh; max-height: 70vh;
    background: var(--bg); border: 0.5px solid var(--border-hi);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1; transform: translateY(0);
  }
  [data-theme="dark"] .side-panel { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .side-panel.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .side-panel.minimized { height: auto !important; }
  .side-panel.minimized .side-body { display: none; }
  .side-panel.minimized .takes-resize-handle { display: none; }
  .side-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 0 0 0; cursor: grab; user-select: none;
    border-bottom: 0.5px solid var(--border); flex-shrink: 0;
  }
  .side-handle:active { cursor: grabbing; }
  .side-handle-actions {
    display: flex; align-items: center; gap: 4px; padding: 9px 14px 9px 0;
  }
  .side-hdr-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; transition: all 0.15s;
  }
  .side-hdr-btn:hover { background: var(--border); color: var(--text); }
  .side-tabs { display: flex; }
  .side-tab {
    padding: 9px 14px; background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
    border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .side-tab:hover { color: var(--text); }
  .side-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .side-body { overflow-y: auto; flex: 1 1 0; min-height: 0; }
  .side-body::-webkit-scrollbar { width: 3px; }
  .side-body::-webkit-scrollbar-track { background: transparent; }
  .side-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .side-body.hidden { display: none; }
  .spine-body {
    overflow-y: auto; padding: 14px 24px; flex: 1;
    font-size: 0.78rem; color: var(--text); line-height: 1.9;
    font-weight: 350; letter-spacing: -0.01em;
  }
  .spine-body::-webkit-scrollbar { width: 3px; }
  .spine-body::-webkit-scrollbar-track { background: transparent; }
  .spine-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .spine-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .spine-body .spine-sentence { display: inline; cursor: pointer; padding: 1px 0; border-bottom: 1px solid transparent; transition: all 0.2s; }
  .spine-body .spine-sentence:hover { color: var(--accent); }
  .spine-body .spine-sentence.highlight { color: var(--text); font-weight: 450; border-bottom-color: var(--accent); }
  .spine-body .spine-sentence.faded { color: var(--text-muted); }
  .spine-sep { color: var(--border-hi); margin: 0 2px; }
  .spine-post-refs { display: inline; margin-left: 4px; }
  .spine-post-ref { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dot-draft); margin: 0 1px; cursor: pointer; vertical-align: middle; transition: all 0.15s; }
  .spine-post-ref.active { background: var(--text); width: 9px; height: 9px; }
  .spine-post-ref:hover { background: var(--accent); }
  .spine-post-ref.ready { background: var(--dot-ready); }
  .spine-post-ref.posted { background: var(--dot-posted); }
  .spine-post-ref.active.ready { background: var(--ready-text); }
  .spine-post-ref.active.posted { background: var(--posted-text); }

  /* FLOATING TIMELINE PANEL (right side) */
  .tl-panel {
    position: fixed; z-index: 999;
    top: 80px; right: 24px;
    width: 260px; max-height: 70vh;
    background: var(--bg); border: 0.5px solid var(--border-hi);
    border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    transition: opacity 0.25s ease, transform 0.25s ease;
    opacity: 1; transform: translateY(0);
  }
  [data-theme="dark"] .tl-panel { box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .tl-panel.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .tl-panel.minimized .tl-body { display: none; }
  .tl-handle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: grab; user-select: none;
    border-bottom: 0.5px solid var(--border); flex-shrink: 0;
    font-size: 10px; color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 500;
  }
  .tl-handle:active { cursor: grabbing; }
  .tl-handle-actions { display: flex; gap: 4px; }
  .tl-hdr-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none;
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; transition: all 0.15s;
  }
  .tl-hdr-btn:hover { background: var(--border); color: var(--text); }
  .tl-body {
    overflow-y: auto; padding: 8px 0; flex: 1;
  }
  .tl-body::-webkit-scrollbar { width: 3px; }
  .tl-body::-webkit-scrollbar-track { background: transparent; }
  .tl-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .tl-body { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .tl-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; cursor: pointer;
    transition: background 0.1s;
    border-left: 2px solid transparent;
  }
  .tl-row:hover { background: var(--bg-subtle); }
  .tl-row.active { background: var(--accent-bg); }
  .tl-row.ready { border-left-color: var(--dot-ready); }
  .tl-row.posted { border-left-color: var(--dot-posted); }
  .tl-row.ready .tl-date { color: var(--ready-text); font-weight: 500; }
  .tl-row.posted .tl-date { color: var(--posted-text); font-weight: 500; }
  .tl-row.ready .tl-act { color: var(--ready-text); opacity: 0.8; }
  .tl-row.posted .tl-act { color: var(--posted-text); opacity: 0.8; }
  .tl-dot {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    border: 0.5px solid var(--border-hi); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 500; color: var(--text-muted);
    transition: all 0.15s;
  }
  .tl-take-count {
    width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-bg); border: 0.5px solid var(--accent);
    color: var(--accent); font-size: 7px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .tl-image-dot {
    font-size: 9px; color: var(--text-muted); flex-shrink: 0;
    opacity: 0.5; line-height: 1;
  }
  .tl-row.active .tl-take-count {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .tl-row.ready .tl-dot { background: var(--ready-bg); border-color: var(--dot-ready); color: var(--ready-text); }
  .tl-row.posted .tl-dot { background: var(--posted-bg); border-color: var(--dot-posted); color: var(--posted-text); }
  .tl-row.active .tl-dot, .tl-row.active.ready .tl-dot, .tl-row.active.posted .tl-dot { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tl-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .tl-date { font-size: 9px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.02em; }
  .tl-act { font-size: 8px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.03em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-row.active .tl-date, .tl-row.active .tl-act { color: var(--text-soft); }
  .tl-row.drag-over { border-top: 2px solid var(--accent); margin-top: -2px; }
  .tl-row.dragging { opacity: 0.4; background: var(--accent-bg); }
  .tl-grip { width: 18px; height: 18px; flex-shrink: 0; cursor: grab; display: none; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; border-radius: 3px; }
  .tl-grip:hover { color: var(--text); background: var(--border); }
  .tl-grip:active { cursor: grabbing; }
  .tl-grip.visible { display: flex; }
  .reorder-mode .tl-row .tl-dot { display: none; }
  .reorder-mode .tl-row .tl-grip { display: flex; }
  .reorder-mode .tl-row { cursor: grab; }
  .tl-hdr-btn.reorder-active { background: var(--accent-bg); color: var(--accent); }

  .tl-divider {
    padding: 4px 14px 2px; font-size: 8px; font-weight: 500;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em;
  }
  .tl-legend {
    display: flex; gap: 10px; padding: 6px 14px 8px;
    border-top: 0.5px solid var(--border); flex-shrink: 0;
  }
  .tl-legend-item { display: flex; align-items: center; gap: 4px; font-size: 8px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.02em; }
  .tl-legend-dot { width: 6px; height: 6px; border-radius: 50%; }
  .tl-legend-dot.l-draft { background: var(--dot-draft); }
  .tl-legend-dot.l-ready { background: var(--dot-ready); }
  .tl-legend-dot.l-posted { background: var(--dot-posted); }

  /* READER */
  .reader-wrap { flex: 1; min-height: 0; overflow: hidden; transition: opacity 0.35s ease; }
  /* CALENDAR VIEW */
  .calendar-wrap { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg-subtle); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: none; flex-direction: column; }
  .calendar-wrap.active { display: flex; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0; }
  .cal-nav { width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; }
  .cal-nav:hover { border-color: var(--border-hi); color: var(--text); }
  .cal-month-label { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
  .cal-today-btn { font-size: 10px; padding: 4px 12px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; font-family: inherit; font-weight: 450; letter-spacing: -0.01em; transition: all 0.15s; }
  .cal-today-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; flex-shrink: 0; }
  .cal-weekdays span { text-align: center; font-size: 9px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; flex: 1; min-height: 0; overflow-y: auto; align-content: start; }
  .cal-day { min-height: 80px; border-radius: 6px; padding: 4px; border: 0.5px solid transparent; background: rgba(128,128,128,0.03); transition: all 0.15s; position: relative; }
  .cal-day:hover { background: rgba(128,128,128,0.06); }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.other-month { opacity: 0.25; }
  .cal-day-num { font-size: 10px; font-weight: 500; color: var(--text-muted); margin-bottom: 2px; }
  .cal-day.today .cal-day-num { color: var(--accent); font-weight: 600; }
  .cal-post { font-size: 8px; padding: 2px 6px; border-radius: 4px; margin-bottom: 1px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; letter-spacing: -0.01em; transition: all 0.12s; display: flex; align-items: center; gap: 3px; }
  .cal-post:hover { filter: brightness(0.9); }
  .cal-post.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cal-post-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .cal-post-dot.draft { background: var(--dot-draft); }
  .cal-post-dot.ready { background: var(--dot-ready); }
  .cal-post-dot.posted { background: var(--dot-posted); }
  .cal-post-li { background: rgba(0,113,227,0.12); color: var(--accent); }
  .cal-post-fb { background: rgba(66,103,178,0.12); color: #4267B2; }
  .cal-post-ig { background: rgba(225,48,108,0.12); color: #E1306C; }
  [data-theme="dark"] .cal-post-li { background: rgba(41,151,255,0.15); }
  [data-theme="dark"] .cal-post-fb { background: rgba(66,103,178,0.2); }
  [data-theme="dark"] .cal-post-ig { background: rgba(225,48,108,0.2); }
  .cal-expand { margin-top: 12px; padding: 14px 16px; background: var(--bg-surface); border-radius: 10px; border: 0.5px solid var(--border); display: none; flex-shrink: 0; max-height: 50%; overflow-y: auto; }
  .cal-expand.active { display: block; }
  .cal-expand-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-expand-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .cal-expand-close { width: 24px; height: 24px; border-radius: 50%; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
  .cal-expand-close:hover { border-color: var(--border-hi); color: var(--text); }
  .cal-expand-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cal-expand-date { font-size: 10px; color: var(--text-muted); }
  .cal-expand-media { margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 0.5px solid var(--border); max-height: 200px; }
  .cal-expand-media img, .cal-expand-media video { width: 100%; max-height: 200px; object-fit: contain; display: block; }
  
  .cal-expand-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 0.5px solid var(--border); }
  .cal-status-btn { font-size: 9px; padding: 3px 10px; border-radius: 14px; border: 0.5px solid var(--border); background: var(--bg-surface); color: var(--text-muted); cursor: pointer; font-family: inherit; font-weight: 500; letter-spacing: -0.01em; transition: all 0.15s; }
  .cal-status-btn:hover { border-color: var(--border-hi); color: var(--text); }
  .cal-status-btn.s-ready { background: var(--ready-bg); border-color: var(--dot-ready); color: var(--ready-text); }
  .cal-status-btn.s-posted { background: var(--posted-bg); border-color: var(--dot-posted); color: var(--posted-text); }
  .cal-status-btn.active-ready { background: var(--ready-bg); border-color: var(--dot-ready); color: var(--ready-text); font-weight: 600; }
  .cal-status-btn.active-posted { background: var(--posted-bg); border-color: var(--dot-posted); color: var(--posted-text); font-weight: 600; }
  .cal-li-badge { font-size: 8px; padding: 2px 6px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; letter-spacing: 0.04em; margin-left: auto; }

.cal-expand-body { font-size: var(--fs-reader); line-height: 1.8; color: var(--text); white-space: pre-wrap; font-weight: 420; letter-spacing: -0.01em; }
  .cal-legend { display: flex; gap: 14px; padding-top: 8px; margin-top: 8px; border-top: 0.5px solid var(--border); flex-shrink: 0; }
  .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 8px; color: var(--text-muted); font-weight: 450; letter-spacing: 0.02em; }
  .cal-legend-swatch { width: 10px; height: 6px; border-radius: 2px; }

  .reader-wrap.collapsed { opacity: 0; flex: 0; min-height: 0; }
  .reader { background: var(--bg-subtle); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .reader-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .reader-video { margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 0.5px solid var(--border); flex-shrink: 0; background: #000; }
  .reader-video-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-surface); cursor: pointer; user-select: none; border-bottom: 0.5px solid var(--border); }
  .reader-video-bar:hover { background: var(--bg-subtle); }
  .reader-video-body { background: #000; transition: max-height 0.3s ease, opacity 0.25s ease; max-height: 340px; opacity: 1; overflow: hidden; }
  .reader-video.collapsed .reader-video-body { max-height: 0; opacity: 0; }
  .reader-video video { display: block; width: 100%; max-height: 320px; object-fit: contain; }
  .reader-image { margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 0.5px solid var(--border); flex-shrink: 0; }
  .reader-image-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--bg-surface); cursor: pointer; user-select: none; border-bottom: 0.5px solid var(--border); }
  .reader-image-bar:hover { background: var(--bg-subtle); }
  .reader-image-label { font-size: 10px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .reader-image-name { font-size: 11px; color: var(--text-soft); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reader-image-toggle { font-size: 14px; color: var(--text-muted); width: 18px; text-align: center; line-height: 1; }
  .reader-image-body { background: var(--bg-subtle); transition: max-height 0.3s ease, opacity 0.25s ease; max-height: 420px; opacity: 1; overflow: hidden; }
  .reader-image.collapsed .reader-image-body { max-height: 0; opacity: 0; }
  .reader-image img { display: block; width: 100%; max-height: 420px; object-fit: contain; }
  .reader-image.drop-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 20px rgba(0,113,227,0.25); }
  [data-theme="dark"] .reader-image.drop-over { box-shadow: 0 0 0 2px var(--accent), 0 0 20px rgba(41,151,255,0.3); }
  .image-drop-hint { 
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,113,227,0.08); pointer-events: none;

<div class="app">

const spine = [

/* ── POSTS ── Each post hangs from a spine sentence (spineIdx, 0-based) ── */
const posts = [
  { date:"Wed Jul 1", act:"Two worlds", spineIdx:0, spine:"I grew up in two worlds that both knew how to make someone good at something.",image:"img-case-library.png", body:"I grew up in two worlds that both knew how to make someone good at something.

In visual arts, you had a sandbox. You made something ugly, looked at it, and made it again. Fast. And in apprenticeship, you had a master standing next to you, his process visible right before you. You see him failing, correcting it in real time. There is something in a human that triggers when it sees a thought being worked out.

Both worlds gave you the same thing. Real time feedback. A room where being wrong was just the next step.

Then I walked into medicine and thought, how hard can it be, right? Oh boy was I wrong." },
  { date:"Thu Jul 2", act:"The Build: Character Design", spineIdx:12, spine:"So I built the room.",image:"albino-male-freckles-GAME-SCENE.png", body:"Say hello to our next patient.

We didn't plan for freckles this specific, or eyes this pale. But once we saw the render, we couldn't unsee it. There is something about a face that unusual. It makes you stop scrolling and want to know his name before you know his diagnosis.

That is the whole bet behind character design here. Get the face right, and the curiosity does the work a paragraph of vitals never could.

We are still learning how far a face can carry a case before the physiology has to take over. So far, pretty far." },
  { date:"Fri Jul 3", act:"The Build: Childhood Wonder", spineIdx:0, spine:"I grew up in two worlds that both knew how to make someone good at something.",video:"vid-bladder-enuresis-logo.mp4", body:"By the time I was six, my dad ran an NGO and had just received a shipment of books. Forty-two stacks from a library in Utah, if I remember correctly.

I remember going through a lot of them, but two subjects naturally drew me in: sports illustration and human biology. The books cracked the world wide open. Science became a secret passage for me. Now I could peek into the human body. My mind would light up. Everything seemed clearly by design. I marveled at the hidden machinery behind everything. 

A few years later, I found myself absorbed in stories about organs, from cows to humans. As I tried to sketch them, I spent hours imagining what a real heart looked like. Back then, I could only manage to draw its most basic shapes.

That led me on a journey into medical school.

Fast forward to today: the tools make it possible to actually hold one, a heart. You turn it over in your hands. Watch light catch on the tissue—tissue that looks wet and very real.

And the funny thing is, you can even ask the organ questions about the way it acts, just like I used to ask the page back in the day.

You know what? It shouldn’t always be about disease. At times, it should just be wonder: a kid holding a heart, realizing his own is quietly doing the same thing right now, this very second, without him ever having to think about it.

That’s the feeling I’m still chasing. The kind that filled my imagination with awe.

And the six-year-old digging through those 42 sets of books...? He would lose his mind over this!" },
  { date:"Mon Jul 6", act:"Routinization", spineIdx:5, spine:"Everything was routinized. Memorize this pathway.",image:"img-lab-card.png", body:"Everything was routinized.

Memorize this pathway. Pass this exam. Carry it in your head and prove you can recite it under pressure. The world calling that brilliance.

And I did it. I was good at it. I could recite the differential for pulmonary edema in my sleep. Cardiomyopathy. Fluid overload. The failing pump. Every step in the right order.

But reciting a pathway and walking it on a real person in a real room are two completely different things. Nobody told me that. Or maybe they did and I did not understand what they meant until I was standing at a bedside and the pathway felt very far away.

So I kept passing exams until I did not want to anymore.

If I am really going to treat a human being, should I not spend more time understanding than memorizing?" },
  { date:"Tue Jul 7", act:"The freeze", spineIdx:6, spine:"There is a specific kind of freeze. It is not the freeze of not knowing.",image:"img-deteriorating.png", body:"There is a specific kind of freeze.
It is the freeze of knowing everything and still not being able to move.
I remember the bedside. Crackles on auscultation. The pathway was right there. Cardiomyopathy. Pulmonary edema. The fluid, the failing pump, the reason the lungs were filling. I had read it. I had memorized every step.

But I had never walked it on a real person before.
There is something that happens in that gap. Between what you know and what your hands are willing to do. The knowledge sits in your head. The patient is in front of you. And there is this terrible distance between the two.

If I had seen that case ten times before in a simulation, it would have been easy. The hands would have known. But I had not. So I froze.
Because knowing the words was not the same as knowing the person in front of me.

Nobody tells you that gap exists until you are standing in it.
I did not have a name for it yet." },
  { date:"Wed Jul 8", act:"The master", spineIdx:2, spine:"Caleb solved the problem in his mind before his hands ever touched anything.",image:"elder-silver-curls-CHARACTER-MAP.png", body:"His name is Caleb Oppong. Master artisan. He taught me everything I know about making things.

And here is what I noticed about him. He never rushed to the work. He would stand and look at the problem for a long time. Turning it over in his mind. Running through it. And then when he sat down, he moved with conviction. Every cut, every join, every decision had already been made before his hands touched anything.

That is what mastery looks like from the outside. Not speed. Clarity.

When you have seen something enough times, in your hands and in your mind, the decision is already made before the moment arrives. You are not figuring it out. You are executing what you already know.

I watched him and I understood something. Mastery is not talent. It is accumulated reps." },
  { date:"Thu Jul 9", act:"Real time feedback", spineIdx:3, spine:"There is something in a human that triggers when it sees a thought being worked out.",image:"img-attending-teaches.png", body:"There is something in a human that triggers when it sees a thought being worked out in real time.

Not explained. Worked out. The difference matters.

When Caleb was solving a problem in front of me, I was not just watching his hands. I was watching his mind. Where he paused. What he reconsidered. The moment he saw something I had not seen yet.

That is a different kind of learning. Not information transfer. Pattern recognition at a level you cannot get from a page.

You absorb it without knowing you are absorbing it. And then one day your hands know something your mouth cannot explain.

That is what real time feedback does. It builds something in you that memorization cannot reach." },
  { date:"Fri Jul 10", act:"Walking in", spineIdx:4, spine:"Then I walked into medicine.",image:"img-patient-found.png", body:"Then I walked into medicine.

And I assumed it would work the same way. You learn the craft. You find your master. You put in the reps. You get good.

But medicine is not built like that.

Medicine is built on a different assumption. That if you know enough, you will perform enough. That knowledge and execution are the same thing. That a pathway memorized is a pathway walked.

I believed that for longer than I should have.

The first time a real patient was in front of me, I found out it was not true." },
  { date:"Mon Jul 13", act:"Imposter syndrome", spineIdx:7, spine:"For years I thought that was imposter syndrome. In visual arts I had none.",image:"img-psych-anxiety.png", body:"For years I thought that was imposter syndrome.

I carried it like it was a character flaw. The hesitation. The second-guessing. The gap between what I knew and what I could do in the room.

But here is the thing. In visual arts I had no imposter syndrome. None. I made ugly things and fixed them and made better things and that was just the process. I never felt like a fraud because I was always in the work.

In medicine I felt like a fraud constantly.

And for a long time I blamed myself for that difference.

But the difference was not me. The difference was the sandbox. In art I had one. In medicine I did not. And you cannot build confidence in a space that never lets you fail safely.

The imposter syndrome was just the absence of reps wearing a psychological costume." },
  { date:"Tue Jul 14", act:"Ordering tests", spineIdx:8, spine:"I caught myself ordering tests because a textbook told me to.",image:"img-command-ui-open.png", body:"I caught myself one day ordering tests because a textbook told me to.

Not because I had thought it through. Not because I had looked at the patient and the numbers and the story and come to a decision. Because the pathway said: next step, order this.

And I was following the pathway like a checklist. Not like a physician.

Caleb never worked from a checklist. He worked from understanding. He knew why every step existed and so he could adapt when the problem did not follow the script.

I was not doing that. I was executing instructions I did not fully own.

That scared me more than the freezing did. Because at least when I froze I knew something was wrong. This felt like competence and it was not." },
  { date:"Wed Jul 15", act:"Defensive medicine", spineIdx:9, spine:"The system was outputting decent, well-behaved people practising defensive medicine.",image:"img-sore-throat.png", body:"The system was outputting decent, well-behaved people practising defensive medicine.

Careful. Cautious. Technically correct. Ordered the right tests. Followed the right protocols. Never too far from the guideline.

And I understood why. When you have never had a sandbox, caution is the only tool you have. You do not trust your hands because your hands have never been tested. So you order more. You consult more. You hedge more.

But this is a human life.

Not a board exam. Not a performance review. A person in a room who needs someone to think clearly and move with conviction.

Defensive medicine keeps you safe. It does not always keep the patient safe.

I did not want to be careful in the wrong way anymore." },
  { date:"Thu Jul 16", act:"The missing link", spineIdx:10, spine:"Medicine never had a sandbox.",image:"img-lab-scene.png", body:"Medicine never had a sandbox.

Every other craft that produces mastery has one. Artists have sketchbooks. Musicians have practice rooms. Pilots have simulators. Athletes have training grounds where the consequence of a mistake is a lost rep, not a lost life.

Medicine has textbooks and then a real patient.

That gap is not a gap in knowledge. It is a gap in reps. And you cannot close a reps gap by reading more. You close it by doing more. In a space where the doing is safe.

That room just was not there.

And once I saw that clearly, I could not look away from it. Because the implications were enormous. Every doctor who ever froze at a bedside. Every hesitation that cost someone something. Traced back to the same missing thing.

The sandbox that nobody built." },
  { date:"Fri Jul 17", act:"Cannot ignore it", spineIdx:11, spine:"Once I saw that, I could not ignore it.",image:"img-attending-brief.png", body:"Once I saw that, I could not ignore it.

Not because I am particularly noble. But because I had lived on both sides of it. I knew what learning felt like when the feedback was real and immediate and safe. And I knew what it felt like when it was not.

And the difference was not small. The difference was the difference between moving with conviction and moving with fear.

Mastery comes from doing. From failing and trying again, fast, in a space that can hold the failure. That is not a philosophy. That is just how humans learn things. It is how Caleb learned. It is how I learned to draw. It is how pilots learn to land.

Medicine had decided it was exempt from that rule.

It is not." },
  { date:"Mon Jul 20", act:"Building the room", spineIdx:12, spine:"So I built the room.",image:"img-pipe-tweed-mustache.png", body:"So I built the room.

Not a question bank. Not a flashcard app. Not another way to memorize pathways.

A room. With a patient in it. A real case, a real history, real numbers on a real monitor. And a clock that moves whether you are ready or not. Because in medicine the clock always moves.

You walk in. You talk to the patient. You order the labs. You read what comes back. You treat what you find. And an AI attending teaches you while you work, using the actual numbers in front of you.

Not a textbook case. This case. This patient. This potassium of 6.2 at this moment in this presentation.

And if you get it wrong, something happens. The pressure keeps falling. The rhythm changes. The physiology responds the way real physiology does.

Because consequences are the teacher. And this room can hold them." },
  { date:"Tue Jul 21", act:"The Build: Patient Characters", spineIdx:12, spine:"So I built the room.",image:"elder-silver-curls-CHARACTER-MAP.png", body:"Meet one of our patients.

We built her from four angles, so she looks like the same woman whether you're standing across the room from her or leaning in to check her pupils.

This is the part nobody sees when they think about medical simulation. Before the vitals move, before the case even starts, someone has to build the person.

We wanted our patients to feel real before you've done a single thing to them. The silver curls. The lines around her eyes. The blue gown that says she's already been admitted, already waiting on you.

Consistency is the hard part. Get the face slightly wrong from one angle to the next and the whole illusion breaks. So every patient in Immersa gets mapped like this first. Front, three quarter, profile, close. Locked before she ever enters a scene.

Then the physiology takes over. Her vitals move the way real biology moves. Her face stays exactly who she is.

This is the sandbox. Built one patient at a time." },
  { date:"Wed Jul 22", act:"The sandbox", spineIdx:1, spine:"In visual arts, you had a sandbox.",image:"img-command-ui-bedside.png", body:"In visual arts, you had a sandbox.

You did not wait until you were ready. You made something. You looked at it. You made it again. The feedback was immediate and the stakes were low and that is exactly how you got good.

I drew the same hand hundreds of times before anyone depended on it. Each attempt was just information. Wrong proportions. Fix it. Wrong shadow. Fix it. The wrongness was the lesson.

Nobody handed me a textbook about hands. They handed me paper and said go.

That is how mastery works. Not in the knowing. In the doing it again." },
  { date:"Thu Jul 23", act:"What the room looks like", spineIdx:13, spine:"You do not choose a topic. You choose a patient.",image:"img-case-library-full.png", body:"You do not choose a topic. You choose a patient.

Tom Hayes is in the resuscitation bay. Sarah Mensah is three days post-op and her numbers are moving in the wrong direction. An elderly man comes in with a sore throat that is not a sore throat.

You walk in. You work the case. Emergency, ICU, ward. Timed cases that move whether you are ready or not.

And the library does not run out. Because that is the other thing about reps. You need volume. You need to see cardiomyopathy presenting as crackles enough times that your hands know before your mind catches up. You need to see the sore throat that is an airway closing. You need to have been in that room before the day it matters.

This is that room. Before the day it matters." },
  { date:"Fri Jul 24", act:"The Build: DKA", spineIdx:12, spine:"So I built the room.",video:"HHS_DKA.mp4", body:"I needed a first case. Something that tests whether the room actually works.

Yaw Boateng is 22. No medical history. She walks into the ER with abdominal pain, vomiting for two days, and she cannot stay awake. The point-of-care glucose reads north of 600.

Her pancreas has stopped making insulin.

In DKA, the body turns to fat for fuel because glucose cannot enter the cells. The fat breaks down into ketones. The ketones make the blood acidic. The kidneys try to compensate but cannot keep up. The breathing gets deep and fast. The mucous membranes go dry. And the abdominal pain — classic DKA presentation — mimics an acute surgical abdomen so well that inexperienced clinicians order CT scans instead of insulin.

I built this case as a timed room. The glucose is high. The anion gap is open. The potassium is borderline. And the clock is ticking.

The video below is the visual metaphor. A pancreas that should be pouring out insulin but produces nothing. You stroke it. You wait. Nothing comes out.

Because in DKA, the organ is present but silent.

This is the first case in the room. Real physiology. Real consequences. No textbook chapter." },
  { date:"Mon Jul 27", act:"The attending", spineIdx:14, spine:"An AI attending teaches while you work, using the actual numbers in front of you.",image:"img-attending-reads-labs.png", body:"An AI attending teaches while you work, using the actual numbers in front of you.

Not a textbook paragraph. Not a generic explanation of what pulmonary edema is. It reads this patient's vitals, this patient's results, what you have already ordered, and it teaches from there.

Why is she still hypotensive after fluids? It looks at the pressure that will not budge and walks you to the answer. The vessels are open. She needs tone, not more volume.

It remembers what you asked five minutes ago. It teaches the case in front of you, not a generic one.

Caleb never taught me from a manual. He taught me from the problem we were both looking at. That is the difference. The teaching that sticks is always attached to something real." },
  { date:"Tue Jul 28", act:"The Build: Case 113 — Drowning", spineIdx:14, spine:"An AI attending teaches while you work, using the actual numbers in front of you.",image:"case-113-drowning-attending-dialog.png", body:"I told the attending I wasn’t convinced.

Case 113. Drowning. The base excess number didn’t sit right with me, so I pushed back and asked for real data.

It pulled a 2015 review of 47 drowning cases. Mean lactate, 2.8. Mean base excess, negative 12.4. Then it walked me through why the deficit comes from the stress response, the hypoperfusion, the cold hitting the body all at once.

That is the moment it landed.

In a real hospital, you learn a tone before you ever open your mouth to your attending. Pushing back twice can feel like a risk to your standing in the room.

So what happens when that risk disappears?

You just ask. Again and again, until you actually understand it. No performance. No managing how it sounds.

The attending is not pulling from one person’s memory of one paper read years ago in residency. It is pulling from every case study, every review, all at once.

That is why we built it this way. The gap between not knowing and finding out should cost you nothing." },
  { date:"Wed Jul 29", act:"The Build: Teaching", spineIdx:14, spine:"An AI attending teaches while you work, using the actual numbers in front of you.",image:"img-ngavu-yellow-party.png", body:"The AI attending does not just explain DKA. It explains Yaw Boateng’s DKA.

Her glucose is 642. Her sodium is 134. Her potassium is 4.8. Her anion gap is 28.

The attending reads the numbers in front of you and teaches from there:

First — fluids. She is profoundly dehydrated. Normal saline, wide open. The fluid alone will bring her glucose down before a single unit of insulin.

Then — potassium. Check it before the insulin goes in, because insulin drives potassium into cells and if her K drops below 3.5 on the drip she could arrest. Her K is 4.8 now. That is safe. Start the insulin.

Then — watch the anion gap. Do not watch the glucose. The glucose will normalize before the gap closes. If you stop the insulin when the glucose hits 200, the ketosis continues and she drifts back into acidosis. The gap is the true marker of resolution.

The attending does not lecture on DKA. It teaches the patient in front of you. The potassium of 4.8. The gap of 28. The decision to hold dextrose until she crosses 250.

Caleb never taught from a manual. The AI attending never teaches from a textbook. It teaches from the numbers that are actually on your screen.

And it remembers what you asked three minutes ago." },
  { date:"Thu Jul 30", act:"The Build: Collapse Orders", spineIdx:15, spine:"Get it wrong and the patient gets worse. On purpose.",image:"img-collapse-orders.png", body:"I almost drowned my own interface.

Every order you could possibly place sitting on screen at once. Echo, troponin, ANA, TSH, twelve lead, physical exam by region, all of it stacked on top of a man lying in a bed who just wants someone to figure out what’s wrong with him.

It looked thorough. It felt like chaos.

Nobody learns anything staring at forty labels at once. You don’t memorize a wall. You get lost in it, and your brain shuts the whole thing out to protect itself.

So now you can collapse it. Hide a category once you’ve cleared it. Let the ones that matter right now stay in front of you, and let the rest wait their turn.

The point was never to show you everything medicine has. The point is to show you what this patient needs, in the order a real clinician would ask for it.

That’s the difference between a wall of information and a room you can actually think in." },
  { date:"Fri Jul 31", act:"Getting it wrong", spineIdx:15, spine:"Get it wrong and the patient gets worse. On purpose.",image:"img-hijab-albino-freckles.png", body:"Get it wrong and the patient gets worse. On purpose.

In most medical education, a wrong answer turns red and you move on. Nothing happens to anyone. The stakes are always zero.

But zero stakes produce zero learning at the level that matters.

Here, something happens. Miss the bleed and the pressure keeps falling. Push the wrong drug and the rhythm changes. The physiology responds the way biology says it must.

And you remember it. Not because someone told you it was wrong. Because you watched it cost something.

That is how Caleb taught me. Not by correcting my mistakes from a distance. By letting me see what the mistake produced. The joint that did not hold. The line that was not true. The consequence was the lesson.

The room that can hold your failures is the room where you actually learn." },
  { date:"Mon Aug 3", act:"The Build: What Wrong Looks Like", spineIdx:15, spine:"Get it wrong and the patient gets worse. On purpose.",image:"img-vitiligo-wink.png", body:"Here is what happens when you miss DKA.

You see abdominal pain. You order a CT abdomen with contrast. The patient waits. The glucose stays in the 600s. The ketones keep rising. The gap widens. By the time the CT comes back negative, she is four hours deeper into acidosis.

Or you see the leukocytosis and start antibiotics. DKA causes leukocytosis from catecholamine release and dehydration — not infection. The white count does not mean sepsis. It means her body is stressed. You just bought an infectious workup for a metabolic problem.

Or you give dextrose. Glucose is 600 but the protocol says D5 for all. And you watch the numbers climb.

The room does not stop you from making these calls. It lets you make them. And then it shows you what the physiology does in response.

That is the difference between a question bank and a sandbox. A question bank tells you you are wrong. A sandbox lets you watch the consequence unfold and live inside it long enough to feel it.

The first time I ran Yaw’s case and gave dextrose before checking potassium, I watched the ECG flatten on the monitor. I knew the physiology. But knowing it and watching it are not the same thing.

That is the room. Not safe in the way a textbook is safe. Safe in the way a simulator is safe. You feel the cost without paying it." },
  { date:"Tue Aug 4", act:"Both audiences", spineIdx:16, spine:"A 13 year old and a physician can walk the same case. Both should learn something.",image:"img-deep-black-youth.png", body:"A 13 year old and a physician can walk the same case. Both should learn something.

That is my test for whether the teaching is right.

If the only way to learn is to already have the vocabulary, it is not teaching. It is gatekeeping. And medicine has enough of that already.

The body is not a secret. It is a system. And any person willing to walk through a case and pay attention should be able to follow what is happening and why.

The AI attending reads the room. Sometimes you need one line. Sometimes the whole mechanism. You choose how deep to go. The teaching meets you where you are.

That is what Caleb did. He did not speak above me. He spoke to where my hands were. And he let the problem do most of the teaching." },
  { date:"Wed Aug 5", act:"The physiology decides", spineIdx:17, spine:"The AI explains. The physiology decides.",image:"img-lab-scene.png", body:"The most important rule in the engine. The AI never decides whether the potassium rose.

The physiology decides. Vitals, electrolytes, the ECG stage, all follow explicit rules written into the case. Give the wrong treatment and the numbers move the way biology says they must. Not the way a language model thinks they should.

The AI's job is to explain, not to invent. It reads what the engine produced and teaches the mechanism behind it.

That line matters more than anything else in the build. It is the difference between a tutor you can trust and a tool that will confidently make something up.

In a sandbox for medicine, the medicine has to be real. The story can flex. The physiology cannot." },
  { date:"Thu Aug 6", act:"The Build: Visual Anatomy", spineIdx:17, spine:"The AI explains. The physiology decides.",image:"img-anatomy-back.png", body:"You’re looking at his spine right now.

Not because you memorized where it sits. Because the image showed you, and your brain just took it.

That’s the whole bet behind this.

Nobody watches a football match and memorizes the plays. You watch, and your brain figures out the pattern on its own. Nobody rewinds a good movie to repeat a scene until it sticks. You just watch it. You just are in it.

Medical education forgot this for a long time. Flashcards. Repetition. Force the fact into your head until it stays.

We wanted something different.

Show the spine under the skin. Show the ribs holding the shape of a real back. Let the eyes do what they already know how to do.

You don’t have to try to remember this image. You already won’t forget it." },
  { date:"Fri Aug 7", act:"The Build: Case 15 — Inheritance", spineIdx:17, spine:"The AI explains. The physiology decides.",image:"img-case15-inheritance.png", body:"He felt a sharp jab in his chest. He had never felt anything like it before.

Then he remembered his grandfather, years ago, doubled over in the exact same spot. Nobody in the room called it what it was. Not until it was too late.

Now it is his turn.

That is the story behind Case 15. Not a diagnosis waiting to be memorized. A man who inherited a body, and everything that body carries, without ever reading the instructions.

The human body is not a mystery. It is a pattern. His grandfather’s chest was writing this chapter thirty years before his own ever would.

We built the case so you learn to read that pattern before it belongs to someone real. Before it is your grandfather. Before it is you." },
  { date:"Mon Aug 10", act:"What I am documenting", spineIdx:18, spine:"I am documenting how I think, not just what I built.",image:"img-subway-dandy.png", body:"I am documenting how I think, not just what I built.

Anyone can inherit a product. Few inherit the reasoning behind it. Why cases instead of flashcards. Why the physiology is fixed and the teaching is flexible. Why the patient is allowed to get worse.

Caleb never just showed me the finished piece. He showed me why every decision was made. The joint, the angle, the grain of the wood. The thinking behind the hands.

That is what I want to pass on. Not the tool. The understanding of why the tool is built this way and not another way.

Because the next person who builds something like this should not have to start from zero. They should be able to start from here." },
  { date:"Tue Aug 11", act:"What the next doctor deserves", spineIdx:19, spine:"I trained to memorize. I am building so the next doctor does not have to.",image:"img-case-library-full.png", body:"I trained to memorize. I am building so the next doctor does not have to.

Not because memorization is worthless. But because it is not enough. It was never enough. And we have been pretending it was for long enough.

The next doctor deserves a sandbox. A room where they can freeze and recover and freeze again until they stop freezing. A master in the room while they work. Real feedback from a real case before a real life is on the line.

That room exists now.

I grew up in two worlds that both knew how to make someone good at something. I spent years in a third world that did not.

So I built what was missing.

You understand the body. You do not memorize it." },
  { date:"Wed Aug 12", act:"The Build: The Inch", spineIdx:19, spine:"I trained to memorize. I am building so the next doctor does not have to.",image:"img-pipe-tweed-mustache.png", body:"I don’t think I’ve found the best way to do this.

I stand on the shoulders of people who went ahead of me. William Morton spent years testing ether before anyone trusted it in an operating room. Someone else isolated insulin from a pig’s pancreas so a diabetic child could live past age twelve. None of them started with the whole answer. They started with one piece, and they moved it an inch further than the person before them.

That’s all I’m trying to do.

I went through medical education the way it’s always been taught. Memorize, recite, repeat. Somewhere in that process I saw the gap. Not the finish line. Just the next inch.

So we built a sandbox where the body responds the way it actually responds, and the lesson comes from watching it happen instead of being told about it.

It’s not the best version of medical education that will ever exist. It’s my inch." },
];

const statuses = {};
let current = 0;
let readerOpen = true;
let dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
let fontSize = 17;
let collapsedImages = {}; // per-post image collapse state
let collapsedVideos = {}; // per-post video collapse state
let readMode = "original"; // "original" | "spoken"

function g(id) { return document.getElementById(id); }
function getStatus(i) { return statuses[i] || "draft"; }
function cAct(p) { return dark ? actColorsD[p.act] : actColors[p.act]; }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── FONT SIZE ── */
function applyFontSize() {
  const rb = g("r-body");
  if (rb) rb.style.fontSize = fontSize + "px";
  g("fs-val").textContent = fontSize;
  try { localStorage.setItem("arc-viz-fontSize", fontSize); } catch(e) {}
}
function changeFontSize(d) {
  fontSize = Math.max(12, Math.min(28, fontSize + d * 2));
  applyFontSize();
}

/* ── UMBRELLA ── */
function renderUmbrella() {
  const el = g("umbrella");
  const postRefsBySpine = spine.map(() => []);
  posts.forEach((p, i) => { if (p.spineIdx != null && p.spineIdx < spine.length) postRefsBySpine[p.spineIdx].push(i); });

  let html = "";
  for (let i = 0; i < spine.length; i++) {
    const isActive = postRefsBySpine[i].includes(current);
    const fadeClass = postRefsBySpine[i].length === 0 ? " faded" : "";
    const hlClass = isActive ? " highlight" : "";
    html += `<span class="spine-sentence${hlClass}${fadeClass}" data-si="${i}" onclick="goToSpine(${i})">${esc(spine[i])}</span>`;
    if (postRefsBySpine[i].length > 0) {
      html += `<span class="spine-post-refs">`;
      postRefsBySpine[i].forEach(pi => {
        const st = getStatus(pi);
        html += `<span class="spine-post-ref ${st}${pi===current?' active':''}" data-pi="${pi}" onclick="event.stopPropagation();goTo(${pi})" title="Post ${pi+1} · ${st}"></span>`;
      });
      html += `</span>`;
    }
    if (i < spine.length - 1) html += ` `;
  }
  el.innerHTML = html;
}

/* ── TIMELINE ── */
function renderTimeline() {
  const el = g("tl-body");
  let html = "";
  let lastAct = null;
  posts.forEach((p, i) => {
    if (p.act !== lastAct) {
      html += '<div class="tl-divider">' + p.act + '</div>';
      lastAct = p.act;
    }
    const st = getStatus(i);
    const activeClass = i === current ? " active" : "";
    const takeCount = (speechTakes[i] && speechTakes[i].length) || 0;
    const countHtml = takeCount > 0 ? '<span class="tl-take-count">' + takeCount + '</span>' : "";
    const imageHtml = p.image ? '<span class="tl-image-dot" title="Has image">◻</span>' : "";
    const videoHtml = p.video ? '<span class="tl-image-dot" title="Has video">▶</span>' : "";
    html += '<div class="tl-row ' + st + activeClass + '" draggable="' + String(reorderMode) + '" data-idx="' + i + '">';
    html += '<div class="tl-grip visible" title="Drag to reorder">☰</div>';
    html += '<div class="tl-dot">' + (i + 1) + '</div>';
    html += '<div class="tl-info">';
    html += '<span class="tl-date">' + p.date + '</span>';
    html += '<span class="tl-act">' + p.act + '</span>';
    html += '</div>';
    html += imageHtml + videoHtml + countHtml;
    html += '</div>';
  });
  el.innerHTML = html;

  // Attach drag handlers
  if (reorderMode) {
    el.querySelectorAll(".tl-row").forEach(function(row) {
      var idx = parseInt(row.getAttribute("data-idx"));
      row.addEventListener("dragstart", function(e) { handleDragStart(e, idx); });
      row.addEventListener("dragend", handleDragEnd);
      row.addEventListener("dragover", handleDragOver);
      row.addEventListener("dragleave", handleDragLeave);
      row.addEventListener("drop", function(e) { handleDrop(e, idx); });
    });
  } else {
    // Normal click-to-navigate
    el.querySelectorAll(".tl-row").forEach(function(row) {
      var idx = parseInt(row.getAttribute("data-idx"));
      row.addEventListener("click", function() { goTo(idx); });
    });
    // Keep grip hidden
    el.querySelectorAll(".tl-grip").forEach(function(g) { g.classList.remove("visible"); });
  }

  // scroll active into view
  const activeRow = el.querySelector(".tl-row.active");
  if (activeRow) activeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function renderActBand() {} // no-op, act labels inline now

/* ── READER ── */
function renderReader() {
  const p = posts[current];
  const st = getStatus(current);
  const badge = g("r-act");
  badge.textContent = p.act;
  badge.style.background = cAct(p);
  badge.style.color = dark ? actColors[p.act] : actTexts[p.act];
  
  if (p.spineIdx != null && p.spineIdx < spine.length) {
    g("r-spine-context").textContent = `Spine · sentence ${p.spineIdx + 1} of ${spine.length}`;
  } else {
    g("r-spine-context").textContent = "";
  }

  // video embed
  const videoEl = g("r-video");
  const videoPlayer = g("r-video-player");
  const videoName = g("r-video-name");
  const videoToggle = g("r-video-toggle");
  if (p.video) {
    videoPlayer.src = p.video;
    videoPlayer.load();
    videoName.textContent = p.video;
    videoEl.style.display = "";
    if (collapsedVideos[current]) {
      videoEl.classList.add("collapsed");
      if (videoToggle) videoToggle.textContent = "+";
    } else {
      videoEl.classList.remove("collapsed");
      if (videoToggle) videoToggle.textContent = "\u2212";
    }
  } else {
    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoEl.style.display = "none";
  }
  
  // image embed
  const imageEl = g("r-image");
  const imageImg = g("r-image-img");
  const imageName = g("r-image-name");
  const imageToggle = g("r-image-toggle");
  if (p.image) {
    imageImg.src = p.image;
    imageName.textContent = p.image;
    imageEl.style.display = "";
    if (collapsedImages[current]) {
      imageEl.classList.add("collapsed");
      if (imageToggle) imageToggle.textContent = "+";
    } else {
      imageEl.classList.remove("collapsed");
      if (imageToggle) imageToggle.textContent = "\u2212";
    }
  } else {
    imageImg.removeAttribute("src");
    imageEl.style.display = "none";
  }
  
  const selTake = getSelectedTake(current);
  const extraSrcs = fuseSources[current] || [];
  const extraCount = extraSrcs.filter(i => i !== selectedTake[current]).length;
  const totalSrcs = selTake ? 2 + extraCount : 0; // base: original + spoken, plus extras
  const showToggle = !!selTake;
  // Always show the bar — Original tab is always available
  g("read-toggle-bar").style.display = "";

  const isFused = !!(selTake && selTake.type === "fused");
  g("read-toggle-spoken").style.display = (showToggle && !isFused) ? "" : "none";
  g("read-toggle-fused").style.display = isFused ? "" : "none";
  const fuseBtn = g("fuse-btn");
  fuseBtn.style.display = showToggle ? "" : "none";
  fuseBtn.textContent = extraCount > 0 ? `✦ Fuse (${totalSrcs})` : "✦ Fuse";

  // clear all actives
  g("read-toggle-orig").classList.remove("active");
  g("read-toggle-spoken").classList.remove("active");
  g("read-toggle-fused").classList.remove("active");

  if (readMode === "spoken" && selTake) {
    g("r-body").textContent = selTake.transcript;
    (isFused ? g("read-toggle-fused") : g("read-toggle-spoken")).classList.add("active");
  } else {
    g("r-body").textContent = p.body;
    g("read-toggle-orig").classList.add("active");
  }
  
  // LI indicators — one per post, stored as specific take index (not type)
  // Auto-heal stale indices (takes may have been deleted since LI was set)
  if (typeof linkedinReadyTakeIdx[current] === 'number') {
    const takes = speechTakes[current];
    if (!takes || linkedinReadyTakeIdx[current] >= takes.length) {
      delete linkedinReadyTakeIdx[current];
      try { localStorage.setItem("arc-viz-linkedinReadyTakeIdx", JSON.stringify(linkedinReadyTakeIdx)); } catch(e) {}
    }
  }
  const readyIdx = linkedinReadyTakeIdx[current]; // null=original, number=index in speechTakes, undefined=none
  const liSelIdx = selectedTake[current];
  const liTake = (liSelIdx != null && speechTakes[current]) ? speechTakes[current][liSelIdx] : null;
  const liIsFused = !!(liTake && liTake.type === "fused");
  const origInd = g("li-indicator-orig");
  const spokenInd = g("li-indicator-spoken");
  const fusedInd = g("li-indicator-fused");
  if (origInd) {
    origInd.style.display = "";
    origInd.classList.toggle("active", readyIdx === null);
  }
  if (spokenInd) {
    spokenInd.style.display = (liTake && !liIsFused) ? "" : "none";
    spokenInd.classList.toggle("active", (liTake && !liIsFused) ? readyIdx === liSelIdx : false);
  }
  if (fusedInd) {
    fusedInd.style.display = liIsFused ? "" : "none";
    fusedInd.classList.toggle("active", liIsFused ? readyIdx === liSelIdx : false);
  }

  g("post-num").textContent = `${current+1} of ${posts.length}`;
  g("reader").style.borderTop = `3px solid ${cAct(p)}`;

  g("status-group").innerHTML = ["draft","ready","posted"].map(s =>
    `<button class="status-btn ${st===s?"active-"+s:"s-"+s}" onclick="setStatus('${s}')">${s.charAt(0).toUpperCase()+s.slice(1)}</button>`
  ).join("");

  g("prev-btn").onclick = () => navigate(-1);
  g("next-btn").onclick = () => navigate(1);
}
function switchReadMode(mode) { readMode = mode; renderReader(); }

let readerEditing = false;
function copyReaderText() {
  const text = g("r-body").textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = g("reader-copy-btn");
    btn.textContent = "✓";
    btn.style.color = "#22C55E";
    setTimeout(() => { btn.textContent = "⧉"; btn.style.color = ""; }, 1200);
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    const btn = g("reader-copy-btn");
    btn.textContent = "✓"; btn.style.color = "#22C55E";
    setTimeout(() => { btn.textContent = "⧉"; btn.style.color = ""; }, 1200);
  });
}

function setupImageDrop() {
  const dropZone = g("r-image");
  if (!dropZone) return;
  
  dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    e.stopPropagation();

  dropZone.addEventListener("drop", async e => {

      const resp = await fetch("http://127.0.0.1:9801/upload-image", { method: "POST", body: formData });
      const result = await resp.json();
      if (result.ok) {
        posts[current].image = result.path;
        imageImg.src = result.path;
        imageName.textContent = result.name;
        console.log("Image saved:", result.path);
        autoSave();
        renderTimeline();
      } else {
        console.error("Upload failed:", result);
        img.src = oldSrc;
      }
    } catch(err) {
      console.error("Upload error:", err);
      // Keep blob preview even if server save failed
    }
  });
  
  // Also allow drop on the image body when collapsed
  const imgBody = g("r-image-body");
  if (imgBody) {
    imgBody.addEventListener("dragover", e => {

const DEEPSEEK_KEY = "sk-2fc4cc5ed6184f87be8837bc6ad7a3ff";
async function fuseWithLLM() {
  const selTake = getSelectedTake(current);
  if (!selTake || !selTake.transcript) { alert("No spoken take selected. Record or select a take first."); return; }
  const original = posts[current].body;
  const spoken = selTake.transcript;
  if (!original) return;

  // Base pair: original + spoken. Extra sources from fuseSources below.
  const takes = speechTakes[current] || [];
  const extraSrcs = (fuseSources[current] || []).map(i => takes[i]).filter(t => t && t.transcript && t !== selTake);

  const btn = g("fuse-btn");
  btn.disabled = true;
  btn.textContent = "Fusing…";
  btn.classList.add("fusing");

  try {
    let srcBlocks = `ORIGINAL (anchor — all key ideas must survive):\n${original}\n\nSPOKEN (my read):\n${spoken}`;
    if (extraSrcs.length > 0) {
      srcBlocks += "\n\n" + extraSrcs.map((t, j) => `EXTRA SOURCE ${j + 1} (${t.type === "fused" ? "Fusion" : "Take"}):\n${t.transcript}`).join("\n\n");
    }

    const r = await fetch("https://api.deepseek.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${DEEPSEEK_KEY}` },
      body: JSON.stringify({
        model: "deepseek-chat",
        max_tokens: 2000,
        temperature: 0.7,
        messages: [
          { role: "system", content: `You are Steve Oppong's writing assistant. You receive text sources and blend them into one cohesive, natural read that matches his exact voice.

VOICE RULES (non-negotiable):
- Spoken words only. Short sentences. Specific concrete details.
- Additive accumulation. Never use "not X but Y" contrast framing.
- No em dashes. No hedging. No grandstanding. No exclamation marks.
- Plain, direct, unhurried. Earned endings.
- Preserve natural spoken cadence — conjunctions (And, But, Because) at sentence starts.
- No triple repetition. No structural symmetry as a substitute for emotion.
- One idea per sentence. Short words, active voice.
- Strip these words completely: delve, navigate, resonate, meticulous, tapestry, underscores, testament, landscape, commendable, comprehensive, swift.

SOURCES:
The ORIGINAL is the anchor — every key idea, fact, and structural beat must survive.
The SPOKEN transcript is the primary voice source — rewrite entirely in the user's natural cadence and phrasing.
Any EXTRA SOURCEs are additional takes/fusions to draw nuance from.

Your job: merge the best of all sources into a single polished text that reads as if spoken naturally by one person standing at a bedside explaining something to a friend.

Keep the same length and paragraph structure as the original. Return ONLY the fused text — no labels, no commentary, no markdown.` },
          { role: "user", content: `${srcBlocks}\n\nFUSED TEXT:` }
        ]
      })
    });
    if (!r.ok) { const err = await r.text(); throw new Error(err || `DeepSeek error ${r.status}`); }
    const data = await r.json();
    const fusedText = data.choices?.[0]?.message?.content?.trim();
    if (fusedText) {
      if (!speechTakes[current]) speechTakes[current] = [];
      const takeId = "f_" + current + "_" + Date.now();
      const allSrcIndices = [selectedTake[current], ...(fuseSources[current] || []).filter(i => i !== selectedTake[current])];
      const fusedTake = {
        id: takeId,
        type: "fused",
        transcript: fusedText,
        fusedFrom: allSrcIndices,
        duration: 0,
        timestamp: Date.now()
      };
      speechTakes[current].push(fusedTake);
      selectedTake[current] = speechTakes[current].length - 1;
      saveTakesMeta(); saveSelTake();
      readMode = "spoken";
    }
  } catch(e) {
    alert("Fusion failed: " + (e.message || e));
  }
  btn.disabled = false;
  btn.textContent = "✦ Fuse";
  btn.classList.remove("fusing");
  refresh();
}

function calNextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }
function calGoToday() { var now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth(); renderCalendar(); }

function parseDate(dateStr) {
  var parts = dateStr.split(" ");
  if (parts.length !== 3) return null;
  var months = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  var m = months[parts[1]];
  var d = parseInt(parts[2]);
  if (m === undefined || isNaN(d)) return null;
  return new Date(calYear || new Date().getFullYear(), m, d);
}

function renderCalendar() {
  var lbl = document.getElementById("cal-month-label");
  lbl.textContent = new Date(calYear, calMonth).toLocaleString("en", { month: "long", year: "numeric" });

  function dayKey(dd) { return dd.getFullYear() + "-" + ("0"+(dd.getMonth()+1)).slice(-2) + "-" + ("0"+dd.getDate()).slice(-2); }

  var dayMap = {};
  posts.forEach(function(p, idx) {
    var d = parseDate(p.date);
    if (!d) return;
    var ps = (typeof platformStates !== "undefined" && platformStates[idx]) || {};
    var st = (typeof statuses !== "undefined" && statuses[idx]) || "draft";
    var liStatus = ps.linkedin || st;
    var liDot = liStatus === "posted" ? "posted" : liStatus === "ready" ? "ready" : "draft";
    // Only show if LI take is selected for this post
    var hasLiTake = (typeof linkedinReadyTakeIdx !== "undefined" && linkedinReadyTakeIdx[idx] !== undefined);
    if (!hasLiTake) return;
    var dk = dayKey(d);
    if (!dayMap[dk]) dayMap[dk] = [];
    dayMap[dk].push({ idx:idx, platform:"li", date:p.date, act:p.act, status:liStatus, dotClass:liDot, cssClass:"cal-post-li" });
    if (ps.facebook && ps.facebook !== "draft") {
      var fbDate = new Date(d); fbDate.setDate(fbDate.getDate() + 1);
      var fbk = dayKey(fbDate);
      if (!dayMap[fbk]) dayMap[fbk] = [];
      dayMap[fbk].push({ idx:idx, platform:"fb", date:p.date, act:p.act, status:ps.facebook, dotClass: ps.facebook==="posted"?"posted":"ready", cssClass:"cal-post-fb" });
    }
    if (ps.instagram && ps.instagram !== "draft") {
      var igDate = new Date(d); igDate.setDate(igDate.getDate() + 3);
      var igk = dayKey(igDate);
      if (!dayMap[igk]) dayMap[igk] = [];

  var today = new Date();

  var firstDay = new Date(calYear, calMonth, 1);

  var html = "";

  var allPosts = document.querySelectorAll(".cal-post[data-idx]");

(function initSideDrag() {
  const panel = g("side-panel");
  const handle = g("side-handle");
  let dragging = false, startX, startY, origX, origY;
  function onStart(e) {
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    const rect = panel.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
    panel.style.transition = "none";
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    let nx = origX + dx, ny = origY + dy;
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    nx = Math.max(0, Math.min(nx, vw - pw));
    ny = Math.max(0, Math.min(ny, vh - 40));
    sideX = nx; sideY = ny;
    panel.style.left = nx + "px"; panel.style.top = ny + "px"; panel.style.right = "auto";
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = "";
    savePositions();
  }
  handle.addEventListener("mousedown", onStart);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);
  handle.addEventListener("touchstart", onStart, {passive: false});
  window.addEventListener("touchmove", onMove, {passive: false});
  window.addEventListener("touchend", onEnd);
})();

function clearDragState() {
  var rows = document.querySelectorAll(".tl-row");
  rows.forEach(function(r) { r.classList.remove("dragging","drag-over"); });
}

function handleDragStart(e, i) {
  if (!reorderMode) return;
  dragIndex = i;
  e.currentTarget.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", String(i));
}

function handleDragEnd(e) {
  e.currentTarget.classList.remove("dragging");
  clearDragState();
  dragIndex = -1;
}

function handleDragOver(e) {
  if (!reorderMode) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  var row = e.currentTarget;

function handleDrop(e, targetIdx) {
  e.preventDefault();
  clearDragState();
  if (!reorderMode || dragIndex < 0 || dragIndex === targetIdx) return;

  // Reorder posts array
  var item = posts.splice(dragIndex, 1)[0];
  posts.splice(targetIdx, 0, item);

  // Reorder all per-index data structures
  function reorderIndexed(obj) {
    if (!obj) return;
    var keys = Object.keys(obj).map(Number).sort(function(a,b){ return a - b; });
    var entries = [];
    keys.forEach(function(k) { entries.push([k, obj[k]]); });
    // Remove then insert at new position
    if (dragIndex < entries.length) {
      var moved = entries.splice(dragIndex, 1)[0];
      entries.splice(targetIdx, 0, moved);
    }
    // Rebuild with new indices
    var result = {};
    entries.forEach(function(e, newIdx) { result[newIdx] = e[1]; });
    for (var k in obj) { if (obj.hasOwnProperty(k)) delete obj[k]; }
    for (var k in result) { if (result.hasOwnProperty(k)) obj[k] = result[k]; }
  }

  reorderIndexed(statuses);
  reorderIndexed(linkedinReadyTakeIdx);
  reorderIndexed(selectedTake);
  reorderIndexed(speechTakes);
  reorderIndexed(fuseSources);
  if (typeof platformStates !== "undefined") reorderIndexed(platformStates);
  if (typeof platformTexts !== "undefined") reorderIndexed(platformTexts);
  if (typeof collapsedImages !== "undefined") reorderIndexed(collapsedImages);
  if (typeof collapsedVideos !== "undefined") reorderIndexed(collapsedVideos);

  // ── Recalculate dates after reorder ──
  // Find the earliest existing date in the reordered posts
  var MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var earliest = null;
  for (var pi = 0; pi < posts.length; pi++) {
    var parts = posts[pi].date.split(" ");
    if (parts.length < 3) continue;
    var d = new Date(2026, MONTHS[parts[1]], parseInt(parts[2]));
    if (!earliest || d < earliest) earliest = d;
  }
  // Assign sequential weekday-only dates from earliest
  if (earliest) {
    var curDate = new Date(earliest);
    for (var pi = 0; pi < posts.length; pi++) {
      // Skip to next weekday if on weekend
      while (curDate.getDay() === 0 || curDate.getDay() === 6) {
        curDate.setDate(curDate.getDate() + 1);
      }
      var mn = Object.keys(MONTHS)[curDate.getMonth()]; // "Jul", "Aug", etc.
      posts[pi].date = DAYS[curDate.getDay()] + " " + mn + " " + curDate.getDate();
      curDate.setDate(curDate.getDate() + 1);
    }
  }

  // Restore current pointer
  if (current === dragIndex) current = targetIdx;
  else if (current > dragIndex && current <= targetIdx) current--;
  else if (current < dragIndex && current >= targetIdx) current++;

  dragIndex = -1;
  saveTakesMeta(); saveSelTake(); saveFuseSources(); saveStatuses(); savePositions();
  try { localStorage.setItem("arc-viz-linkedinReadyTakeIdx", JSON.stringify(linkedinReadyTakeIdx)); } catch(e) {}
  if (typeof platformStates !== "undefined") { try { localStorage.setItem("arc-viz-platformStates", JSON.stringify(platformStates)); } catch(e) {} }
  if (typeof platformTexts !== "undefined") { try { localStorage.setItem("arc-viz-platformTexts", JSON.stringify(platformTexts)); } catch(e) {} }
  if (typeof collapsedImages !== "undefined") { try { localStorage.setItem("arc-viz-collapsedImages", JSON.stringify(collapsedImages)); } catch(e) {} }
  if (typeof collapsedVideos !== "undefined") { try { localStorage.setItem("arc-viz-collapsedVideos", JSON.stringify(collapsedVideos)); } catch(e) {} }
  autoSave();
  // Persist reordered posts to disk so state-server sees current order
  try {
    fetch("http://127.0.0.1:9801/update-posts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ posts: posts.map(function(p) { return { date:p.date, act:p.act, spineIdx:p.spineIdx, spine:p.spine, body:p.body, image:p.image||null, video:p.video||null }; }) })
    });
  } catch(e) { /* non-critical */ }
  refresh();
}

(function initTimelineDrag() {
  const panel = g("tl-panel");
  const handle = g("tl-handle");
  let dragging = false, startX, startY, origX, origY;
  function onStart(e) {
    dragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    const rect = panel.getBoundingClientRect();
    origX = rect.left; origY = rect.top;
    panel.style.transition = "none";
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const pt = e.touches ? e.touches[0] : e;

    let nx = origX + dx, ny = origY + dy;

    panel.style.left = nx + "px"; panel.style.top = ny + "px"; panel.style.right = "auto";
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = "";
    savePositions();
  }
  handle.addEventListener("mousedown", onStart);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);
  handle.addEventListener("touchstart", onStart, {passive: false});
  window.addEventListener("touchmove", onMove, {passive: false});
  window.addEventListener("touchend", onEnd);
})();
