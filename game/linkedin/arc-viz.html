// ── IndexedDB for audio blobs ──
const DB_NAME = "arc-viz-takes";
let idb = null;
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (idb) return resolve(idb);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      if (!e.target.result.objectStoreNames.contains("audio"))
        e.target.result.createObjectStore("audio", { keyPath: "id" });
    };
    req.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}
function idbSave(id, blob) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").put({ id, blob });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  }));
}
function idbLoad(id) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readonly");
    const req = tx.objectStore("audio").get(id);
    req.onsuccess = () => resolve(req.result?.blob || null);
    req.onerror = () => reject(req.error);
  }));
}
function idbDel(id) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction("audio", "readwrite");
    tx.objectStore("audio").delete(id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  }));
}

// ── Download take audio as stereo WAV ──
async function downloadTakeAudio(idx) {
  const takes = speechTakes[current] || [];
  const take = takes[idx];
  if (!take || !take.id) return;
  try {
    let blob = await idbLoad(take.id);
    if (!blob) { alert("No audio found for this take."); return; }
    // Convert webm to WAV if needed
    if (blob.type && blob.type.includes("webm")) {
      try { blob = await webmToWav(blob); } catch(_) {}
    }
    // Ensure stereo 16-bit PCM WAV
    if (!blob || blob.size === 0) { alert("Could not convert audio."); return; }
    const label = take.type === "fused" ? "Fusion_" + (idx + 1) : "Take_" + (idx + 1);
    const spine = posts[current]?.spine || "take";
    const safeSpine = spine.replace(/[^a-z0-9]/gi,"_").slice(0,30);
    const name = safeSpine + "_" + label + ".wav";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    alert("Failed to export: " + e.message);
  }
}

// ── Load persisted metadata (with server bootstrap for fresh browsers) ──
(async function bootstrapTakes() {
  // 1. Try localStorage first
  let hasLocal = false;
  try {
    const saved = JSON.parse(localStorage.getItem("arc-viz-takes") || "{}");
    if (Object.keys(saved).length > 0) { Object.assign(speechTakes, saved); hasLocal = true; }
  } catch(e) {}
  
  // 2. If no localStorage, load from merged-all-takes.json on the server
  if (!hasLocal) {
    try {
      const resp = await fetch("merged-all-takes.json");
      if (resp.ok) {
        const data = await resp.json();
        for (const p of data.posts) {
          if (!p.takes || !p.takes.length) continue;
          speechTakes[p.index] = p.takes.map(t => ({
            id: t.id, type: t.type || "raw", transcript: t.transcript || "",
            duration: t.duration || 0, timestamp: t.timestamp || Date.now(),
            fusedFrom: t.fusedFrom || null,
            segments: t.segments || null,
            originalId: t.originalId || null, originalSegments: t.originalSegments || null
          }));
          if (p.selectedTake != null && p.selectedTake >= 0) selectedTake[p.index] = p.selectedTake;
        }
        if (data.fuseSources) { for (const k of Object.keys(data.fuseSources)) { if (Array.isArray(data.fuseSources[k])) fuseSources[k] = [...data.fuseSources[k]]; } }
      saveTakesMeta(); saveSelTake(); saveFuseSources();
      refresh(); // re-render after bootstrap load
    }
  } catch(e) { /* no file or server down — starting fresh is fine */ }
    
    // 3. Auto-load WAV audio into IndexedDB (for browsers that haven't cached it yet)
    try {
      const db = await idbOpen();
      for (const [idx, takes] of Object.entries(speechTakes)) {
        for (const t of takes) {
          if (t.type === "fused" || !t.id) continue;
          const existing = await new Promise(r => { const tx = db.transaction("audio", "readonly"); const req = tx.objectStore("audio").get(t.id); req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
          if (existing) continue;
          const wr = await fetch(t.id + ".wav");
          if (!wr.ok) continue;
          const buf = await wr.arrayBuffer();
          const blob = new Blob([buf], { type: "audio/wav" });
          await new Promise((resolve, reject) => { const tx = db.transaction("audio", "readwrite"); tx.objectStore("audio").put({ id: t.id, blob }); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
        }
      }
      } catch(e) { /* audio non-critical */ }
  }
  // 4. Load selectedTake + fuseSources from localStorage (now populated by bootstrap)
  try { const sel = JSON.parse(localStorage.getItem("arc-viz-selTake") || "{}"); Object.assign(selectedTake, sel); } catch(e) {}
  try { const srcs = JSON.parse(localStorage.getItem("arc-viz-fuseSources") || "{}"); for (const k of Object.keys(srcs)) { if (Array.isArray(srcs[k])) fuseSources[k] = [...srcs[k]]; } } catch(e) {}
  // 5. Load post statuses from localStorage
  try { const st = JSON.parse(localStorage.getItem("arc-viz-statuses") || "{}"); Object.assign(statuses, st); } catch(e) {}
  try { const ci = JSON.parse(localStorage.getItem("arc-viz-collapsedImages") || "{}"); Object.assign(collapsedImages, ci); } catch(e) {}
  try { const cv = JSON.parse(localStorage.getItem("arc-viz-collapsedVideos") || "{}"); Object.assign(collapsedVideos, cv); } catch(e) {}
  try { const lt = JSON.parse(localStorage.getItem("arc-viz-linkedinReadyTakeIdx") || "{}"); Object.assign(linkedinReadyTakeIdx, lt); } catch(e) {}
  // Auto-cleanup: remove linkedinReadyTakeIdx entries for out-of-range indices
  const maxIdx = posts.length - 1;
  let cleanedLiTake = false;
  for (const k of Object.keys(linkedinReadyTakeIdx)) {
    const idx = parseInt(k, 10);
    if (isNaN(idx) || idx < 0 || idx > maxIdx) { delete linkedinReadyTakeIdx[k]; cleanedLiTake = true; }
  }
  if (cleanedLiTake) { localStorage.setItem("arc-viz-linkedinReadyTakeIdx", JSON.stringify(linkedinReadyTakeIdx)); }
  try { const ps = JSON.parse(localStorage.getItem("arc-viz-platformStates") || "{}"); Object.assign(platformStates, ps); } catch(e) {}
  try { const pt = JSON.parse(localStorage.getItem("arc-viz-platformTexts") || "{}"); Object.assign(platformTexts, pt); } catch(e) {}
})().then(async () => {
  // localStorage is source of truth. Never let state-server overwrite user's browser selections.
  // State-server is a backup destination, not an authority.
  // Now safe to init UI — takes are loaded
  if (dark) {
    document.documentElement.setAttribute("data-theme", "dark");
    g("icon-sun").style.display = "none";
    g("icon-moon").style.display = "";
  }
  try {
    const saved = localStorage.getItem("arc-viz-fontSize");
    if (saved) fontSize = parseInt(saved, 10) || 17;
  } catch(e) {}
  applyFontSize();
  loadPositions();
  applyPositions();
  refresh();
  setupImageDrop();
});

const STATE_SERVER = "http://127.0.0.1:9801";
let _autoSavePending = false;

  _autoSavePending = true;
  try {
    const state = {
      speechTakes, selectedTake, fuseSources, statuses, linkedinReadyTakeIdx,

  }
  _autoSavePending = false;
}

    p.style.left = sideX + "px"; p.style.top = sideY + "px"; p.style.right = "auto";
  }
  if (tlX != null) { const p = g("tl-panel"); p.style.left = tlX + "px"; p.style.top = tlY + "px"; p.style.right = "auto"; }
  if (sideW != null) {
    const p = g("side-panel");
    p.style.width = sideW + "px"; p.style.height = sideH + "px";
    p.style.maxHeight = sideH + "px";
  }
}

function getSelectedTake(postIdx) {
  const takes = speechTakes[postIdx];
  if (!takes || !takes.length) return null;
  const idx = selectedTake[postIdx];
  if (idx != null && idx < takes.length) return takes[idx];
  return takes[takes.length - 1]; // fallback to last take
}

// ── WAV conversion (webm blob → stereo 16-bit PCM WAV) ──
function webmToWav(blob) {
  return new Promise((resolve, reject) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const reader = new FileReader();
    reader.onload = () => {
      ctx.decodeAudioData(reader.result, (buffer) => {
        const numChannels = Math.min(buffer.numberOfChannels, 2);
        const sampleRate = buffer.sampleRate;
        const length = buffer.length;
        const bitsPerSample = 16;
        const bytesPerSample = bitsPerSample / 8;
        const blockAlign = numChannels * bytesPerSample;
        const dataSize = length * blockAlign;
        const fileSize = 44 + dataSize;

        const wav = new ArrayBuffer(fileSize);
        const view = new DataView(wav);

        // RIFF header
        writeString(view, 0, "RIFF");
        view.setUint32(4, fileSize - 8, true);
        writeString(view, 8, "WAVE");

        // fmt chunk
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);           // chunk size
        view.setUint16(20, 1, true);            // PCM
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * blockAlign, true); // byte rate
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, bitsPerSample, true);

        // data chunk
        writeString(view, 36, "data");
        view.setUint32(40, dataSize, true);

        // interleave stereo PCM 16-bit
        const chData = [];
        for (let c = 0; c < numChannels; c++) chData.push(buffer.getChannelData(c));

        let offset = 44;
        for (let i = 0; i < length; i++) {
          for (let c = 0; c < numChannels; c++) {
            const sample = Math.max(-1, Math.min(1, chData[c][i]));
            const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            view.setInt16(offset, int16, true);
            offset += 2;
          }
        }

        ctx.close();
        resolve(new Blob([wav], { type: "audio/wav" }));
      }, () => {
        ctx.close();
        resolve(null); // decode failed, return null
      });
    };
    reader.onerror = () => { ctx.close(); resolve(null); };
    reader.readAsArrayBuffer(blob);
  });
}
function writeString(view, offset, str) {
  for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
}

// ── Mic ──
function toggleMic() { if (micOn) stopMic(); else startMic(); }

async function startMic() {
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) { alert("Speech recognition needs Chrome or Edge."); return; }
  rec = new Ctor();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  liveBase = ""; liveInterim = "";
  recSegments = []; recSegStart = 0;
  const recStartPerf = performance.now();
  rec.onresult = (e) => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    if (final) {
      const endMs = performance.now() - recStartPerf;
      recSegments.push({ text: final.trim(), startMs: recSegStart, endMs });
      recSegStart = endMs;
      liveBase += (liveBase ? " " : "") + final;
    }
    liveInterim = interim;
    g("speech-text").textContent = liveBase + (interim ? " " + interim : "") || "Listening…";
  };
  rec.onerror = () => stopMic();
  rec.onend = () => { if (micOn) { try { rec.start(); } catch(_) { stopMic(); } } };
  rec.start();

  // MediaRecorder for audio
  audioChunks = []; recStartTime = Date.now();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 2, echoCancellation: true, noiseSuppression: true }
    });
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.addEventListener("stop", () => { stream.getTracks().forEach(t => t.stop()); }, { once: true });
    mediaRecorder.start();
  } catch(_) { mediaRecorder = null; }

  micOn = true;
  g("speech-bar").classList.add("recording");
  g("btn-mic").classList.add("recording");
  g("mic-idle").style.display = "none";
  g("mic-rec").style.display = "";
}

async function stopMic() {
  micOn = false;
  try { rec?.stop(); } catch(_) {}
  rec = null;

  // stop audio recorder, get blob
  let audioBlob = null;
  let duration = Math.round((Date.now() - recStartTime) / 1000);
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    const mimeType = mediaRecorder.mimeType || "audio/webm";
    audioBlob = await new Promise(resolve => {
      mediaRecorder.addEventListener("stop", () => {
        resolve(new Blob(audioChunks, { type: mimeType }));
      }, { once: true });
      mediaRecorder.stop();
    });
  }
  mediaRecorder = null; audioChunks = [];

  // save take (or merge into re-record)
  const text = (liveBase || "").trim();
  const isReRecord = reRecordTakeIdx !== null;

  if (isReRecord) {
    // Merge new recording into the existing take at the re-record gap
    const takes = speechTakes[current], take = takes[reRecordTakeIdx];
    const newSegs = recSegments.length > 0 ? recSegments : [];
    const hasNewContent = text.length > 0 || newSegs.length > 0;
    let newRecBlob = null;
    if (audioBlob && audioBlob.size > 0) {
      try { newRecBlob = await webmToWav(audioBlob); } catch(_) {}
      if (!newRecBlob) newRecBlob = audioBlob;
    }

    let combinedSegs, combinedBlob = null;

    if (hasNewContent) {
      // Full re-record: pre + new + shifted-post
      const newRecDurMs = newSegs.length > 0 ? newSegs[newSegs.length - 1].endMs : duration * 1000;
      const timedNewSegs = newSegs.map(s => ({
        text: s.text,
        startMs: s.startMs + reRecordInsertMs,
        endMs: s.endMs + reRecordInsertMs
      }));
      const shiftedPost = reRecordPostSegs.map(s => ({
        ...s,
        startMs: s.startMs + newRecDurMs,
        endMs: s.endMs + newRecDurMs
      }));
      combinedSegs = [...reRecordPreSegs.map(s => ({ ...s })), ...timedNewSegs, ...shiftedPost];
      try {
        combinedBlob = await rebuildCombinedAudio(
          take.originalId || take.id, reRecordPreSegs, newRecBlob, reRecordPostSegs
        );
      } catch(e) { console.error("Audio rebuild failed:", e); }
    } else {
      // Empty re-record = pure snip: pre + post only
      combinedSegs = [...reRecordPreSegs.map(s => ({ ...s })), ...reRecordPostSegs.map(s => ({ ...s }))];
      try {
        combinedBlob = await rebuildAudioFromSegments(take, combinedSegs);
      } catch(e) { console.error("Snip rebuild failed:", e); }
    }

    if (combinedBlob) {
      const newId = "t_" + current + "_edit_" + Date.now();
      take.id = newId;
      take.segments = combinedSegs;
      take.transcript = combinedSegs.map(s => s.text).join(" ");
      const lastSeg = combinedSegs[combinedSegs.length - 1];
      take.duration = Math.round(lastSeg.endMs / 1000);
      await idbSave(newId, combinedBlob);
      selectedTake[current] = reRecordTakeIdx;
      saveTakesMeta(); saveSelTake();
      if (readMode === "original") readMode = "spoken";
    }

    reRecordPreSegs = []; reRecordPostSegs = [];
    reRecordTakeIdx = null; reRecordInsertMs = 0;
  } else if (text || audioBlob) {
    if (!speechTakes[current]) speechTakes[current] = [];
    const takeId = "t_" + current + "_" + Date.now();
    const segments = recSegments.length > 0 ? recSegments : [{ text, startMs: 0, endMs: duration * 1000 }];
    const take = { id: takeId, type: "raw", transcript: text, duration, timestamp: Date.now(), segments, originalId: takeId };
    speechTakes[current].push(take);
    if (audioBlob && audioBlob.size > 0) {
      try {
        const wav = await webmToWav(audioBlob);
        if (wav) await idbSave(takeId, wav);
        else await idbSave(takeId, audioBlob); // fallback to webm blob
      } catch(_) { try { await idbSave(takeId, audioBlob); } catch(__) {} }
    }
    selectedTake[current] = speechTakes[current].length - 1;
    saveTakesMeta(); saveSelTake();
    if (readMode === "original") readMode = "spoken";
    showSidePanel("takes"); // auto-show panel on takes tab after recording
  }

  liveBase = ""; liveInterim = "";
  g("speech-bar").classList.remove("recording");
  g("btn-mic").classList.remove("recording");
  g("mic-idle").style.display = "";
  g("mic-rec").style.display = "none";
  refresh();
}

// ── Takes list (rendered into side-panel) ──
function renderTakes() {
  const panel = g("side-panel"), list = g("takes-list"), countEl = g("takes-count");
  const takes = speechTakes[current] || [];
  const hasTakes = takes.length > 0;
  const minBtn = g("side-min-btn");

  // sync side-panel minimized state
  panel.classList.toggle("minimized", sidePanelMinimized);
  if (minBtn) minBtn.textContent = sidePanelMinimized ? "+" : "−";

  // render takes body content (only when takes tab is active)
  g("side-body-takes").style.display = sidePanelTab === "takes" ? "" : "none";
  if (sidePanelTab !== "takes") return; // don't render body unless on takes tab

  if (!hasTakes) {
    countEl.textContent = "";
    list.innerHTML = '<div class="takes-empty">No takes yet. Tap the mic to record.</div>';
    return;
  }

  countEl.textContent = takes.length === 1 ? "1 entry" : takes.length + " entries";

  // compute source selection state per post
  const srcSet = fuseSources[current] || [];
  const srcCount = srcSet.length;

  list.innerHTML = takes.map((take, i) => {
    const sel = selectedTake[current] === i;
    const isEditing = editingTakeIdx === i;
    const isFused = take.type === "fused";
    const isSource = srcSet.includes(i);
    const typeBadge = isFused ? '<span class="tl-take-count" style="margin-left:4px">✦</span>' : '<span class="tl-take-count" style="margin-left:4px;font-size:7px">🎤</span>';
    const label = isFused ? `Fusion ${i + 1}` : `Take ${i + 1}`;
    const preview = take.transcript ? take.transcript.slice(0, 60) + (take.transcript.length > 60 ? "…" : "") : "No transcript";
    const time = new Date(take.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const dur = take.duration ? take.duration + "s" : "";
    const hasAudio = !take.type || take.type === "raw";
    const srcBtn = `<button class="take-src-btn${isSource ? " source" : ""}" id="take-src-${i}" onclick="event.stopPropagation();toggleSource(${i})" title="${isSource ? "Remove as source" : "Mark as source"}">${isSource ? "●" : "○"}</button>`;

    if (isEditing) {
      return `<div class="take-row${sel ? " selected" : ""}" onclick="selectTake(${i})">
      ${srcBtn}
      ${hasAudio ? `<button class="take-play-btn" id="take-play-${i}" onclick="event.stopPropagation();playTake(${i})" title="Play">
        <svg class="take-play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
        <svg class="take-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>` : '<div class="take-play-btn" style="visibility:hidden"></div>'}
      <div class="take-info">
        <span class="take-label">${label}${typeBadge}</span>
        <textarea id="edit-textarea-${i}" class="take-edit-textarea" rows="3" onclick="event.stopPropagation()">${esc(take.transcript || "")}</textarea>
      </div>
      <div class="take-actions" style="flex-direction:column;gap:4px;">
        ${hasAudio ? `<button class="take-edit-btn" onclick="event.stopPropagation();enterAudioEdit(${i})">✂ Audio</button>` : ""}
        <button class="take-edit-save" onclick="event.stopPropagation();saveEdit(${i})">Save</button>
        <button class="take-edit-cancel" onclick="event.stopPropagation();cancelEdit()">Cancel</button>
      </div>
    </div>`;
    }
    return `<div class="take-row${sel ? " selected" : ""}" onclick="selectTake(${i})">
      ${srcBtn}
      ${hasAudio ? `<button class="take-play-btn" id="take-play-${i}" onclick="event.stopPropagation();playTake(${i})" title="Play">
        <svg class="take-play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
        <svg class="take-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>` : '<div class="take-play-btn" style="visibility:hidden"></div>'}
      <div class="take-info">
        <span class="take-label">${label}${typeBadge}</span>
        <span class="take-preview">${esc(preview)}</span>
        <span class="take-meta"><span>${time}</span>${dur ? "<span>" + dur + "</span>" : ""}</span>
      </div>
      <div class="take-actions">
        ${hasAudio ? `<button class="take-edit-btn" onclick="event.stopPropagation();enterAudioEdit(${i})">✂ Audio</button>` : ""}
        ${!isFused ? `<button class="take-edit-btn" onclick="event.stopPropagation();editTake(${i})">Amend</button>` : `<button class="take-edit-btn" onclick="event.stopPropagation();editTake(${i})">Edit</button>`}
        <br>
        ${hasAudio ? `<button class="take-edit-btn" onclick="event.stopPropagation();downloadTakeAudio(${i})" title="Save stereo WAV">⬇ WAV</button>` : ""}
        <button class="take-use-btn${sel ? " used" : ""}" onclick="event.stopPropagation();selectTake(${i})">${sel ? "Active" : "Use"}</button>
        <button class="take-del-btn" onclick="event.stopPropagation();deleteTake(${i})" title="Delete">×</button>
      </div>

  // If in audio edit mode, render segments
  if (audioEditTakeIdx !== null && takes[audioEditTakeIdx]) {
    renderSegments(takes[audioEditTakeIdx]);
    panel.classList.add("seg-mode");
  } else {
    panel.classList.remove("seg-mode");
  }
}

// ── Audio segment editor ──
function enterAudioEdit(takeIdx) {
  const takes = speechTakes[current] || [];
  const take = takes[takeIdx];
  if (!take || !take.segments || take.segments.length === 0) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  cleanupSegAudio();
  audioEditTakeIdx = takeIdx;
  audioEditSelected = new Set();
  sidePanelMinimized = false; // expand panel when editing audio
  renderTakes();
}

function exitAudioEdit() {
  cleanupSegAudio();
  audioEditTakeIdx = null;
  audioEditSelected = new Set();
  renderTakes();
}

function renderSegments(take) {
  const list = g("seg-list"), snipBtn = g("seg-snip-btn"), rerecordBtn = g("seg-rerecord-btn");
  const segs = take.segments || [];
  if (segs.length === 0) {
    list.innerHTML = '<div class="seg-empty">No timestamped segments for this take.</div>';
    return;
  }

  const fmtMs = (ms) => {
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const ds = Math.floor((ms % 1000) / 100);
    return `${m}:${String(s).padStart(2, "0")}.${ds}`;
  };

  list.innerHTML = segs.map((seg, i) => {
    const sel = audioEditSelected.has(i);
    return `<div class="seg-block${sel ? " selected" : ""}" id="seg-${i}" onclick="toggleSegment(${i})">
      <button class="seg-play-btn" id="seg-play-${i}" onclick="event.stopPropagation();playSegment(${i})" title="Play this segment">
        <svg id="seg-play-icon-${i}" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
        <svg id="seg-pause-icon-${i}" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <span class="seg-time">${fmtMs(seg.startMs)}<br>${fmtMs(seg.endMs)}</span>
      <span class="seg-text">${esc(seg.text)}</span>
    </div>`;
  }).join("");

  const hasSel = audioEditSelected.size > 0;
  snipBtn.parentElement.classList.toggle("has-sel", hasSel);
}

function toggleSegment(idx) {
  if (audioEditSelected.has(idx)) audioEditSelected.delete(idx);
  else audioEditSelected.add(idx);
  renderSegments(speechTakes[current][audioEditTakeIdx]);
}

let currentSegAudio = null; // separate from playTake's currentAudio, for segment-only playback

async function playSegment(segIdx) {
  if (audioEditTakeIdx === null) return;
  const takes = speechTakes[current];
  const take = takes[audioEditTakeIdx];
  if (!take || !take.segments || segIdx >= take.segments.length) return;
  const seg = take.segments[segIdx];

  const btn = g("seg-play-" + segIdx);
  if (!btn) return;

  // Stop if already playing this segment
  if (currentSegAudio && currentSegAudio._segBtn === btn) {
    currentSegAudio.pause();
    cleanupSegAudio();
    return;
  }

  // Stop any currently playing segment
  if (currentSegAudio) { currentSegAudio.pause(); cleanupSegAudio(); }

  // Stop any take-level audio
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  try {
    const blob = await idbLoad(take.id);
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentSegAudio = audio;
    currentSegAudio._segBtn = btn;
    currentSegAudio._segUrl = url;

    btn.classList.add("playing");
    const playIcon = btn.querySelector("svg:first-of-type");
    const pauseIcon = btn.querySelector("svg:last-of-type");
    if (playIcon) playIcon.style.display = "none";
    if (pauseIcon) pauseIcon.style.display = "";

    audio.currentTime = seg.startMs / 1000;

    const onTime = () => {
      if (audio.currentTime >= seg.endMs / 1000) {
        audio.pause();
        cleanupSegAudio();
      }
    };
    audio.addEventListener("timeupdate", onTime);

    const cleanup = () => {
      btn.classList.remove("playing");
      if (playIcon) playIcon.style.display = "";
      if (pauseIcon) pauseIcon.style.display = "none";
      audio.removeEventListener("timeupdate", onTime);
      URL.revokeObjectURL(url);
      if (currentSegAudio === audio) currentSegAudio = null;
    };
    audio.addEventListener("ended", cleanup);
    audio.addEventListener("error", cleanup);
    audio.addEventListener("pause", cleanup);

    await audio.play();
  } catch(_) {}
}

function cleanupSegAudio() {
  if (!currentSegAudio) return;
  const audio = currentSegAudio;
  const btn = audio._segBtn;
  const url = audio._segUrl;
  if (btn) {
    btn.classList.remove("playing");
    const pi = btn.querySelector("svg:first-of-type");
    const pa = btn.querySelector("svg:last-of-type");
    if (pi) pi.style.display = "";
    if (pa) pa.style.display = "none";
  }
  try { audio.pause(); } catch(_) {}
  if (url) URL.revokeObjectURL(url);
  currentSegAudio = null;
}

async function snipSelectedSegments() {
  if (audioEditSelected.size === 0 || audioEditTakeIdx === null) return;
  const takes = speechTakes[current];
  const take = takes[audioEditTakeIdx];
  const newSegs = take.segments.filter((_, i) => !audioEditSelected.has(i));
  if (newSegs.length === 0) { alert("Can't delete all segments — keep at least one."); return; }

  // Preserve original audio on first edit
  if (!take.originalSegments && !take.originalId) {
    take.originalSegments = [...take.segments];
    take.originalId = take.id;
  }

  try {
    const audioBlob = await rebuildAudioFromSegments(take, newSegs);
    if (audioBlob) {
      const newId = "t_" + current + "_edit_" + Date.now();
      take.id = newId;
      take.segments = newSegs;
      take.transcript = newSegs.map(s => s.text).join(" ");
      const dur = newSegs[newSegs.length - 1].endMs;
      take.duration = Math.round(dur / 1000);
      await idbSave(newId, audioBlob);
      saveTakesMeta(); saveSelTake();
    }
  } catch(e) { console.error("Snip failed:", e); alert("Snip failed: " + e.message); }

  audioEditSelected = new Set();
  renderTakes();
}

async function startReRecord() {
  if (audioEditSelected.size === 0 || audioEditTakeIdx === null) return;
  const takes = speechTakes[current];
  const take = takes[audioEditTakeIdx];

  // Snip first
  const newSegs = take.segments.filter((_, i) => !audioEditSelected.has(i));
  if (newSegs.length === 0) { alert("Can't replace all segments — keep at least one."); return; }

  // Find insertion point (index of first selected segment)
  const selIndices = [...audioEditSelected].sort((a, b) => a - b);
  const insertIdx = selIndices[0];

  // Preserve original on first edit
  if (!take.originalSegments && !take.originalId) {
    take.originalSegments = [...take.segments];
    take.originalId = take.id;
  }

  // Rebuild audio without selected segments but keep a gap pointer
  let beforeSegs = take.segments.slice(0, insertIdx);
  let insertMs = beforeSegs.length > 0 ? beforeSegs[beforeSegs.length - 1].endMs : 0;

  // Save the pre-snip state for rebuilding
  reRecordPreSegs = newSegs.slice(0, insertIdx);
  reRecordPostSegs = newSegs.slice(insertIdx);
  reRecordTakeIdx = audioEditTakeIdx;
  reRecordInsertMs = insertMs;

  audioEditSelected = new Set();
  cleanupSegAudio();
  audioEditTakeIdx = null;
  renderTakes();

  // Now start recording for replacement
  await startMic();
}

let reRecordPreSegs = [];    // segments before the re-record gap
let reRecordPostSegs = [];   // segments after the re-record gap
let reRecordTakeIdx = null;  // which take we're replacing into
let reRecordInsertMs = 0;    // time offset for the gap

// Override stopMic for re-record flow — handled in modified stopMic
// (We set a flag so stopMic knows it's a re-record)

async function rebuildAudioFromSegments(take, segments) {
  // Build audio from segments by slicing the existing audio blob
  let blob;
  try { blob = await idbLoad(take.originalId || take.id); }
  catch(_) { try { blob = await idbLoad(take.id); } catch(__) { return null; } }
  if (!blob) return null;

  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: 1, sampleRate: 44100 });
  const arrayBuf = await blob.arrayBuffer();
  let audioBuf;
  try { audioBuf = await ctx.decodeAudioData(arrayBuf.slice(0)); } catch(_) { return null; }

  const sampleRate = audioBuf.sampleRate;
  const ch = audioBuf.numberOfChannels;
  // Calculate total new duration
  const totalSamples = segments.reduce((sum, s) => {
    return sum + Math.ceil((s.endMs - s.startMs) / 1000 * sampleRate);
  }, 0);

  const outCtx = new OfflineAudioContext({ numberOfChannels: ch, length: totalSamples, sampleRate });
  const outBuf = outCtx.createBuffer(ch, totalSamples, sampleRate);

  let outOffset = 0;
  for (const seg of segments) {
    const startSample = Math.floor(seg.startMs / 1000 * sampleRate);
    const endSample = Math.ceil(seg.endMs / 1000 * sampleRate);
    const segLen = endSample - startSample;
    if (segLen <= 0) continue;
    for (let c = 0; c < ch; c++) {
      const srcData = audioBuf.getChannelData(c).slice(startSample, endSample);
      outBuf.getChannelData(c).set(srcData, outOffset);
    }
    outOffset += segLen;
  }

  // Render to WAV
  const source = outCtx.createBufferSource();
  source.buffer = outBuf;
  source.connect(outCtx.destination);
  source.start(0);

  const rendered = await outCtx.startRendering();
  return bufferToWav(rendered);
}

function bufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const format = 1; // PCM
  const bitsPerSample = 16;
  const data = [];
  for (let c = 0; c < numChannels; c++) data.push(buffer.getChannelData(c));
  const length = data[0].length;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = length * numChannels * bitsPerSample / 8;
  const headerSize = 44;
  const buffer2 = new ArrayBuffer(headerSize + dataSize);
  const view = new DataView(buffer2);

  const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
  writeString(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeString(36, "data");
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let c = 0; c < numChannels; c++) {
      let sample = Math.max(-1, Math.min(1, data[c][i]));
      sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
      view.setInt16(offset, sample, true);
      offset += 2;
    }
  }
  return new Blob([buffer2], { type: "audio/wav" });
}

async function rebuildCombinedAudio(origAudioId, preSegs, newRecBlob, postSegs) {
  // Load original audio
  let origBlob;
  try { origBlob = await idbLoad(origAudioId); } catch(_) { return null; }
  if (!origBlob) return null;

  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: 1, sampleRate: 44100 });

  // Decode original audio
  const origArr = await origBlob.arrayBuffer();
  const origBuf = await ctx.decodeAudioData(origArr.slice(0));
  const sampleRate = origBuf.sampleRate;
  const ch = origBuf.numberOfChannels;

  // Decode new recording
  let newBuf;
  if (newRecBlob) {
    const newArr = await newRecBlob.arrayBuffer();
    newBuf = await ctx.decodeAudioData(newArr.slice(0));
  } else {
    newBuf = ctx.createBuffer(ch, 0, sampleRate);
  }

  // Calculate total samples
  const totalSamples = preSegs.reduce((sum, s) =>
    sum + Math.ceil((s.endMs - s.startMs) / 1000 * sampleRate), 0)
    + newBuf.length
    + postSegs.reduce((sum, s) =>
      sum + Math.ceil((s.endMs - s.startMs) / 1000 * sampleRate), 0);

  const outCtx = new OfflineAudioContext({ numberOfChannels: ch, length: Math.max(1, totalSamples), sampleRate });
  const outBuf = outCtx.createBuffer(ch, Math.max(1, totalSamples), sampleRate);

  let outOff = 0;

  // Copy pre segments from original audio
  for (const seg of preSegs) {
    const ss = Math.floor(seg.startMs / 1000 * sampleRate);
    const es = Math.ceil(seg.endMs / 1000 * sampleRate);
    const len = es - ss;
    if (len <= 0) continue;
    for (let c = 0; c < ch; c++) {
      outBuf.getChannelData(c).set(origBuf.getChannelData(c).slice(ss, es), outOff);
    }
    outOff += len;
  }

  // Copy new recording
  for (let c = 0; c < ch; c++) {
    outBuf.getChannelData(c).set(newBuf.getChannelData(c), outOff);
  }
  outOff += newBuf.length;

  // Copy post segments from original audio
  for (const seg of postSegs) {
    const ss = Math.floor(seg.startMs / 1000 * sampleRate);
    const es = Math.ceil(seg.endMs / 1000 * sampleRate);
    const len = es - ss;
    if (len <= 0) continue;
    for (let c = 0; c < ch; c++) {
      outBuf.getChannelData(c).set(origBuf.getChannelData(c).slice(ss, es), outOff);
    }
    outOff += len;
  }

  const source = outCtx.createBufferSource();
  source.buffer = outBuf;
  source.connect(outCtx.destination);
  source.start(0);
  return bufferToWav(await outCtx.startRendering());
}

async function playTake(takeIdx) {
  const takes = speechTakes[current] || [], take = takes[takeIdx];
  if (!take) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  const btn = g("take-play-" + takeIdx);
  const playIcon = btn.querySelector(".take-play-icon");
  const pauseIcon = btn.querySelector(".take-pause-icon");

  // clicking currently-playing → stop
  if (btn.classList.contains("playing")) {
    btn.classList.remove("playing");
    if (playIcon) playIcon.style.display = "";
    if (pauseIcon) pauseIcon.style.display = "none";
    return;
  }

  // stop any other playing
  document.querySelectorAll(".take-play-btn").forEach(b => {
    b.classList.remove("playing");
    const pi = b.querySelector(".take-play-icon");
    const pa = b.querySelector(".take-pause-icon");
    if (pi) pi.style.display = "";
    if (pa) pa.style.display = "none";
  });

  try {
    const blob = await idbLoad(take.id);
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    btn.classList.add("playing");
    if (playIcon) playIcon.style.display = "none";
    if (pauseIcon) pauseIcon.style.display = "";
    const cleanup = () => {
      btn.classList.remove("playing");
      if (playIcon) playIcon.style.display = "";
      if (pauseIcon) pauseIcon.style.display = "none";
      URL.revokeObjectURL(url); currentAudio = null;
    };
    audio.addEventListener("ended", cleanup);
    audio.addEventListener("error", cleanup);
    audio.addEventListener("pause", cleanup);
    await audio.play();
  } catch(_) {}
}

function toggleSource(takeIdx) {
  if (!fuseSources[current]) fuseSources[current] = [];
  const srcs = fuseSources[current];
  const pos = srcs.indexOf(takeIdx);
  if (pos >= 0) srcs.splice(pos, 1);
  else srcs.push(takeIdx);
  saveFuseSources();
  renderTakes();
}

function selectTake(takeIdx) {
  const takes = speechTakes[current] || [];
  if (takeIdx < 0 || takeIdx >= takes.length) return;
  selectedTake[current] = takeIdx; saveSelTake();
  if (readMode === "original") readMode = "spoken";
  refresh();
}

async function deleteTake(takeIdx) {
  const takes = speechTakes[current] || [];
  if (takeIdx < 0 || takeIdx >= takes.length) return;
  const take = takes[takeIdx];
  try { await idbDel(take.id); } catch(_) {}
  takes.splice(takeIdx, 1);
  if (selectedTake[current] === takeIdx) { delete selectedTake[current]; }
  else if (selectedTake[current] > takeIdx) { selectedTake[current]--; }
  if (!takes.length) { delete speechTakes[current]; readMode = "original"; }
  else if (selectedTake[current] == null) { readMode = "original"; }
  // clean up fuseSources
  if (fuseSources[current]) {
    fuseSources[current] = fuseSources[current]
      .filter(idx => idx !== takeIdx)
      .map(idx => idx > takeIdx ? idx - 1 : idx);
    if (fuseSources[current].length === 0) delete fuseSources[current];
    saveFuseSources();
  }
  saveTakesMeta(); saveSelTake();
  refresh();
}

function editTake(takeIdx) { editingTakeIdx = takeIdx; renderTakes(); }

function saveEdit(takeIdx) {
  const takes = speechTakes[current] || [];
  if (takeIdx < 0 || takeIdx >= takes.length) return;
  const ta = g("edit-textarea-" + takeIdx);
  const text = (ta?.value || "").trim();
  if (text) { takes[takeIdx].transcript = text; saveTakesMeta(); }
  editingTakeIdx = null;
  refresh();
}

function cancelEdit() { editingTakeIdx = null; renderTakes(); }

/* ── THEME ── */
function toggleTheme() {
  dark = !dark;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "");
  g("icon-sun").style.display = dark ? "none" : "";
  g("icon-moon").style.display = dark ? "" : "none";
  refresh();
}

/* ── KEYBOARD ── */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight") { e.preventDefault(); navigate(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); navigate(-1); }
  // stop mic on copy (Ctrl+C / Cmd+C)
  if ((e.ctrlKey || e.metaKey) && e.key === "c" && micOn) { stopMic(); }
});
// also stop mic on any copy (right-click copy, edit menu)
document.addEventListener("copy", () => { if (micOn) stopMic(); });

/* ── PACKAGE (ZIP) ── */
function spineSlug(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9\s]/g, "").split(/\s+/).slice(0, 5).join("-") || "spine";
}
async function packageAll() {
  if (typeof JSZip === "undefined") { alert("JSZip not loaded — check your internet connection."); return; }
  const zip = new JSZip();
  const root = `meworld-package-${new Date().toISOString().slice(0,10)}`;
  const master = { exported: new Date().toISOString(), spine, posts: [] };
  let audioCount = 0;

  // capture current panel positions as percentages
  const vw = window.innerWidth, vh = window.innerHeight;
  const posRef = {
    viewport: { w: vw, h: vh },
    side: { xPct: sideX != null ? Math.round(sideX / vw * 10000) / 100 : null, yPct: sideY != null ? Math.round(sideY / vh * 10000) / 100 : null, wPct: sideW != null ? Math.round(sideW / vw * 10000) / 100 : null, hPct: sideH != null ? Math.round(sideH / vh * 10000) / 100 : null },
    timeline: { xPct: tlX != null ? Math.round(tlX / vw * 10000) / 100 : null, yPct: tlY != null ? Math.round(tlY / vh * 10000) / 100 : null },
  };
  master.positions = posRef;

  for (let i = 0; i < posts.length; i++) {
    const p = posts[i];
    const si = p.spineIdx != null && p.spineIdx < spine.length ? p.spineIdx : i;
    const slug = `${String(si).padStart(2,"0")}-${spineSlug(spine[si])}`;
    const folder = `${root}/posts/${slug}`;

    // post JSON
    const postEntry = {
      index: i, date: p.date, act: p.act, spineIdx: p.spineIdx,
      spine: p.spine, body: p.body, status: getStatus(i),
      takes: (speechTakes[i] || []).map(t => ({
        id: t.id, type: t.type, transcript: t.transcript,
        duration: t.duration, timestamp: t.timestamp, fusedFrom: t.fusedFrom || null,
        segments: t.segments || null, originalId: t.originalId || null, originalSegments: t.originalSegments || null
      })),
      selectedTake: selectedTake[i] ?? null
    };
    master.posts.push(postEntry);
    zip.file(`${folder}/post.json`, JSON.stringify(postEntry, null, 2));

    // audio files
    const takes = speechTakes[i] || [];
    for (let j = 0; j < takes.length; j++) {
      const take = takes[j];
      if (take.type === "fused") continue;
      try {
        const blob = await idbLoad(take.id);
        if (!blob) continue;
        zip.file(`${folder}/take-${j+1}.wav`, blob);
        audioCount++;
      } catch(_) {}
    }
  }

  // master JSON at root
  master.fuseSources = fuseSources;
  zip.file(`${root}/_master.json`, JSON.stringify(master, null, 2));
  // standalone positions reference
  zip.file(`${root}/positions.json`, JSON.stringify(posRef, null, 2));

  const zipBlob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement("a");
  a.href = url; a.download = `${root}.zip`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert(`Packaged ${master.posts.length} posts, ${audioCount} audio file${audioCount !== 1 ? "s" : ""}.`);
}
function saveSessionJSON() {
  const ts = new Date().toISOString();
  const tag = ts.slice(0,10);

  // Build full session snapshot
  const session = {
    exported: ts,
    type: "arc-viz-session",
    version: 1,
    spine,
    posts: posts.map((p, i) => {
      const takes = (speechTakes[i] || []).map(t => ({
        id: t.id, type: t.type || "raw",
        transcript: t.transcript || "",
        duration: t.duration || 0, timestamp: t.timestamp || null,
        fusedFrom: t.fusedFrom || null,
        segments: t.segments || null,
        originalId: t.originalId || null, originalSegments: t.originalSegments || null
      }));
      return {
        index: i, date: p.date, act: p.act,
        spineIdx: p.spineIdx, spine: p.spine,
        body: p.body,
        image: p.image || null,
        video: p.video || null,
        status: getStatus(i),
        linkedinReadyTakeIdx: linkedinReadyTakeIdx[i] != null ? linkedinReadyTakeIdx[i] : null,
        selectedTake: selectedTake[i] ?? null,
        takes,
        fuseSources: fuseSources[i] || []
      };
    }),
    fuseSources,
    settings: {
      dark, fontSize,
      collapsedImages, collapsedVideos,
      readMode
    },
    mediaManifest: posts.map((p, i) => ({
      index: i,
      image: p.image ? `linkedin/${p.image}` : null,
      video: p.video ? `linkedin/${p.video}` : null,
      audioCount: (speechTakes[i] || []).filter(t => t.type !== "fused").length
    }))
  };

  // Capture current panel positions as percentages for restoration
  const vw = window.innerWidth, vh = window.innerHeight;
  session.positions = {
    viewport: { w: vw, h: vh },
    sidePanel: {
      open: sidePanelOpen, minimized: sidePanelMinimized, tab: sidePanelTab,
      xPct: sideX != null ? Math.round(sideX / vw * 10000) / 100 : null,
      yPct: sideY != null ? Math.round(sideY / vh * 10000) / 100 : null,
      wPct: sideW != null ? Math.round(sideW / vw * 10000) / 100 : null,
      hPct: sideH != null ? Math.round(sideH / vh * 10000) / 100 : null
    },
    timeline: {
      xPct: tlX != null ? Math.round(tlX / vw * 10000) / 100 : null,
      yPct: tlY != null ? Math.round(tlY / vh * 10000) / 100 : null
    }
  };

  // Counts for the alert
  const postCount = session.posts.length;
  const takeCount = Object.values(speechTakes).reduce((a, v) => a + v.length, 0);
  const mediaCount = session.mediaManifest.filter(m => m.image || m.video).length;

  // Download
  const json = JSON.stringify(session, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `meworld-session-${tag}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

  alert(`Session saved.\n\n${postCount} posts\n${takeCount} speech takes\n${mediaCount} media references\n\nFile: meworld-session-${tag}.json`);
}
async function importTakes() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json";
  input.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const raw = await file.text();
      const data = JSON.parse(raw);
      if (!data.posts || !Array.isArray(data.posts)) { alert("Invalid export file — no posts array"); return; }
      let imported = 0;
      for (const pi of data.posts) {
        if (!pi.takes || !pi.takes.length) continue;
        // import transcripts for this post
        speechTakes[pi.index] = pi.takes.map(t => ({
          id: t.id, type: t.type || "raw", transcript: t.transcript,
          duration: t.duration || 0, timestamp: t.timestamp || Date.now(),
          fusedFrom: t.fusedFrom || null,
          segments: t.segments || null,
          originalId: t.originalId || null,
          originalSegments: t.originalSegments || null
        }));
        if (pi.selectedTake != null) selectedTake[pi.index] = pi.selectedTake;
        imported++;
      }
      if (imported > 0 && data.fuseSources) {
        for (const k of Object.keys(data.fuseSources)) {
          if (Array.isArray(data.fuseSources[k])) fuseSources[k] = [...data.fuseSources[k]];
        }
        saveFuseSources();
      }
      saveTakesMeta(); saveSelTake();
      // Try loading audio from local server WAVs
      let audioLoaded = 0;
      try {
        const db = await idbOpen();
        for (const pi of data.posts) {
          if (!pi.takes || !pi.takes.length) continue;
          for (const t of pi.takes) {
            if (t.type === "fused" || !t.id) continue;
            const existing = await new Promise(r => { const tx = db.transaction("audio", "readonly"); const req = tx.objectStore("audio").get(t.id); req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
            if (existing) continue;
            try {
              const wr = await fetch(t.id + ".wav");
              if (!wr.ok) continue;
              const buf = await wr.arrayBuffer();
              const blob = new Blob([buf], { type: "audio/wav" });
              await new Promise((resolve, reject) => { const tx = db.transaction("audio", "readwrite"); tx.objectStore("audio").put({ id: t.id, blob }); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
              audioLoaded++;
            } catch(wavErr) {}
          }
        }
      } catch(e) {}
      const msg = `Imported ${imported} post${imported !== 1 ? "s" : ""} with ${audioLoaded} audio file${audioLoaded !== 1 ? "s" : ""} restored.`;
      alert(msg);
      refresh();
    } catch(err) {
      alert("Failed to parse export file: " + (err.message || err));
    }
  };
  input.click();
}
