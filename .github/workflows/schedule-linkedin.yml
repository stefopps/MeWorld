name: Schedule LinkedIn Posts

# Runs Mon/Wed/Fri at 7:00 AM ET (11:00 AM UTC)
# Your PC can be off — GitHub's servers handle it.
# LinkedIn posts that are marked "ready" with a LI take selected will auto-publish.

on:
  schedule:
    - cron: '0 11 * * 1,3,5'
  workflow_dispatch:

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run LinkedIn scheduler
        working-directory: game/linkedin
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: node github-scheduler.js

      - name: Commit state update (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "Beiza Scheduler"
            git config user.email "scheduler@beiza.ai"
            git add game/linkedin/state-autosave/latest.json
            git commit -m "Auto: LinkedIn post status update for $(date +'%a %b %d')"
            git push
          fi
